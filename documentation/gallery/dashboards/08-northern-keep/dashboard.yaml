# Northern Keep: a northern castle dashboard built from Magic Cards. edit that, not this file.
title: Northern Keep
views:
  - type: sections
    max_columns: 4
    path: keep
    title: Northern Keep
    icon: mdi:castle
    theme: Northern Keep
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Keep header
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D''http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg''%20width%3D''96''%20height%3D''48''%3E%3Cpath%20d%3D''M0%2023.5H96M0%2047.5H96M0.75%200V23.5M48.75%2024V47.5''%20fill%3D''none''%20stroke%3D''rgba(0%2C0%2C0%2C0.30)''%20stroke-width%3D''1.5''%2F%3E%3Cpath%20d%3D''M0%201H96M0%2025H96M2%200V23M50%2024V47''%20fill%3D''none''%20stroke%3D''rgba(255%2C255%2C255%2C0.035)''%20stroke-width%3D''1''%2F%3E%3C%2Fsvg%3E"), linear-gradient(180deg, #262f38 0%, #1b2229 100%)'
            border_radius: 6px
            padding: 18px 18px 16px
            box_shadow: inset 0 0 0 1px rgba(169,194,212,0.13), inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 28px rgba(0,0,0,0.5)
            css: 'font-family: ''IM Fell English'', Lora, Georgia, serif; color: #e9eef2'
            animations:
              - id: snow
                preset: snow-fall
                intensity: 9
                color: '#ffffff'
                strength: 45
                duration: 9s
            rows:
              - id: crest
                column_widths:
                  - 62px
                  - 1fr
                gap: 16px
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          width: 62px
                          height: 80px
                          padding_bottom: 12px
                          box_sizing: border-box
                          display: flex
                          align_items: center
                          justify_content: center
                          background: 'linear-gradient(180deg, #727c87 0%, #4f5862 100%)'
                          border_top: '4px solid #e8833a'
                          css: 'clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%)'
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg viewBox="0 0 64 64"><path fill="currentColor" d="M32 3 L44 19 H38 L50 34 H42 L55 50 H35 V61 H29 V50 H9 L22 34 H14 L26 19 H20 Z"/></svg>
                            size: 40px
                            design:
                              color: '#e9eef2'
                  - gap: 4px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Northern Keep
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: clamp(20px, 6vw, 26px)
                          font_weight: '700'
                          letter_spacing: 3px
                          color: '#e9eef2'
                          line_height: '1.15'
                          white_space: nowrap
                          text_transform: uppercase
                          text_shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 18px rgba(169,194,212,0.25)
                      - type: text
                        text: Stone walls · Warm hearths
                        design:
                          font_family: '''IM Fell English'', Lora, Georgia, serif'
                          font_size: 15px
                          color: '#a9c2d4'
                          line_height: '1.3'
                          font_style: italic
              - id: rule
                columns:
                  - modules:
                      - type: separator
                        separator_style: none
                        design:
                          height: 1px
                          background: 'linear-gradient(90deg, #e8833a 0%, rgba(232,131,58,0.15) 70%, transparent 100%)'
              - id: time
                column_widths:
                  - auto
                  - 1fr
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: 56px
                          font_weight: '700'
                          letter_spacing: 2px
                          color: '#e9eef2'
                          line_height: '1'
                          text_shadow: 0 2px 0 rgba(0,0,0,0.55)
                  - gap: 4px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}'
                        design:
                          font_family: '''IM Fell English'', Lora, Georgia, serif'
                          font_size: 18px
                          color: '#e9eef2'
                          line_height: '1.3'
                          text_align: right
                          font_style: italic
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: 11px
                          font_weight: '700'
                          letter_spacing: 2.5px
                          text_transform: uppercase
                          color: '#a9c2d4'
                          text_align: right
              - id: status
                layout: 1-1-1
                gap: 8px
                columns:
                  - modules:
                      - type: vertical
                        gap: 3px
                        design:
                          padding: 8px 10px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.22)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.14)
                          cursor: pointer
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:shield-half-full
                                size: 14px
                                design:
                                  color: '#a9c2d4'
                              - type: text
                                text: The guard
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                                  white_space: nowrap
                          - type: text
                            text: On duty
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 16px
                              color: '#e9eef2'
                              line_height: '1.3'
                            display:
                              mode: every
                              conditions:
                                - type: state
                                  entity: alarm_control_panel.home
                                  state_not: disarmed
                                - type: state
                                  entity: alarm_control_panel.home
                                  state_not: triggered
                          - type: text
                            text: Stands down
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 16px
                              color: '#8f9ca8'
                              line_height: '1.3'
                            display:
                              conditions:
                                - type: state
                                  entity: alarm_control_panel.home
                                  state: disarmed
                          - type: text
                            text: Breached!
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 16px
                              color: '#d4483b'
                              line_height: '1.3'
                              animations:
                                - id: b
                                  preset: blink
                                  intensity: 60
                                  duration: 1s
                            display:
                              conditions:
                                - type: state
                                  entity: alarm_control_panel.home
                                  state: triggered
                        actions:
                          tap_action:
                            action: more-info
                            entity: alarm_control_panel.home
                  - modules:
                      - type: vertical
                        gap: 3px
                        design:
                          padding: 8px 10px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.22)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.14)
                          cursor: pointer
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:account-group
                                size: 14px
                                design:
                                  color: '#a9c2d4'
                              - type: text
                                text: In the keep
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                                  white_space: nowrap
                          - type: text
                            use_template: true
                            text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of 3'
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 16px
                              color: '#e9eef2'
                              line_height: '1.3'
                        actions:
                          tap_action:
                            action: more-info
                            entity: person.anna
                  - modules:
                      - type: vertical
                        gap: 3px
                        design:
                          padding: 8px 10px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.22)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.14)
                          cursor: pointer
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:email-outline
                                size: 14px
                                design:
                                  color: '#e8833a'
                              - type: text
                                text: Letters
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                                  white_space: nowrap
                          - type: text
                            use_template: true
                            text: '{{ states(''todo.chores'') }} waiting'
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 16px
                              color: '#ffc266'
                              line_height: '1.3'
                        actions:
                          tap_action:
                            action: more-info
                            entity: todo.chores
            grid_options:
              columns: 12
              rows: auto
          - type: custom:magic-card
            name: Weather
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D''http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg''%20width%3D''96''%20height%3D''48''%3E%3Cpath%20d%3D''M0%2023.5H96M0%2047.5H96M0.75%200V23.5M48.75%2024V47.5''%20fill%3D''none''%20stroke%3D''rgba(0%2C0%2C0%2C0.30)''%20stroke-width%3D''1.5''%2F%3E%3Cpath%20d%3D''M0%201H96M0%2025H96M2%200V23M50%2024V47''%20fill%3D''none''%20stroke%3D''rgba(255%2C255%2C255%2C0.035)''%20stroke-width%3D''1''%2F%3E%3C%2Fsvg%3E"), linear-gradient(180deg, #262f38 0%, #1b2229 100%)'
            border_radius: 6px
            padding: 16px
            box_shadow: inset 0 0 0 1px rgba(169,194,212,0.13), inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 28px rgba(0,0,0,0.5)
            css: 'font-family: ''IM Fell English'', Lora, Georgia, serif; color: #e9eef2'
            rows:
              - id: head
                column_widths:
                  - 1fr
                  - auto
                gap: 10px
                columns:
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Frost on the wind
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: 17px
                          font_weight: '700'
                          letter_spacing: 2px
                          color: '#e9eef2'
                          line_height: '1.15'
                          text_transform: uppercase
                  - vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: icon
                            icon: mdi:weather-partly-cloudy
                            size: 18px
                            design:
                              color: '#a9c2d4'
                            entity: weather.home
                            use_entity_icon: true
                          - type: text
                            use_entity: true
                            entity: weather.home
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 14px
                              color: '#a9c2d4'
                              line_height: '1.3'
                              white_space: nowrap
              - id: scene
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          height: 196px
                          position: relative
                          overflow: hidden
                          border_radius: 4px
                          box_sizing: border-box
                          background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D''http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg''%20viewBox%3D''0%200%20400%2090''%20preserveAspectRatio%3D''none''%3E%3Cpath%20d%3D''M0%2090%20V58%20L36%2036%20L62%2050%20L104%2016%20L146%2048%20L186%2028%20L226%2054%20L268%2022%20L310%2046%20L350%2030%20L400%2052%20V90%20Z''%20fill%3D''%23324250''%2F%3E%3Cpath%20d%3D''M104%2016%20L92%2026%20L100%2024%20L106%2030%20L114%2024%20Z%20M268%2022%20L258%2031%20L266%2029%20L272%2034%20L278%2030%20Z%20M186%2028%20L178%2035%20L186%2034%20L192%2037%20Z''%20fill%3D''%23c9d8e3''%20fill-opacity%3D''0.7''%2F%3E%3Cpath%20d%3D''M0%2090%20V72%20C60%2062%20120%2076%20200%2068%20C280%2060%20340%2074%20400%2066%20V90%20Z''%20fill%3D''%23dfe8ef''%2F%3E%3C%2Fsvg%3E") bottom / 100% 92px no-repeat, radial-gradient(ellipse at 50% 0%, #34495c 0%, #16212c 70%)'
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.15)
                          animations:
                            - id: winter
                              preset: winter
                              intensity: 60
                              strength: 90
                        modules:
                          - type: vertical
                            gap: 2px
                            align: center
                            design:
                              width: 230px
                              margin: 28px auto 0
                              padding: 10px 14px 12px
                              box_sizing: border-box
                              background: 'radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10) 0%, transparent 60%), linear-gradient(180deg, #808a95 0%, #5c6670 100%)'
                              border_radius: 8px 8px 3px 3px
                              border_top: '7px solid #eef4f8'
                              box_shadow: 0 14px 26px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.25)
                            modules:
                              - type: text
                                text: Outside the walls
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 2px
                                  text_transform: uppercase
                                  color: '#3c4650'
                                  text_align: center
                                  text_shadow: 0 1px 0 rgba(255,255,255,0.18)
                              - type: text
                                use_entity: true
                                entity: sensor.outdoor_temperature
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 54px
                                  font_weight: '700'
                                  letter_spacing: 1px
                                  color: '#2b333b'
                                  line_height: '1.05'
                                  text_align: center
                                  text_shadow: 0 1px 0 rgba(255,255,255,0.35), 0 -1px 1px rgba(0,0,0,0.75)
              - id: facts
                layout: 1-1-1
                gap: 8px
                columns:
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          padding: 8px 4px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.18)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.12)
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:water-percent
                                size: 15px
                                design:
                                  color: '#a9c2d4'
                              - type: text
                                text: Damp
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                          - type: text
                            use_entity: true
                            entity: weather.home
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
                              font_size: 17px
                              font_weight: '700'
                              letter_spacing: 0.5px
                              color: '#e9eef2'
                              line_height: '1.15'
                              text_align: center
                            attribute: humidity
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          padding: 8px 4px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.18)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.12)
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:weather-windy
                                size: 15px
                                design:
                                  color: '#a9c2d4'
                              - type: text
                                text: Gusts
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                          - type: text
                            use_entity: true
                            entity: sensor.wind_gust
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
                              font_size: 17px
                              font_weight: '700'
                              letter_spacing: 0.5px
                              color: '#e9eef2'
                              line_height: '1.15'
                              text_align: center
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          padding: 8px 4px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.18)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.12)
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - type: icon
                                icon: mdi:weather-snowy-heavy
                                size: 15px
                                design:
                                  color: '#a9c2d4'
                              - type: text
                                text: Fallen
                                design:
                                  font_family: Cinzel, 'Playfair Display', Georgia, serif
                                  font_size: 10px
                                  font_weight: '700'
                                  letter_spacing: 1.5px
                                  text_transform: uppercase
                                  color: '#8f9ca8'
                          - type: text
                            use_entity: true
                            entity: sensor.rain_today
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
                              font_size: 17px
                              font_weight: '700'
                              letter_spacing: 0.5px
                              color: '#e9eef2'
                              line_height: '1.15'
                              text_align: center
              - id: sun
                columns:
                  - modules:
                      - type: horizontal
                        gap: 7px
                        align: center
                        design:
                          padding: 7px 10px
                          border_radius: 3px
                          background_color: rgba(0,0,0,0.18)
                          box_shadow: inset 0 0 0 1px rgba(169,194,212,0.12)
                        modules:
                          - type: icon
                            icon: mdi:weather-sunset-up
                            size: 16px
                            design:
                              color: '#ffc266'
                          - type: text
                            text: First light
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
                              font_size: 10px
                              font_weight: '700'
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#8f9ca8'
                          - type: text
                            use_entity: true
                            entity: sensor.sunrise
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 15px
                              color: '#e9eef2'
                              line_height: '1.3'
                              white_space: nowrap
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              height: 1px
                              background: rgba(169,194,212,0.15)
                          - type: icon
                            icon: mdi:weather-sunset-down
                            size: 16px
                            design:
                              color: '#a9c2d4'
                          - type: text
                            text: Nightfall
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
                              font_size: 10px
                              font_weight: '700'
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#8f9ca8'
                          - type: text
                            use_entity: true
                            entity: sensor.sunset
                            design:
                              font_family: '''IM Fell English'', Lora, Georgia, serif'
                              font_size: 15px
                              color: '#e9eef2'
                              line_height: '1.3'
                              white_space: nowrap
              - id: forecast
                columns:
                  - modules:
                      - type: forecast
                        entity: weather.home
                        forecast_type: daily
                        num_forecasts: 5
                        show_temperature: true
                        show_precipitation: false
                        show_wind: false
                        animated_icons: false
                        design:
                          color: '#e9eef2'
                          font_family: '''IM Fell English'', Lora, Georgia, serif'
                          padding: 6px 0 0
                          border_top: 1px solid rgba(169,194,212,0.15)
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: custom:magic-card
            name: Heading · hearths
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D''http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg''%20width%3D''96''%20height%3D''48''%3E%3Cpath%20d%3D''M0%2023.5H96M0%2047.5H96M0.75%200V23.5M48.75%2024V47.5''%20fill%3D''none''%20stroke%3D''rgba(0%2C0%2C0%2C0.30)''%20stroke-width%3D''1.5''%2F%3E%3Cpath%20d%3D''M0%201H96M0%2025H96M2%200V23M50%2024V47''%20fill%3D''none''%20stroke%3D''rgba(255%2C255%2C255%2C0.035)''%20stroke-width%3D''1''%2F%3E%3C%2Fsvg%3E"), linear-gradient(180deg, #262f38 0%, #1b2229 100%)'
            border_radius: 6px
            box_shadow: inset 0 0 0 1px rgba(169,194,212,0.13), inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 28px rgba(0,0,0,0.5)
            padding: 0 16px
            card_height: 56px
            css: 'font-family: Cinzel, ''Playfair Display'', Georgia, serif; justify-content: center; box-sizing: border-box'
            rows:
              - id: h
                column_widths:
                  - auto
                  - 1fr
                  - auto
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: icon
                            icon: mdi:fireplace
                            size: 20px
                            design:
                              color: '#e8833a'
                          - type: text
                            text: Hearths & halls
                            design:
                              font_family: Cinzel, 'Playfair Display', Georgia, serif
