# Hunter's Keep dashboard (theme "Mountain Keep"). edit the generator, not this file.
title: Hunter's Keep
views:
  - type: sections
    max_columns: 4
    path: keep
    title: Hunter's Keep
    icon: mdi:castle
    theme: Mountain Keep
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero
            background: 'radial-gradient(ellipse 70% 90% at 100% 0%, rgba(242,169,59,0.16), transparent 60%), radial-gradient(ellipse 60% 70% at 0% 100%, rgba(163,32,28,0.22), transparent 65%), repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 26px), repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 54px), linear-gradient(170deg, #26221e 0%, #161311 100%)'
            border_radius: 14px
            padding: 18px
            box_shadow: 0 16px 34px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(217,221,226,0.10), inset 0 1px 0 rgba(255,210,122,0.08)
            css: 'font-family: Alegreya, Lora, Georgia, serif; color: #ece4d6;'
            custom_animations:
              - id: ember-rise
                name: Rising embers
                kind: particles
                duration: 5
                iterations: infinite
                particles: {count: 10, direction: rise, speed: 1, size: [2, 4], colors: ['#ffb347', '#ff7a2e', '#ffd27a'], fade: true, spread: 70, gravity: -0.2, layer: back}
            animations: [{id: embers, preset: custom:ember-rise, color: '#f2a93b'}]
            rows:
              - id: crest
                column_widths: [1fr, auto]
                gap: 12px
                columns:
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: High in the mountains
                        design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 11px, font_weight: '700', letter_spacing: 3px, text_transform: uppercase, color: '#f2a93b'}
                      - type: text
                        text: Hunter's Keep
                        design:
                          font_family: '''Pirata One'', ''Playfair Display'', Georgia, serif'
                          font_size: 46px
                          color: '#d9dde2'
                          line_height: '1.05'
                          letter_spacing: 1px
                          text_shadow: '0 2px 0 #000, 0 0 18px rgba(163,32,28,0.45)'
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, hunter'
                        design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 16px, font_style: italic, color: '#d6c08e', margin_top: 4px}
                  - gap: 0px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: 40px
                          font_weight: '700'
                          color: '#ffd27a'
                          line_height: '1'
                          text_align: right
                          text_shadow: 0 0 16px rgba(242,169,59,0.45)
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, color: '#8f8478', text_align: right, margin_top: 6px, white_space: nowrap}
              - id: rule
                columns:
                  - modules:
                      - type: separator
                        separator_style: none
                        design: {height: 1px, margin: 2px 0, background: 'linear-gradient(90deg, transparent, #a3201c 18%, #d0342c 50%, #a3201c 82%, transparent)', opacity: '0.85'}
              - id: status
                layout: 1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 10px, border_radius: 999px, background_color: 'rgba(0,0,0,0.35)', border: '1px solid rgba(217,221,226,0.14)', justify_content: center}
                        modules:
                          - {type: icon, icon: mdi:lock, size: 16px, design: {color: '#7fae6a', display: flex}}
                          - {type: text, text: Gate barred, design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_weight: '700', color: '#ece4d6', white_space: nowrap}}
                        display: {conditions: [{type: state, entity: lock.front_door, state: locked}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 10px, border_radius: 999px, background_color: 'rgba(0,0,0,0.35)', border: '1px solid rgba(217,221,226,0.14)', justify_content: center}
                        modules:
                          - {type: icon, icon: mdi:lock-open-variant, size: 16px, design: {color: '#d0342c', display: flex}}
                          - {type: text, text: Gate open, design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_weight: '700', color: '#ece4d6', white_space: nowrap}}
                        display: {conditions: [{type: state, entity: lock.front_door, state_not: locked}]}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 10px, border_radius: 999px, background_color: 'rgba(0,0,0,0.35)', border: '1px solid rgba(217,221,226,0.14)', justify_content: center}
                        modules:
                          - {type: icon, icon: mdi:alert-decagram, size: 16px, design: {color: '#f2a93b', display: flex}}
                          - {type: text, text: Charm hums, design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_weight: '700', color: '#ece4d6', white_space: nowrap}}
                        display: {mode: any, conditions: [{type: state, entity: binary_sensor.hall_motion, state: 'on'}, {type: state, entity: binary_sensor.patio_motion, state: 'on'}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 10px, border_radius: 999px, background_color: 'rgba(0,0,0,0.35)', border: '1px solid rgba(217,221,226,0.14)', justify_content: center}
                        modules:
                          - {type: icon, icon: mdi:shield-check, size: 16px, design: {color: '#7fae6a', display: flex}}
                          - {type: text, text: Charm still, design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_weight: '700', color: '#ece4d6', white_space: nowrap}}
                        display: {mode: every, conditions: [{type: state, entity: binary_sensor.hall_motion, state: 'off'}, {type: state, entity: binary_sensor.patio_motion, state: 'off'}]}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 10px, border_radius: 999px, background_color: 'rgba(0,0,0,0.35)', border: '1px solid rgba(217,221,226,0.14)'}
                        modules:
                          - {type: icon, icon: mdi:paw, size: 16px, design: {color: '#d9dde2', display: flex}}
                          - type: text
                            use_template: true
                            text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of 3 home'
                            design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_weight: '700', color: '#ece4d6', white_space: nowrap}
              - id: foot
                padding: 2px 0 0
                columns:
                  - modules:
                      - type: text
                        text: Wind howls over the high passes
                        design: {font_family: 'Alegreya, Lora, Georgia, serif', font_size: 13px, font_style: italic, color: '#8f8478', text_align: center, letter_spacing: 0.5px}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Weather
            background: 'radial-gradient(ellipse 90% 60% at 50% -10%, rgba(242,169,59,0.10), transparent 60%), repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 7px), linear-gradient(170deg, #1c1713 0%, #14100d 100%)'
            border_radius: 14px
            padding: 16px
            box_shadow: 0 16px 34px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(217,221,226,0.10), inset 0 1px 0 rgba(255,210,122,0.08)
            css: 'font-family: Alegreya, Lora, Georgia, serif; color: #ece4d6;'
            rows:
              - id: head
                columns:
                  - gap: 2px
                    modules:
                      - type: text
                        text: Weather
                        design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 11px, font_weight: '700', letter_spacing: 3px, text_transform: uppercase, color: '#f2a93b'}
                      - type: text
                        text: Omens of the sky
                        design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 19px, font_weight: '700', letter_spacing: 1px, color: '#d9dde2', line_height: '1.15'}
              - id: sky
                design:
                  padding: 6px 10px
                  border_radius: 10px
                  background_color: rgba(0,0,0,0.28)
                  border: 1px solid rgba(217,221,226,0.08)
                  animations: [{id: mist, preset: fog, intensity: 40, strength: 35}]
                columns:
                  - modules:
                      - type: weather
                        entity: weather.home
                        show_temperature: true
                        show_condition: true
                        show_forecast: true
                        forecast_days: 5
                        animated_icons: true
                        design: {color: '#ece4d6', font_family: 'Alegreya, Lora, Georgia, serif'}
              - id: stats
                layout: 1-1-1
                gap: 8px
                columns:
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 8px 4px, border_radius: 6px, background: 'linear-gradient(180deg, #e8d8b0, #d6c08e)', box_shadow: '0 4px 10px rgba(0,0,0,0.4)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:thermometer, size: 16px, design: {color: '#f2a93b', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.outdoor_temperature
                                design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#2a1d10', white_space: nowrap}
                          - type: text
                            text: Outside
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 11px
                              font_weight: '700'
                              color: '#6a4a26'
                              text_transform: uppercase
                              letter_spacing: 1.5px
                              text_align: center
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 8px 4px, border_radius: 6px, background: 'linear-gradient(180deg, #e8d8b0, #d6c08e)', box_shadow: '0 4px 10px rgba(0,0,0,0.4)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:weather-windy, size: 16px, design: {color: '#f2a93b', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.wind_gust
                                design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#2a1d10', white_space: nowrap}
                          - type: text
                            text: Gusts
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 11px
                              font_weight: '700'
                              color: '#6a4a26'
                              text_transform: uppercase
                              letter_spacing: 1.5px
                              text_align: center
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 8px 4px, border_radius: 6px, background: 'linear-gradient(180deg, #e8d8b0, #d6c08e)', box_shadow: '0 4px 10px rgba(0,0,0,0.4)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:weather-pouring, size: 16px, design: {color: '#f2a93b', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.rain_today
                                design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#2a1d10', white_space: nowrap}
                          - type: text
                            text: Rain
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 11px
                              font_weight: '700'
                              color: '#6a4a26'
                              text_transform: uppercase
                              letter_spacing: 1.5px
                              text_align: center
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: People
            background: 'radial-gradient(ellipse 90% 60% at 50% -10%, rgba(242,169,59,0.10), transparent 60%), repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 7px), linear-gradient(170deg, #1c1713 0%, #14100d 100%)'
            border_radius: 14px
            padding: 16px
            box_shadow: 0 16px 34px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(217,221,226,0.10), inset 0 1px 0 rgba(255,210,122,0.08)
            css: 'font-family: Alegreya, Lora, Georgia, serif; color: #ece4d6;'
            rows:
              - id: head
                column_widths: [1fr, auto]
                columns:
                  - gap: 2px
                    modules:
                      - type: text
                        text: Household
                        design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 11px, font_weight: '700', letter_spacing: 3px, text_transform: uppercase, color: '#f2a93b'}
                      - type: text
                        text: Who's home
                        design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 19px, font_weight: '700', letter_spacing: 1px, color: '#d9dde2', line_height: '1.15'}
                  - vertical_align: center
                    modules:
                      - type: icon
                        icon: svg
                        svg: <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="60" cy="60" r="49" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.55"/><path fill="currentColor" fill-rule="evenodd" d="M60 14 L68 46 L92 28 L74 52 L106 60 L74 68 L92 92 L68 74 L60 106 L52 74 L28 92 L46 68 L14 60 L46 52 L28 28 L52 46 Z M60 46 L72 60 L60 74 L48 60 Z"/><circle cx="60" cy="60" r="6" fill="currentColor" fill-opacity="0.75"/></svg>
                        size: 34px
                        design: {color: '#8c939c', display: flex}
              - id: people
                layout: 1-1-1
                gap: 6px
                padding: 6px 0 0
                columns:
                  - modules:
                      - type: vertical
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: image
                            entity: person.anna
                            entity_picture: true
                            aspect_ratio: '1'
                            design:
                              width: 78px
                              border_radius: 50%
                              css: 'outline: 2px solid #8c939c; outline-offset: 3px;'
                              conditional:
                                - id: home
                                  name: Home
                                  conditions: [{type: state, entity: person.anna, state: home}]
                                  design: {css: 'outline: 2px solid #f2a93b; outline-offset: 3px; box-shadow: 0 0 16px rgba(242,169,59,0.45);'}
                                - {id: away, name: Away, conditions: [{type: state, entity: person.anna, state_not: home}], design: {filter: grayscale(0.85) brightness(0.8)}}
                          - {type: text, text: Anna, design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#d9dde2', margin_top: 4px}}
                          - type: text
                            text: At the keep
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#2a1d10'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: '#f2a93b'
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.anna, state: home}]}
                          - type: text
                            text: On the road
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#d9dde2'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(217,221,226,0.10)
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.anna, state: not_home}]}
                          - type: text
                            text: Out hunting
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#e8d8b0'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(163,32,28,0.45)
                              white_space: nowrap
                              text_align: center
                            display: {mode: every, conditions: [{type: state, entity: person.anna, state_not: home}, {type: state, entity: person.anna, state_not: not_home}]}
                        actions: {tap_action: {action: more-info, entity: person.anna}}
                  - modules:
                      - type: vertical
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: image
                            entity: person.ben
                            entity_picture: true
                            aspect_ratio: '1'
                            design:
                              width: 78px
                              border_radius: 50%
                              css: 'outline: 2px solid #8c939c; outline-offset: 3px;'
                              conditional:
                                - id: home
                                  name: Home
                                  conditions: [{type: state, entity: person.ben, state: home}]
                                  design: {css: 'outline: 2px solid #f2a93b; outline-offset: 3px; box-shadow: 0 0 16px rgba(242,169,59,0.45);'}
                                - {id: away, name: Away, conditions: [{type: state, entity: person.ben, state_not: home}], design: {filter: grayscale(0.85) brightness(0.8)}}
                          - {type: text, text: Ben, design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#d9dde2', margin_top: 4px}}
                          - type: text
                            text: At the keep
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#2a1d10'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: '#f2a93b'
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.ben, state: home}]}
                          - type: text
                            text: On the road
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#d9dde2'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(217,221,226,0.10)
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.ben, state: not_home}]}
                          - type: text
                            text: Out hunting
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#e8d8b0'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(163,32,28,0.45)
                              white_space: nowrap
                              text_align: center
                            display: {mode: every, conditions: [{type: state, entity: person.ben, state_not: home}, {type: state, entity: person.ben, state_not: not_home}]}
                        actions: {tap_action: {action: more-info, entity: person.ben}}
                  - modules:
                      - type: vertical
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: image
                            entity: person.lisa
                            entity_picture: true
                            aspect_ratio: '1'
                            design:
                              width: 78px
                              border_radius: 50%
                              css: 'outline: 2px solid #8c939c; outline-offset: 3px;'
                              conditional:
                                - id: home
                                  name: Home
                                  conditions: [{type: state, entity: person.lisa, state: home}]
                                  design: {css: 'outline: 2px solid #f2a93b; outline-offset: 3px; box-shadow: 0 0 16px rgba(242,169,59,0.45);'}
                                - {id: away, name: Away, conditions: [{type: state, entity: person.lisa, state_not: home}], design: {filter: grayscale(0.85) brightness(0.8)}}
                          - {type: text, text: Lisa, design: {font_family: 'Cinzel, ''Playfair Display'', Georgia, serif', font_size: 15px, font_weight: '700', color: '#d9dde2', margin_top: 4px}}
                          - type: text
                            text: At the keep
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#2a1d10'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: '#f2a93b'
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.lisa, state: home}]}
                          - type: text
                            text: On the road
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#d9dde2'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(217,221,226,0.10)
                              white_space: nowrap
                              text_align: center
                            display: {conditions: [{type: state, entity: person.lisa, state: not_home}]}
                          - type: text
                            text: Out hunting
                            design:
                              font_family: Alegreya, Lora, Georgia, serif
                              font_size: 12px
                              font_weight: '700'
                              color: '#e8d8b0'
                              padding: 2px 9px
                              border_radius: 999px
                              background_color: rgba(163,32,28,0.45)
                              white_space: nowrap
                              text_align: center
                            display: {mode: every, conditions: [{type: state, entity: person.lisa, state_not: home}, {type: state, entity: person.lisa, state_not: not_home}]}
                        actions: {tap_action: {action: more-info, entity: person.lisa}}
            grid_options: {columns: 12, rows: auto}
      - type: grid
        cards:
          - type: custom:magic-card
            name: Heading · The great hall
            background: linear-gradient(90deg, rgba(163,32,28,0.26) 0%, rgba(20,16,13,0.55) 55%, rgba(20,16,13,0.15) 100%)
            border_radius: 10px
            padding: 12px 14px 10px
            box_shadow: 0 8px 18px rgba(0,0,0,0.35)
            css: 'font-family: Alegreya, Lora, Georgia, serif; color: #ece4d6;'
            rows:
              - id: h
                column_widths: [auto, 1fr]
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: icon
                        icon: svg
                        svg: <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 L42 24 L24 44 L6 24 Z"/><path d="M24 14 V34 M16 24 H32" stroke-width="2.6"/></svg>
                        size: 26px
                        design: {color: '#f2a93b', display: flex, filter: 'drop-shadow(0 0 6px rgba(242,169,59,0.6))'}
                  - gap: 1px
                    vertical_align: center
                    modules:
                      - type: text
                        text: The great hall
                        design:
                          font_family: Cinzel, 'Playfair Display', Georgia, serif
                          font_size: 20px
                          font_weight: '700'
                          letter_spacing: 3px
                          text_transform: uppercase
