# Frontier Saloon: a western saloon home dashboard built from Magic Card cards.
title: Frontier Saloon
views:
  - type: sections
    max_columns: 4
    path: saloon
    title: The Frontier Saloon
    icon: mdi:cards-playing-outline
    theme: Frontier Saloon
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Saloon sign
            background: 'radial-gradient(ellipse at 50% 0%, rgba(255,179,71,0.22), transparent 62%), repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 1px, transparent 1px 7px, rgba(255,220,160,0.025) 7px 9px, transparent 9px 17px), linear-gradient(180deg, #33200f 0%, #22140a 100%)'
            border_radius: 14px
            padding: 16px
            box_shadow: inset 0 0 0 1px rgba(201,162,74,0.5), inset 0 0 0 4px rgba(20,11,6,0.55), inset 0 0 0 5px rgba(201,162,74,0.16), 0 14px 30px rgba(0,0,0,0.55)
            animations:
              - id: smoke
                preset: smoke
                strength: 30
                intensity: 40
            grid_options:
              columns: 12
              rows: auto
            rows:
              - id: place
                columns:
                  - modules:
                      - type: text
                        text: GOLD CAMP · FRONTIER TOWN
                        design:
                          font_family: '''Special Elite'', ''Courier New'', monospace'
                          font_size: 11px
                          color: '#c9a24a'
                          letter_spacing: 3px
                          text_align: center
              - id: sign
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        modules:
                          - type: text
                            text: The Corner Saloon
                            design:
                              font_family: Rye, 'Playfair Display', Georgia, serif
                              font_size: 34px
                              color: '#f6dfa4'
                              text_align: center
                              line_height: '1.15'
                              text_shadow: '0 3px 0 #000, 0 0 22px rgba(255,179,71,0.45)'
                              white_space: nowrap
                          - type: text
                            text: Fine whiskies · Faro · Variety theatre
                            design:
                              font_family: '''Playfair Display'', Georgia, serif'
                              font_style: italic
                              font_size: 13px
                              color: '#c8b48e'
                              text_align: center
                              margin_top: 2px
                        design:
                          padding: 12px 10px 10px
                          border_radius: 8px
                          border: '2px solid #c9a24a'
                          background: 'linear-gradient(180deg, #4a2c15 0%, #2a170a 100%)'
                          box_shadow: inset 0 0 0 4px rgba(20,11,6,0.7), inset 0 0 0 5px rgba(201,162,74,0.35), 0 6px 14px rgba(0,0,0,0.5)
                          overflow: hidden
                          position: relative
                          animations:
                            - id: gleam
                              preset: shine-sweep
                              duration: 6s
                              strength: 35
              - id: clock
                column_widths:
                  - auto
                  - 1fr
                gap: 16px
                padding: 4px 4px 0
                columns:
                  - vertical_align: center
                    modules:
                      - type: text
                        text: '{{ now().strftime(''%H:%M'') }}'
                        use_template: true
                        design:
                          font_family: Smokum, Rye, 'Playfair Display', Georgia, serif
                          font_size: 58px
                          color: '#ffd98a'
                          line_height: '1'
                          text_shadow: '0 0 18px rgba(255,179,71,0.45), 0 3px 0 #000'
                  - vertical_align: center
                    gap: 2px
                    modules:
                      - type: text
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, partner'
                        use_template: true
                        design:
                          font_family: '''Playfair Display'', Georgia, serif'
                          font_style: italic
                          font_weight: '700'
                          font_size: 18px
                          color: '#f4ead2'
                      - type: text
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        use_template: true
                        design:
                          font_family: '''Special Elite'', ''Courier New'', monospace'
                          font_size: 12px
                          color: '#c8b48e'
                          letter_spacing: 0.5px
              - id: chips
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        modules:
                          - type: horizontal
                            gap: 6px
                            justify: center
                            modules:
                              - type: icon
                                icon: mdi:lightbulb-on-outline
                                size: 16px
                                design:
                                  color: '#ffb347'
                                  display: flex
                              - type: text
                                text: '{{ states.light | selectattr(''state'', ''eq'', ''on'') | list | count }} lamps lit'
                                use_template: true
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 12px
                                  color: '#f4ead2'
                                  white_space: nowrap
                            design:
                              flex: 1 1 0
                              align_items: center
                              padding: 7px 6px
                              border_radius: 999px
                              background_color: rgba(10,5,2,0.45)
                              border: 1px solid rgba(201,162,74,0.45)
                              min_width: '0'
                            align: center
                            actions:
                              tap_action:
                                action: more-info
                                entity: light.living_room
                          - type: horizontal
                            gap: 6px
                            justify: center
                            modules:
                              - type: icon
                                icon: mdi:lock
                                size: 16px
                                design:
                                  color: '#ffb347'
                                  display: flex
                              - type: text
                                text: '{{ ''Door barred'' if is_state(''lock.front_door'', ''locked'') else ''Door unbarred'' }}'
                                use_template: true
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 12px
                                  color: '#f4ead2'
                                  white_space: nowrap
                            design:
                              flex: 1 1 0
                              align_items: center
                              padding: 7px 6px
                              border_radius: 999px
                              background_color: rgba(10,5,2,0.45)
                              border: 1px solid rgba(201,162,74,0.45)
                              min_width: '0'
                            align: center
                            actions:
                              tap_action:
                                action: more-info
                                entity: lock.front_door
                          - type: horizontal
                            gap: 6px
                            justify: center
                            modules:
                              - type: icon
                                icon: mdi:police-badge
                                size: 16px
                                design:
                                  color: '#ffb347'
                                  display: flex
                              - type: text
                                text: '{{ ''On watch'' if states(''alarm_control_panel.home'').startswith(''armed'') else ''Off duty'' }}'
                                use_template: true
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 12px
                                  color: '#f4ead2'
                                  white_space: nowrap
                            design:
                              flex: 1 1 0
                              align_items: center
                              padding: 7px 6px
                              border_radius: 999px
                              background_color: rgba(10,5,2,0.45)
                              border: 1px solid rgba(201,162,74,0.45)
                              min_width: '0'
                            align: center
                            actions:
                              tap_action:
                                action: more-info
                                entity: alarm_control_panel.home
                        design:
                          width: 100%
          - type: custom:magic-card
