# Outlaw Camp: canvas, campfire and red ink at dusk. Put this file in /config/themes/.
Outlaw Camp:
  modes:
    dark:
      primary-color: "#b3261e"
      accent-color: "#d4a24c"
      primary-background-color: "#140e0b"
      secondary-background-color: "#1f1712"
      card-background-color: "#231a13"
      ha-card-background: "#231a13"
      primary-text-color: "#f1e4c8"
      secondary-text-color: "#b9a383"
      disabled-text-color: "#6e5d4a"
      text-primary-color: "#fff6e4"
      divider-color: "rgba(212, 162, 76, 0.18)"
      lovelace-background: "radial-gradient(ellipse 70% 45% at 50% 105%, rgba(255, 130, 40, 0.22), rgba(255, 130, 40, 0) 70%), linear-gradient(180deg, #17121f 0%, #22171a 30%, #1a110d 70%, #120c09 100%)"
      ha-card-border-radius: "6px"
      ha-card-box-shadow: "inset 0 0 0 1px rgba(212, 162, 76, 0.2), 0 14px 32px rgba(0, 0, 0, 0.55)"
      ha-card-border-color: "rgba(212, 162, 76, 0.2)"
      state-icon-color: "#d4a24c"
      state-active-color: "#ff9a3c"
      paper-item-icon-color: "#d4a24c"
      paper-item-icon-active-color: "#ff9a3c"
      sidebar-background-color: "#120c09"
      sidebar-text-color: "#d9c7a4"
      sidebar-icon-color: "#b9a383"
      sidebar-selected-text-color: "#f1e4c8"
      sidebar-selected-icon-color: "#d8432f"
      app-header-background-color: "#120c09"
      app-header-text-color: "#f1e4c8"
      success-color: "#9cb46f"
      warning-color: "#e0a040"
      error-color: "#d8432f"
      info-color: "#7f9fb3"
      state-on-color: "#ff9a3c"
      state-off-color: "#6e5d4a"
      switch-checked-color: "#d8432f"
      slider-color: "#d4a24c"
      mdc-theme-primary: "#b3261e"
      code-editor-background-color: "#140e0b"
