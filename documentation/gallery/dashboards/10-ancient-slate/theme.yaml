# Slate-tablet theme: dark blue-black stone, glowing cyan lines, amber accents.
Ancient Slate:
  modes:
    dark:
      primary-color: "#4fd8ff"
      accent-color: "#ff9b2f"
      primary-background-color: "#060a10"
      secondary-background-color: "#0d1620"
      card-background-color: "#0d1722"
      ha-card-background: "#0d1722"
      primary-text-color: "#dcf3ff"
      secondary-text-color: "#86a6ba"
      disabled-text-color: "#3d566a"
      text-primary-color: "#05080d"
      divider-color: "rgba(79, 216, 255, 0.16)"
      lovelace-background: "radial-gradient(ellipse 70% 50% at 50% 0%, rgba(79, 216, 255, 0.10), transparent 70%), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255, 155, 47, 0.06), transparent 70%), linear-gradient(180deg, #08101a 0%, #05080d 100%)"
      ha-card-border-radius: "16px"
      ha-card-border-color: "rgba(79, 216, 255, 0.2)"
      ha-card-box-shadow: "0 0 0 1px rgba(79, 216, 255, 0.2), 0 14px 32px rgba(0, 0, 0, 0.55)"
      state-icon-color: "#4fd8ff"
      state-active-color: "#4fd8ff"
      state-light-on-color: "#4fd8ff"
      state-lock-locked-color: "#ff9b2f"
      state-lock-unlocked-color: "#4fd8ff"
      success-color: "#37d67a"
      warning-color: "#ff9b2f"
      error-color: "#ff3d57"
      info-color: "#4fd8ff"
      paper-item-icon-color: "#4fd8ff"
      paper-item-icon-active-color: "#ff9b2f"
      app-header-background-color: "#05080d"
      app-header-text-color: "#4fd8ff"
      sidebar-background-color: "#070c13"
      sidebar-text-color: "#86a6ba"
      sidebar-selected-icon-color: "#4fd8ff"
      sidebar-selected-text-color: "#dcf3ff"
      mdc-theme-primary: "#4fd8ff"
      switch-checked-color: "#4fd8ff"
      slider-color: "#4fd8ff"
      code-editor-background-color: "#0d1620"
