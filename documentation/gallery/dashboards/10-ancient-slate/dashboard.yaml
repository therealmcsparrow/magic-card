title: Ancient Slate
views:
  - type: sections
    max_columns: 4
    path: slate
    title: Ancient Slate
    icon: mdi:tablet
    theme: Ancient Slate
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Slate · Hero
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%22150%22%20viewBox%3D%220%200%20260%20150%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%234fd8ff%22%20stroke-opacity%3D%220.16%22%20stroke-width%3D%221.2%22%3E%3Cpath%20d%3D%22M260%2018H190L176%2032H120L108%2044H70%22%2F%3E%3Cpath%20d%3D%22M260%2040H214L198%2056H160L150%2066V96%22%2F%3E%3Cpath%20d%3D%22M230%200V12L238%2020V70L224%2084H196%22%2F%3E%3Cpath%20d%3D%22M260%2092H244L232%20104V150%22%2F%3E%3Cpath%20d%3D%22M150%2096H118L104%20110H60%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%234fd8ff%22%20fill-opacity%3D%220.28%22%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2244%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%22110%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%22196%22%20cy%3D%2284%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%2296%22%20r%3D%222%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") right top / 260px 150px no-repeat, radial-gradient(120% 90% at 0% 0%, rgba(79,216,255,0.07), transparent 60%), linear-gradient(165deg, #0f1b28 0%, #0a131d 100%)'
            border_radius: 16px
            padding: 16px
            box_shadow: 0 0 0 1px rgba(79,216,255,0.2), 0 14px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(166,236,255,0.08)
            grid_options:
              columns: full
              rows: auto
            rows:
              - column_widths:
                  - auto
                  - 1fr
                  - auto
                gap: 14px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        design:
                          width: 58px
                          height: 58px
                          border_radius: 50%
                          display: flex
                          align_items: center
                          justify_content: center
                          background: radial-gradient(circle, rgba(79,216,255,0.18), rgba(79,216,255,0.02) 70%)
                          border: '1.5px solid #4fd8ff88'
                          box_shadow: '0 0 18px #4fd8ff33, inset 0 0 12px #4fd8ff22'
                          animations:
                            - preset: ripple-rings
                              color: '#4fd8ff'
                              intensity: 2
                              duration: 4s
                              strength: 45
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2L20.7 7V17L12 22L3.3 17V7Z"/><path d="M12 6.5L16.5 12L12 17.5L7.5 12Z"/></g><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
                            size: 34px
                            design:
                              color: '#4fd8ff'
                              animations:
                                - preset: custom:rune-breathe
                  - vertical_align: center
                    gap: 2px
                    modules:
                      - type: text
                        text: Ancient Slate
                        design:
                          font_family: Cinzel, Lora, serif
                          font_size: 12px
                          font_weight: '700'
                          letter_spacing: 3.5px
                          text_transform: uppercase
                          color: '#4fd8ff'
                          line_height: '1.2'
                          white_space: nowrap
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}'
                        design:
                          font_family: Cinzel, Lora, serif
                          font_size: 18px
                          font_weight: '700'
                          color: '#dcf3ff'
                          line_height: '1.2'
                          white_space: nowrap
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: Raleway, sans-serif
                          font_size: 12px
                          color: '#86a6ba'
                          line_height: '1.3'
                          white_space: nowrap
                  - vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: Rajdhani, Oswald, sans-serif
                          font_size: 36px
                          font_weight: '500'
                          color: '#dcf3ff'
                          line_height: '1'
                          letter_spacing: 1px
                          text_shadow: '0 0 16px #4fd8ff66'
                          font_variant: tabular-nums
              - padding: 2px 0 0
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          overflow: hidden
                          padding: 2px 0
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              height: 1px
                              background: 'linear-gradient(90deg, transparent, #4fd8ff88 20%, #4fd8ff88 80%, transparent)'
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              top: -2px
                              left: 0px
                              width: 60px
                              height: 5px
                              border_radius: 3px
                              background: 'radial-gradient(closest-side, #a6ecff, transparent)'
                              animations:
                                - preset: custom:pulse-run
              - columns:
                  - modules:
                      - type: row
                        gap: 8px
                        columns:
                          - modules:
                              - type: vertical
                                gap: 0px
                                design:
                                  padding: 8px 10px
                                  border_radius: 10px
                                  background_color: rgba(79,216,255,0.06)
                                  border: 1px solid rgba(79,216,255,0.16)
                                  cursor: pointer
                                  transition: background-color 0.2s
                                  hover:
                                    background_color: rgba(79,216,255,0.12)
                                modules:
                                  - type: horizontal
                                    gap: 8px
                                    align: center
                                    design: {}
                                    modules:
                                      - type: icon
                                        icon: mdi:shield-lock-outline
                                        size: 18px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                          conditional: []
                                      - type: vertical
                                        gap: 1px
                                        design:
                                          min_width: '0'
                                        modules:
                                          - type: text
                                            text: Front door
                                            design:
                                              font_family: Raleway, sans-serif
                                              font_size: 9px
                                              font_weight: '700'
                                              letter_spacing: 1.6px
                                              text_transform: uppercase
                                              color: '#86a6ba'
                                              line_height: '1.2'
                                              white_space: nowrap
                                          - type: text
                                            text: Sealed
                                            design:
                                              font_family: Rajdhani, Oswald, sans-serif
                                              font_size: 16px
                                              font_weight: '600'
                                              color: '#ff9b2f'
                                              line_height: '1.1'
                                              white_space: nowrap
                                            display:
                                              conditions:
                                                - type: state
                                                  entity: lock.front_door
                                                  state: locked
                                          - type: text
                                            text: Open
                                            design:
                                              font_family: Rajdhani, Oswald, sans-serif
                                              font_size: 16px
                                              font_weight: '600'
                                              color: '#4fd8ff'
                                              line_height: '1.1'
                                              white_space: nowrap
                                            display:
                                              conditions:
                                                - type: state
                                                  entity: lock.front_door
                                                  state_not: locked
                                actions:
                                  tap_action:
                                    action: more-info
                                    entity: lock.front_door
                          - modules:
                              - type: vertical
                                gap: 0px
                                design:
                                  padding: 8px 10px
                                  border_radius: 10px
                                  background_color: rgba(79,216,255,0.06)
                                  border: 1px solid rgba(79,216,255,0.16)
                                  cursor: pointer
                                  transition: background-color 0.2s
                                  hover:
                                    background_color: rgba(79,216,255,0.12)
                                modules:
                                  - type: horizontal
                                    gap: 8px
                                    align: center
                                    design: {}
                                    modules:
                                      - type: icon
                                        icon: mdi:eye-outline
                                        size: 18px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                          conditional: []
                                      - type: vertical
                                        gap: 1px
                                        design:
                                          min_width: '0'
                                        modules:
                                          - type: text
                                            text: Sentries
                                            design:
                                              font_family: Raleway, sans-serif
                                              font_size: 9px
                                              font_weight: '700'
                                              letter_spacing: 1.6px
                                              text_transform: uppercase
                                              color: '#86a6ba'
                                              line_height: '1.2'
                                              white_space: nowrap
                                          - type: text
                                            use_entity: true
                                            entity: alarm_control_panel.home
                                            design:
                                              font_family: Rajdhani, Oswald, sans-serif
                                              font_size: 16px
                                              font_weight: '600'
                                              color: '#dcf3ff'
                                              line_height: '1.1'
                                              white_space: nowrap
                                              font_variant: tabular-nums
                                actions:
                                  tap_action:
                                    action: more-info
                                    entity: alarm_control_panel.home
                      - type: row
                        gap: 8px
                        columns:
                          - modules:
                              - type: vertical
                                gap: 0px
                                design:
                                  padding: 8px 10px
                                  border_radius: 10px
                                  background_color: rgba(79,216,255,0.06)
                                  border: 1px solid rgba(79,216,255,0.16)
                                  cursor: pointer
                                  transition: background-color 0.2s
                                  hover:
                                    background_color: rgba(79,216,255,0.12)
                                modules:
                                  - type: horizontal
                                    gap: 8px
                                    align: center
                                    design: {}
                                    modules:
                                      - type: icon
                                        icon: mdi:lightbulb-on-outline
                                        size: 18px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                          conditional: []
                                      - type: vertical
                                        gap: 1px
                                        design:
                                          min_width: '0'
                                        modules:
                                          - type: text
                                            text: Lanterns
                                            design:
                                              font_family: Raleway, sans-serif
                                              font_size: 9px
                                              font_weight: '700'
                                              letter_spacing: 1.6px
                                              text_transform: uppercase
                                              color: '#86a6ba'
                                              line_height: '1.2'
                                              white_space: nowrap
                                          - type: text
                                            use_template: true
                                            text: '{{ [''light.living_room'', ''light.kitchen'', ''light.bedroom'', ''light.hallway'', ''light.desk'', ''light.porch'', ''light.garden'', ''light.nightlight''] | select(''is_state'', ''on'') | list | count }} of 8 lit'
                                            design:
                                              font_family: Rajdhani, Oswald, sans-serif
                                              font_size: 16px
                                              font_weight: '600'
                                              color: '#dcf3ff'
                                              line_height: '1.1'
                                              white_space: nowrap
                                actions:
                                  tap_action:
                                    action: more-info
                                    entity: light.living_room
                          - modules:
                              - type: vertical
                                gap: 0px
                                design:
                                  padding: 8px 10px
                                  border_radius: 10px
                                  background_color: rgba(79,216,255,0.06)
                                  border: 1px solid rgba(79,216,255,0.16)
                                  cursor: pointer
                                  transition: background-color 0.2s
                                  hover:
                                    background_color: rgba(79,216,255,0.12)
                                modules:
                                  - type: horizontal
                                    gap: 8px
                                    align: center
                                    design: {}
                                    modules:
                                      - type: icon
                                        icon: mdi:lightning-bolt-circle
                                        size: 18px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                          conditional: []
                                      - type: vertical
                                        gap: 1px
                                        design:
                                          min_width: '0'
                                        modules:
                                          - type: text
                                            text: Battery
                                            design:
                                              font_family: Raleway, sans-serif
                                              font_size: 9px
                                              font_weight: '700'
                                              letter_spacing: 1.6px
                                              text_transform: uppercase
                                              color: '#86a6ba'
                                              line_height: '1.2'
                                              white_space: nowrap
                                          - type: text
                                            use_entity: true
                                            entity: sensor.home_battery
                                            design:
                                              font_family: Rajdhani, Oswald, sans-serif
                                              font_size: 16px
                                              font_weight: '600'
                                              color: '#8be04e'
                                              line_height: '1.1'
                                              white_space: nowrap
                                              font_variant: tabular-nums
                                actions:
                                  tap_action:
                                    action: more-info
                                    entity: sensor.home_battery
                    gap: 8px
            custom_animations:
              - id: rune-breathe
                name: Rune breathe
                kind: keyframes
                duration: 3.6
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes:
                  - at: 0
                    filter: 'drop-shadow(0 0 2px #4fd8ff) brightness(1)'
                  - at: 50
                    filter: 'drop-shadow(0 0 10px #4fd8ff) brightness(1.3)'
                  - at: 100
                    filter: 'drop-shadow(0 0 2px #4fd8ff) brightness(1)'
              - id: pulse-run
                name: Pulse run
                kind: keyframes
                duration: 3.4
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes:
                  - at: 0
                    transform:
                      x: -60
                    opacity: 0
                  - at: 10
                    opacity: 1
                  - at: 90
                    opacity: 1
                  - at: 100
                    transform:
                      x: 460
                    opacity: 0
          - type: custom:magic-card
            name: Slate · Weather
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%22150%22%20viewBox%3D%220%200%20260%20150%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%234fd8ff%22%20stroke-opacity%3D%220.16%22%20stroke-width%3D%221.2%22%3E%3Cpath%20d%3D%22M260%2018H190L176%2032H120L108%2044H70%22%2F%3E%3Cpath%20d%3D%22M260%2040H214L198%2056H160L150%2066V96%22%2F%3E%3Cpath%20d%3D%22M230%200V12L238%2020V70L224%2084H196%22%2F%3E%3Cpath%20d%3D%22M260%2092H244L232%20104V150%22%2F%3E%3Cpath%20d%3D%22M150%2096H118L104%20110H60%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%234fd8ff%22%20fill-opacity%3D%220.28%22%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2244%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%22110%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%22196%22%20cy%3D%2284%22%20r%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%2296%22%20r%3D%222%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") right top / 260px 150px no-repeat, radial-gradient(120% 90% at 0% 0%, rgba(79,216,255,0.07), transparent 60%), linear-gradient(165deg, #0f1b28 0%, #0a131d 100%)'
            border_radius: 16px
            padding: 16px
            box_shadow: 0 0 0 1px rgba(79,216,255,0.2), 0 14px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(166,236,255,0.08)
            grid_options:
              columns: full
              rows: auto
            rows:
              - columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {}
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2L20.7 7V17L12 22L3.3 17V7Z"/><path d="M12 6.5L16.5 12L12 17.5L7.5 12Z"/></g><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
                            size: 16px
                            design:
                              color: '#4fd8ff'
                              filter: 'drop-shadow(0 0 4px #4fd8ff)'
                          - type: text
                            text: Skies over the valley
                            design:
                              font_family: Cinzel, Lora, serif
                              font_size: 16px
                              font_weight: '700'
                              letter_spacing: 1.5px
                              color: '#dcf3ff'
                              white_space: nowrap
                              line_height: '1.2'
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              height: 1px
                              min_width: 16px
                              background: 'linear-gradient(90deg, #4fd8ff66, transparent)'
                          - type: text
                            use_template: true
                            text: '{{ states(''sensor.sunset'') }}'
                            design:
                              font_family: Rajdhani, Oswald, sans-serif
                              font_size: 13px
                              color: '#a6ecff'
                              white_space: nowrap
                              letter_spacing: 0.5px
              - column_widths:
                  - 1fr
                  - auto
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: weather
                            entity: weather.home
                            show_temperature: false
                            show_condition: false
                            animated_icons: true
                            design:
                              width: 56px
                              height: 56px
                              flex_shrink: '0'
                              display: flex
                              align_items: center
                              justify_content: center
                              font_size: 44px
                              css: '--mdc-icon-size: 48px;'
                          - type: vertical
                            gap: 0px
                            design:
                              min_width: '0'
                            modules:
                              - type: text
                                use_entity: true
                                entity: sensor.outdoor_temperature
                                design:
                                  font_family: Rajdhani, Oswald, sans-serif
                                  font_size: 34px
                                  font_weight: '500'
                                  color: '#dcf3ff'
                                  line_height: '1.1'
                                  white_space: nowrap
                                  font_variant: tabular-nums
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  font_family: Raleway, sans-serif
                                  font_size: 13px
                                  color: '#86a6ba'
                                  line_height: '1.2'
                                  white_space: nowrap
                              - type: horizontal
                                gap: 10px
                                align: center
                                design:
                                  margin_top: 4px
                                modules:
                                  - type: horizontal
                                    gap: 3px
                                    align: center
                                    design:
                                      cursor: pointer
                                    modules:
                                      - type: icon
                                        icon: mdi:weather-windy
                                        size: 13px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                      - type: text
                                        use_entity: true
                                        entity: sensor.wind_gust
                                        design:
                                          font_family: Rajdhani, Oswald, sans-serif
                                          font_size: 13px
                                          font_weight: '500'
                                          color: '#a6ecff'
                                          line_height: '1.1'
                                          white_space: nowrap
                                          font_variant: tabular-nums
                                    actions:
                                      tap_action:
                                        action: more-info
                                        entity: sensor.wind_gust
                                  - type: horizontal
                                    gap: 3px
                                    align: center
                                    design:
                                      cursor: pointer
                                    modules:
                                      - type: icon
                                        icon: mdi:weather-pouring
                                        size: 13px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                      - type: text
                                        use_entity: true
                                        entity: sensor.rain_today
                                        design:
                                          font_family: Rajdhani, Oswald, sans-serif
                                          font_size: 13px
                                          font_weight: '500'
                                          color: '#a6ecff'
                                          line_height: '1.1'
                                          white_space: nowrap
                                          font_variant: tabular-nums
                                    actions:
                                      tap_action:
                                        action: more-info
                                        entity: sensor.rain_today
                                  - type: horizontal
                                    gap: 3px
                                    align: center
                                    design:
                                      cursor: pointer
                                    modules:
                                      - type: icon
                                        icon: mdi:water-percent
                                        size: 13px
                                        design:
                                          color: '#4fd8ff'
                                          flex_shrink: '0'
                                      - type: text
                                        use_entity: true
                                        entity: weather.home
