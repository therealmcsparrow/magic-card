                                        design:
                                          font_family: Rajdhani, Oswald, sans-serif
                                          font_size: 13px
                                          color: '#a6ecff'
                                          line_height: '1.1'
                                          white_space: nowrap
                                    actions:
                                      tap_action:
                                        action: more-info
                                        entity: weather.home
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 6px
                        design:
                          padding: 8px 10px
                          border_radius: 10px
                          background_color: rgba(79,216,255,0.06)
                          border: 1px solid rgba(79,216,255,0.16)
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            justify: space-between
                            design: {}
                            modules:
                              - type: text
                                text: Sound
                                design:
                                  font_family: Raleway, sans-serif
                                  font_size: 9px
                                  font_weight: '700'
                                  letter_spacing: 1.6px
                                  text_transform: uppercase
                                  color: '#86a6ba'
                                  line_height: '1.2'
                                  white_space: nowrap
                              - type: text
                                use_entity: true
                                entity: sensor.noise_level
                                design:
                                  font_family: Rajdhani, Oswald, sans-serif
                                  font_size: 13px
                                  font_weight: '500'
                                  color: '#a6ecff'
                                  line_height: '1.1'
                                  white_space: nowrap
                                  font_variant: tabular-nums
                          - type: horizontal
                            gap: 3px
                            align: end
                            design:
                              height: 28px
                              align_items: flex-end
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 5px
                                  height: 8px
                                  border_radius: 2px
                                  background_color: '#3d566a'
                                  align_self: flex-end
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions:
                                        - type: state
                                          entity: sensor.noise_level
                                          above: 20
                                      design:
                                        background_color: '#4fd8ff'
                                        box_shadow: '0 0 6px #4fd8ff'
                              - type: separator
                                separator_style: none
                                design:
                                  width: 5px
                                  height: 10px
                                  border_radius: 2px
                                  background_color: '#3d566a'
                                  align_self: flex-end
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions:
                                        - type: state
                                          entity: sensor.noise_level
