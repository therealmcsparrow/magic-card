# Glass Console: translucent blue-white glass on deep space black, with an orange accent.
# Based on the Cobalt Prism and Deep Survey presets.
Glass Console:
  modes:
    dark:
      primary-color: "#5cc4ff"
      accent-color: "#ff9a2e"
      dark-primary-color: "#2f8fd6"
      light-primary-color: "#bfeaff"
      text-primary-color: "#03101f"
      text-accent-color: "#1a0d00"
      primary-background-color: "#03060c"
      secondary-background-color: "#0a1424"
      card-background-color: "transparent"
      ha-card-background: "transparent"
      mdc-theme-surface: "#0a1424"
      ha-dialog-surface-background: "#0a1424"
      ha-bottom-sheet-surface-background: "#0a1424"
      primary-text-color: "#e3f1ff"
      secondary-text-color: "#8fb2d6"
      disabled-text-color: "#4d6683"
      divider-color: "rgba(140, 200, 255, 0.04)"
      lovelace-background: "radial-gradient(ellipse at 15% 5%, rgba(70, 120, 220, 0.24), transparent 45%), radial-gradient(ellipse at 60% 45%, rgba(120, 80, 220, 0.09), transparent 55%), radial-gradient(ellipse at 90% 95%, rgba(255, 130, 40, 0.10), transparent 40%), linear-gradient(180deg, #050b16 0%, #02040a 100%)"
      ha-card-border-radius: "4px"
      ha-card-border-width: "0px"
      ha-card-box-shadow: "0 0 0 1px rgba(140, 200, 255, 0.18), 0 16px 36px rgba(0, 0, 0, 0.55)"
      ha-dialog-border-radius: "4px"
      state-icon-color: "#7fbfff"
      state-icon-active-color: "#ff9a2e"
      state-active-color: "#ff9a2e"
      paper-item-icon-color: "#7fbfff"
      paper-item-icon-active-color: "#ff9a2e"
      success-color: "#58e0a8"
      warning-color: "#ff9a2e"
      error-color: "#ff5148"
      info-color: "#5cc4ff"
      state-on-color: "#ff9a2e"
      state-off-color: "#4d6683"
      state-home-color: "#58e0a8"
      state-not_home-color: "#8fb2d6"
      state-alarm_control_panel-armed_home-color: "#5cc4ff"
      state-alarm_control_panel-triggered-color: "#ff5148"
      state-lock-locked-color: "#58e0a8"
      state-lock-unlocked-color: "#ff9a2e"
      app-header-background-color: "#050b16"
      app-header-text-color: "#e3f1ff"
      app-header-edit-background-color: "#0a1424"
      sidebar-background-color: "#040912"
      sidebar-text-color: "#8fb2d6"
      sidebar-icon-color: "#5b7a9c"
      sidebar-selected-text-color: "#ff9a2e"
      sidebar-selected-icon-color: "#ff9a2e"
      mdc-theme-primary: "#5cc4ff"
      mdc-theme-secondary: "#ff9a2e"
      switch-checked-color: "#ff9a2e"
      switch-checked-button-color: "#ff9a2e"
      switch-checked-track-color: "#ff9a2e"
      slider-color: "#5cc4ff"
      slider-bar-color: "rgba(92, 196, 255, 0.25)"
      input-fill-color: "rgba(140, 200, 255, 0.06)"
      code-editor-background-color: "#050b16"
      markdown-code-background-color: "rgba(140, 200, 255, 0.08)"
