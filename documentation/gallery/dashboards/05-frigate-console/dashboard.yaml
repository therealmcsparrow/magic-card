title: Frigate Console
views:
  - type: sections
    max_columns: 4
    path: cic
    title: Home control
    icon: mdi:hexagon-multiple-outline
    theme: Glass Console
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero · CIC
            background: linear-gradient(160deg, rgba(62,104,160,0.55) 0%, rgba(24,48,86,0.62) 45%, rgba(6,14,30,0.82) 100%)
            shape: notch
            shape_options:
              corner: 14px
            padding: 16px
            box_shadow: 0 16px 36px rgba(0,0,0,0.55)
            ring:
              mode: animated
              animation: full
              width: 1
              color: rgba(140,200,255,0.42)
            css: 'font-family: ''Titillium Web'', ''Source Sans Pro'', sans-serif; color: #e3f1ff;'
            custom_animations:
              - id: slow-spin
                name: Slow spin
                kind: keyframes
                duration: 60
                iterations: infinite
                easing: linear
                target: element
                keyframes:
                  - at: 0
                    transform:
                      rotate: 0
                  - at: 100
                    transform:
                      rotate: 360
            rows:
              - id: head
                padding: 0 0 4px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 10px
                              height: 11px
                              background_color: '#ff9a2e'
                              shape: hexagon
                              flex_shrink: '0'
                          - type: text
                            text: Home frigate
                            design:
                              font_family: '''Exo 2'', Montserrat, sans-serif'
                              font_size: 12px
                              font_weight: '700'
                              letter_spacing: 2.4px
                              text_transform: uppercase
                              color: '#ff9a2e'
                              line_height: '1.2'
                              white_space: nowrap
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              height: 1px
                              min_width: 16px
                              background: 'linear-gradient(90deg, #ff9a2e88, transparent)'
                          - type: text
                            text: Main console · CIC
                            design:
                              font_family: '''Exo 2'', Montserrat, sans-serif'
                              font_size: 10px
                              font_weight: '600'
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#5b7a9c'
                              line_height: '1.2'
                              white_space: nowrap
              - id: main
                column_widths:
                  - 1fr
                  - 92px
                gap: 12px
                padding: 4px 0 2px
                columns:
                  - gap: 6px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, Anna'
                        design:
                          font_size: 15px
                          color: '#8fb2d6'
                          line_height: '1.2'
                          white_space: nowrap
                          overflow: hidden
                          text_overflow: ellipsis
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: '''Exo 2'', Montserrat, sans-serif'
                          font_size: 58px
                          font_weight: '300'
                          letter_spacing: 3px
                          color: '#e3f1ff'
                          line_height: '1'
                          text_shadow: '0 0 22px #5cc4ff88'
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: '''Exo 2'', Montserrat, sans-serif'
                          font_size: 12px
                          font_weight: '500'
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#5cc4ff'
                          line_height: '1.2'
                          white_space: nowrap
                  - vertical_align: center
