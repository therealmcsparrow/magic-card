                                  font_family: '''Exo 2'', Montserrat, sans-serif'
                                  font_size: 14px
                                  font_weight: '600'
                                  color: '#e3f1ff'
                                  white_space: nowrap
                                  overflow: hidden
                                  text_overflow: ellipsis
