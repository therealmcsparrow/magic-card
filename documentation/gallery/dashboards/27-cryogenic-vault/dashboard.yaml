      custom_animations:
       mist-drift-a:
        id: mist-drift-a
        name: mist drift a
        kind: keyframes
        duration: 96
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           x: 0
         -
          at: 100
          transform:
           x: -1024
       mist-drift-b:
        id: mist-drift-b
        name: mist drift b
        kind: keyframes
        duration: 148
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           x: 0
         -
          at: 100
          transform:
           x: -1024
       vapour-fall:
        id: vapour-fall
        name: vapour fall
        kind: keyframes
        duration: 26
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           'y': -400
         -
          at: 100
          transform:
           'y': 0
       light-rise:
        id: light-rise
        name: light rise
        kind: keyframes
        duration: 14
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0
          transform:
           'y': 300
         -
          at: 25
          opacity: 1
         -
          at: 80
          opacity: 0.8
         -
          at: 100
          opacity: 0
          transform:
           'y': 0
        bindings:
         -
          target: element
          property: speed
          input:
           min: 10
           max: 30
          output:
           - 0.45
           - 1.5
          smoothing: 3
       fill-breathe:
        id: fill-breathe
        name: fill breathe
        kind: keyframes
        duration: 12
        easing: ease-in-out
        iterations: infinite
