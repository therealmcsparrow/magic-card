# Sheriff's office: a spaghetti-western Sections dashboard built from Magic Cards.
title: Sheriff's office
views:
  - type: sections
    max_columns: 4
    path: sheriff
    title: Sheriff's office
    icon: mdi:account-cowboy-hat
    theme: Frontier Sheriff
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Header
            background: 'url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20440%20110%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%2074%20L34%2074%20L42%2050%20L104%2050%20L112%2074%20L190%2074%20L197%2062%20L246%2062%20L253%2074%20L300%2074%20L311%2040%20L362%2040%20L372%2074%20L440%2074%20L440%20110%20L0%20110%20Z%22%20fill%3D%22%237d2a12%22%20opacity%3D%220.85%22%2F%3E%3Cpath%20d%3D%22M0%2090%20Q110%2080%20220%2088%20T440%2084%20L440%20110%20L0%20110%20Z%22%20fill%3D%22%233b170a%22%2F%3E%3Cpath%20d%3D%22M396%2088%20V60%20M396%2074%20h-8%20v-9%20M396%2069%20h7%20v-11%22%20stroke%3D%22%233b170a%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M40%2090%20V72%20M40%2081%20h-5%20v-6%20M40%2078%20h5%20v-7%22%20stroke%3D%22%233b170a%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E") bottom / 100% 96px no-repeat, radial-gradient(circle at 50% 100%, #fff3c0 0px, #ffd36a 46px, rgba(255,170,70,0.75) 64px, rgba(255,140,50,0) 170px), linear-gradient(180deg, #5c1408 0%, #a3300f 30%, #e35d1c 62%, #ffa040 88%, #ffc46a 100%)'
            border_radius: 8px
            padding: '0'
            box_shadow: 0 12px 26px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.35)
            css: 'font-family: ''Special Elite'', ''Courier New'', monospace; color: #fbe9c6;'
            overflow: hidden
            custom_animations:
              - id: tumbleweed-roll
                name: Tumbleweed roll
                kind: keyframes
                duration: 9
                iterations: infinite
                easing: linear
                target: element
                keyframes:
                  - at: 0
                    transform:
                      x: -60
                      'y': 0
                      rotate: 0
                    opacity: 1
                  - at: 14
                    transform:
                      x: 20
                      'y': -14
                      rotate: 160
                  - at: 26
                    transform:
                      x: 90
                      'y': 0
                      rotate: 300
                  - at: 40
                    transform:
                      x: 170
                      'y': -9
                      rotate: 470
                  - at: 54
                    transform:
                      x: 250
                      'y': 0
                      rotate: 620
                  - at: 70
                    transform:
                      x: 340
                      'y': -12
                      rotate: 800
                  - at: 86
                    transform:
                      x: 430
                      'y': 0
                      rotate: 960
                  - at: 100
                    transform:
                      x: 520
                      'y': -4
                      rotate: 1100
                    opacity: 1
              - id: sundial-shadow
                name: Sundial shadow
                kind: keyframes
                duration: 40
                iterations: infinite
                direction: alternate
                easing: ease-in-out
                target: element
                origin: 50% 100%
                keyframes:
                  - at: 0
                    transform:
                      rotate: -70
                  - at: 100
                    transform:
                      rotate: 70
            rows:
              - column_widths:
                  - 1fr
                  - auto
                gap: 12px
                padding: 18px 18px 0
                columns:
                  - gap: 2px
                    modules:
                      - type: text
                        text: Dry Gulch County · Sheriff's office
                        design:
                          font_size: 11px
                          letter_spacing: 1.6px
                          text_transform: uppercase
                          color: '#ffd9a8'
                          white_space: nowrap
                      - type: text
                        text: Law of the Frontier
                        design:
                          font_family: Rye, 'Playfair Display', serif
                          font_size: 22px
                          line_height: '1.15'
                          color: '#fbe9c6'
                          text_shadow: 0 2px 0 rgba(60,14,4,0.7)
                      - type: horizontal
                        gap: 14px
                        align: center
                        design:
                          padding: 6px 0 0
                        modules:
                          - type: text
                            use_template: true
                            text: '{{ now().strftime(''%H:%M'') }}'
                            design:
                              font_family: Sancreek, Rye, 'Playfair Display', serif
                              font_size: 60px
                              line_height: '1'
                              color: '#ffe08a'
                              text_shadow: '0 3px 0 #5a1606, 0 0 18px rgba(255,190,90,0.45)'
                          - type: vertical
                            gap: 2px
                            design: {}
                            modules:
                              - type: text
                                use_template: true
                                text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, Sheriff'
                                design:
                                  font_size: 14px
                                  color: '#fbe9c6'
                                  line_height: '1.3'
                              - type: text
                                use_template: true
                                text: '{{ now().strftime(''%a %-d %b'') }}'
                                design:
                                  font_size: 12px
                                  color: '#ffd9a8'
                                  line_height: '1.3'
                  - vertical_align: start
                    modules:
                      - type: vertical
                        gap: 0px
                        align: center
                        design: {}
                        modules:
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              width: 96px
                              height: 96px
                              min_width: 96px
                              box_sizing: border-box
                              border_radius: 50%
                              background: 'radial-gradient(circle, rgba(0,0,0,0) 0 57%, rgba(232,212,166,1) 57.5% 100%), repeating-conic-gradient(from -2deg, rgba(43,26,14,0.75) 0deg 4deg, rgba(0,0,0,0) 4deg 30deg), radial-gradient(circle, #ecdab0 0%, #cfae72 72%, #8a6a3a 100%)'
                              box_shadow: '0 0 0 4px #5b3a1e, 0 0 0 6px rgba(233,185,73,0.5), 0 6px 14px rgba(0,0,0,0.45)'
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  left: calc(50% - 2px)
                                  bottom: 50%
                                  width: 4px
                                  height: 40%
                                  border_radius: 2px
                                  background: linear-gradient(to top, rgba(43,26,14,0.85), rgba(43,26,14,0.05))
                                  animations:
                                    - preset: custom:sundial-shadow
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  left: calc(50% - 5px)
                                  top: calc(50% - 5px)
                                  width: 10px
                                  height: 10px
                                  min_width: 10px
                                  box_sizing: border-box
                                  border_radius: 50%
                                  background: '#3a2414'
                              - type: text
                                text: XII
                                design:
                                  position: absolute
                                  top: 8px
                                  left: 0px
                                  width: 100%
                                  text_align: center
                                  font_family: Rye, 'Playfair Display', serif
                                  font_size: 10px
                                  color: '#2b1a0e'
                                  line_height: '1'
                          - type: text
                            text: Midday
                            design:
                              font_size: 10px
                              letter_spacing: 1.6px
                              text_transform: uppercase
                              color: '#ffe3b8'
                              white_space: nowrap
                              text_align: center
                              margin: 10px 0 0
              - padding: 2px 18px 0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: start
                        design:
                          flex_wrap: wrap
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border_radius: 999px
                              background_color: rgba(43,16,6,0.55)
                              border: 1px solid rgba(255,224,138,0.35)
                              backdrop_filter: blur(2px)
                            modules:
                              - type: icon
                                icon: mdi:lightbulb-on
                                size: 15px
                                design:
                                  color: '#ffe08a'
                                  display: flex
                              - type: text
                                use_template: true
                                text: '{{ states.light | selectattr(''state'',''eq'',''on'') | list | count }} lamps lit'
                                design:
                                  font_size: 12px
                                  color: '#fbe9c6'
                                  white_space: nowrap
                                  line_height: '1.2'
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border_radius: 999px
                              background_color: rgba(43,16,6,0.55)
                              border: 1px solid rgba(255,224,138,0.35)
                              backdrop_filter: blur(2px)
                            modules:
                              - type: icon
                                icon: mdi:lock
                                size: 15px
                                design:
                                  color: '#ffe08a'
                                  display: flex
                              - type: text
                                use_entity: true
                                entity: lock.front_door
                                design:
                                  font_size: 12px
                                  color: '#fbe9c6'
                                  white_space: nowrap
                                  line_height: '1.2'
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border_radius: 999px
                              background_color: rgba(43,16,6,0.55)
                              border: 1px solid rgba(255,224,138,0.35)
                              backdrop_filter: blur(2px)
                            modules:
                              - type: icon
                                icon: mdi:account-cowboy-hat
                                size: 15px
                                design:
                                  color: '#ffe08a'
                                  display: flex
                              - type: text
                                use_template: true
                                text: '{{ [states(''person.anna''), states(''person.ben''), states(''person.lisa'')] | reject(''eq'',''home'') | list | count }} at large'
                                design:
                                  font_size: 12px
                                  color: '#fbe9c6'
                                  white_space: nowrap
                                  line_height: '1.2'
              - padding: '0'
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          height: 78px
                          overflow: hidden
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"><circle cx="12" cy="12" r="9.6"/><path d="M4 9c4 2 10-3 16 1M3.5 14c5-1 9 4 17 0M7 4.5c1 5-2 10 3 15M15 3.5c-2 5 3 11-1 17M5 18c4-4 10-9 14-12M6 6c3 3 9 7 13 12M9 3c3 4 1 9 6 12"/></svg>
                            size: 30px
                            icon_color: '#c08a4a'
                            design:
                              position: absolute
                              left: 0px
                              bottom: 6px
                              display: flex
                              animations:
                                - preset: custom:tumbleweed-roll
            grid_options:
              columns: 12
              rows: auto
          - type: custom:magic-card
            name: Weather
            background: 'repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 47px, rgba(0,0,0,0.2) 47px, rgba(0,0,0,0.2) 48px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 8px), linear-gradient(180deg, #62402a 0%, #4a2e1b 100%)'
            border_radius: 8px
            padding: 16px
            box_shadow: 0 12px 26px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.4), inset 0 0 0 4px rgba(233,185,73,0.14)
            css: 'font-family: ''Special Elite'', ''Courier New'', monospace; color: #fbe9c6;'
            custom_animations:
              - id: heat-shimmer
                name: Heat shimmer
                kind: keyframes
                duration: 2.4
                iterations: infinite
                easing: ease-in-out
                target: element
                keyframes:
                  - at: 0
                    transform:
                      skew_x: 0
                      scale_y: 1
                    filter: blur(0px) brightness(1)
                  - at: 25
                    transform:
                      skew_x: 2.5
                      scale_y: 1.03
                    filter: blur(0.6px) brightness(1.08)
                  - at: 50
                    transform:
                      skew_x: 0
                      scale_y: 0.98
                    filter: blur(0.2px) brightness(1)
                  - at: 75
                    transform:
                      skew_x: -2.5
                      scale_y: 1.03
                    filter: blur(0.7px) brightness(1.1)
                  - at: 100
                    transform:
                      skew_x: 0
                      scale_y: 1
                    filter: blur(0px) brightness(1)
              - id: mirage
                name: Mirage
                kind: keyframes
                duration: 3.2
                iterations: infinite
                easing: ease-in-out
                target: element
                keyframes:
                  - at: 0
                    transform:
                      x: -6
                      scale_y: 1
                    opacity: 0.55
                  - at: 50
                    transform:
                      x: 6
                      scale_y: 1.6
                    opacity: 0.95
                  - at: 100
                    transform:
                      x: -6
                      scale_y: 1
                    opacity: 0.55
            rows:
              - columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        justify: space-between
                        design: {}
                        modules:
                          - type: text
                            text: Weather over the mesa
                            design:
                              font_family: Rye, 'Playfair Display', serif
                              font_size: 20px
                              line_height: '1.1'
                              color: '#ffe08a'
                              text_shadow: 0 2px 0 rgba(0,0,0,0.45)
                              white_space: nowrap
                          - type: text
                            text: Today
                            design:
                              font_size: 11px
                              letter_spacing: 1.6px
                              text_transform: uppercase
                              color: '#e9b949'
                              white_space: nowrap
              - column_widths:
                  - auto
                  - 1fr
                gap: 18px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          width: 96px
                          height: 96px
                          min_width: 96px
                          box_sizing: border-box
                          display: flex
                          align_items: center
                          justify_content: center
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              inset: '0'
                              border_radius: 50%
                              background: 'radial-gradient(circle, #fff4c8 0%, #ffd062 45%, #ff9a2e 70%, rgba(255,120,30,0) 72%)'
                              box_shadow: 0 0 34px rgba(255,170,60,0.55)
                              animations:
                                - preset: custom:heat-shimmer
                          - type: weather
                            entity: weather.home
                            show_temperature: false
                            show_condition: false
                            show_forecast: false
                            animated_icons: true
                            design:
                              position: relative
                              z_index: '1'
                              display: flex
                              align_items: center
                              justify_content: center
                              css: '--mc-icon-size-xl: 58px'
                      - type: separator
                        separator_style: none
                        design:
                          width: 96px
                          height: 6px
                          min_width: 96px
                          box_sizing: border-box
                          margin: 6px 0 0
                          border_radius: 50%
                          background: radial-gradient(ellipse, rgba(255,214,140,0.6), rgba(255,214,140,0) 70%)
                          animations:
                            - preset: custom:mirage
                  - vertical_align: center
                    gap: 4px
                    modules:
                      - type: text
                        use_entity: true
                        entity: weather.home
                        design:
                          font_family: Smokum, Rye, 'Playfair Display', serif
                          font_size: 46px
                          line_height: '1'
                          color: '#ffe08a'
                          text_shadow: 0 2px 0 rgba(0,0,0,0.5)
                          white_space: nowrap
                        attribute: temperature
                      - type: text
                        use_entity: true
                        entity: weather.home
                        design:
                          font_family: Rye, 'Playfair Display', serif
                          font_size: 17px
                          color: '#fbe9c6'
                          white_space: nowrap
                      - type: horizontal
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: On the porch
                            design:
                              font_size: 10px
                              letter_spacing: 1.6px
                              text_transform: uppercase
                              color: '#d9bf94'
                              white_space: nowrap
                          - type: text
                            use_entity: true
                            entity: sensor.outdoor_temperature
                            design:
                              font_size: 13px
                              color: '#fbe9c6'
                              white_space: nowrap
              - columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: stretch
                        design: {}
                        modules:
                          - type: vertical
                            gap: 4px
                            design:
                              padding: 8px 10px
                              border_radius: 6px
                              background_color: rgba(0,0,0,0.22)
                              border: 1px solid rgba(233,185,73,0.18)
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: horizontal
                                gap: 5px
                                align: center
                                design: {}
                                modules:
                                  - type: icon
                                    icon: mdi:water-percent
                                    size: 14px
                                    design:
                                      color: '#e9b949'
                                      display: flex
                                  - type: text
                                    text: Humidity
                                    design:
                                      font_size: 10px
                                      letter_spacing: 1.6px
                                      text_transform: uppercase
                                      color: '#d9bf94'
                                      white_space: nowrap
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  font_size: 15px
                                  color: '#fbe9c6'
                                  white_space: nowrap
                                attribute: humidity
                          - type: vertical
                            gap: 4px
                            design:
                              padding: 8px 10px
                              border_radius: 6px
                              background_color: rgba(0,0,0,0.22)
                              border: 1px solid rgba(233,185,73,0.18)
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: horizontal
                                gap: 5px
                                align: center
                                design: {}
                                modules:
                                  - type: icon
                                    icon: mdi:weather-windy
                                    size: 14px
                                    design:
                                      color: '#e9b949'
                                      display: flex
                                  - type: text
                                    text: Wind
                                    design:
                                      font_size: 10px
                                      letter_spacing: 1.6px
                                      text_transform: uppercase
                                      color: '#d9bf94'
                                      white_space: nowrap
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  font_size: 15px
                                  color: '#fbe9c6'
                                  white_space: nowrap
                                attribute: wind_speed
                          - type: vertical
                            gap: 4px
                            design:
                              padding: 8px 10px
                              border_radius: 6px
                              background_color: rgba(0,0,0,0.22)
                              border: 1px solid rgba(233,185,73,0.18)
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: horizontal
                                gap: 5px
                                align: center
                                design: {}
                                modules:
                                  - type: icon
                                    icon: mdi:weather-pouring
                                    size: 14px
                                    design:
                                      color: '#e9b949'
                                      display: flex
                                  - type: text
                                    text: Rain
                                    design:
                                      font_size: 10px
                                      letter_spacing: 1.6px
                                      text_transform: uppercase
                                      color: '#d9bf94'
                                      white_space: nowrap
                              - type: text
                                use_entity: true
                                entity: sensor.rain_today
                                design:
                                  font_size: 15px
                                  color: '#fbe9c6'
                                  white_space: nowrap
              - columns:
                  - modules:
                      - type: forecast
                        entity: weather.home
                        forecast_type: daily
                        num_forecasts: 5
                        show_temperature: true
                        show_precipitation: false
                        show_wind: false
                        animated_icons: true
                        design:
                          padding: 8px 4px
                          border_radius: 6px
                          background_color: rgba(0,0,0,0.25)
                          border: 1px solid rgba(233,185,73,0.18)
                          color: '#fbe9c6'
            grid_options:
              columns: 12
              rows: auto
          - type: custom:magic-card
            name: Saloon piano
            background: 'repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 47px, rgba(0,0,0,0.2) 47px, rgba(0,0,0,0.2) 48px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 8px), linear-gradient(180deg, #62402a 0%, #4a2e1b 100%)'
            border_radius: 8px
            padding: 16px
            box_shadow: 0 12px 26px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(0,0,0,0.4), inset 0 0 0 4px rgba(233,185,73,0.14)
            css: 'font-family: ''Special Elite'', ''Courier New'', monospace; color: #fbe9c6;'
            rows:
              - column_widths:
                  - 64px
                  - 1fr
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        design:
                          width: 64px
                          height: 64px
                          min_width: 64px
                          box_sizing: border-box
                          display: flex
                          align_items: center
                          justify_content: center
                          border_radius: 6px
                          background: 'linear-gradient(180deg, #2a1608, #120904)'
                          box_shadow: inset 0 0 0 2px rgba(233,185,73,0.35)
                          animations:
                            - preset: equalizer-bars
                              trigger: state
                              trigger_entity: media_player.living_room
                              state: playing
                              color: '#e9b949'
                        modules:
                          - type: icon
                            icon: mdi:piano
                            size: 30px
                            design:
                              color: '#ffe08a'
                              display: flex
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Saloon piano · now playing
                        design:
                          font_size: 10px
                          letter_spacing: 1.6px
                          text_transform: uppercase
                          color: '#e9b949'
                          white_space: nowrap
                      - type: text
                        use_entity: true
                        entity: media_player.living_room
                        design:
                          font_family: Rye, 'Playfair Display', serif
                          font_size: 18px
                          line_height: '1.2'
                          color: '#fbe9c6'
                          white_space: nowrap
                          overflow: hidden
                          text_overflow: ellipsis
                        attribute: media_title
                      - type: text
                        use_entity: true
                        entity: media_player.living_room
                        design:
                          font_size: 12px
                          color: '#d9bf94'
                          white_space: nowrap
                          overflow: hidden
                          text_overflow: ellipsis
                        attribute: media_artist
              - columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: vertical
                            gap: 0px
                            actions:
                              tap_action:
                                action: perform-action
                                service: media_player.media_previous_track
                                data:
                                  entity_id: media_player.living_room
