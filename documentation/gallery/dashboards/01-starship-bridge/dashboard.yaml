# Starship Bridge: a Sections dashboard made only of Magic Cards.
# Paste into a new dashboard: three dots > Edit dashboard > three dots > Raw configuration editor.
title: Starship Bridge
views:
  - type: sections
    max_columns: 4
    path: bridge
    title: Bridge
    icon: mdi:rocket-launch
    theme: Starship Console
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Bridge · header
            grid_options: {columns: 12, rows: auto}
            background: transparent
            border_radius: 0px
            padding: 0px
            box_shadow: none
            css: 'font-family: Antonio, ''Oswald'', ''Arial Narrow'', sans-serif; text-transform: uppercase; color: #FFCC99;'
            custom_animations:
              data-blink:
                id: data-blink
                name: Data blink
                kind: keyframes
                duration: 2.6
                iterations: infinite
                target: element
                easing: linear
                keyframes: [{at: 0, opacity: 1}, {at: 46, opacity: 1}, {at: 48, opacity: 0.18}, {at: 70, opacity: 0.18}, {at: 72, opacity: 1}, {at: 100, opacity: 1}]
              block-flash:
                id: block-flash
                name: Block flash
                kind: keyframes
                duration: 9
                iterations: infinite
                target: element
                easing: linear
                keyframes: [{at: 0, filter: brightness(1)}, {at: 2, filter: brightness(1.45)}, {at: 5, filter: brightness(1)}, {at: 100, filter: brightness(1)}]
              bar-scan:
                id: bar-scan
                name: Bar scan
                kind: keyframes
                duration: 3.2
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes: [{at: 0, transform: {x: 0}, opacity: 0}, {at: 8, opacity: 1}, {at: 92, opacity: 1}, {at: 100, transform: {x: 440}, opacity: 0}]
              alert-strobe:
                id: alert-strobe
                name: Alert strobe
                kind: keyframes
                duration: 1
                iterations: infinite
                target: element
                easing: linear
                keyframes: [{at: 0, opacity: 1}, {at: 50, opacity: 1}, {at: 52, opacity: 0.25}, {at: 98, opacity: 0.25}, {at: 100, opacity: 1}]
            conditional_appearance:
              - id: alert
                name: Alert
                mode: every
                conditions: [{type: state, entity: alarm_control_panel.home, state: triggered}]
                overrides: {background: 'radial-gradient(ellipse at 65% 40%, rgba(90,0,0,0.55) 0%, rgba(30,0,0,0.35) 60%, rgba(0,0,0,0) 100%)'}
            rows:
              - id: frame
                column_widths: [64px, 1fr]
                gap: 0px
                columns:
                  - id: sidebar
                    vertical_align: stretch
                    gap: 6px
                    modules:
                      - type: vertical
                        gap: 2px
                        design:
                          background_color: '#FFCC99'
                          height: 44px
                          min_height: 44px
                          box_sizing: border-box
                          padding: 5px 7px 5px 5px
                          display: flex
                          flex_direction: column
                          justify_content: flex-end
                          align_items: flex-end
                          conditional: [{id: red, name: Alert, conditions: [{type: state, entity: alarm_control_panel.home, state: triggered}], design: {background_color: '#CC6666'}}]
                          animations:
                            - {preset: custom:block-flash, delay: 0.0s}
                            - {preset: blink, trigger: state, trigger_entity: alarm_control_panel.home, state: triggered, duration: 1s, intensity: 70}
                        modules:
                          - {type: text, text: 42-01, design: {color: '#000000', font_size: 12px, font_weight: '600', letter_spacing: 0.5px, line_height: '1', text_align: right, white_space: nowrap}}
                      - type: vertical
                        gap: 2px
                        design:
                          background_color: '#FF9900'
                          height: auto
                          min_height: 96px
                          flex: '1'
                          box_sizing: border-box
                          padding: 5px 7px 5px 5px
                          display: flex
                          flex_direction: column
                          justify_content: flex-end
                          align_items: flex-end
                          border_bottom_left_radius: 40px
                          conditional: [{id: red, name: Alert, conditions: [{type: state, entity: alarm_control_panel.home, state: triggered}], design: {background_color: '#FF3B3B'}}]
                          animations:
                            - {preset: custom:block-flash, delay: 1.2s}
                            - {preset: blink, trigger: state, trigger_entity: alarm_control_panel.home, state: triggered, duration: 1s, intensity: 70}
                        modules:
                          - {type: text, text: '01', design: {color: '#000000', font_size: 10px, line_height: '1', opacity: '0.7', text_align: right, white_space: nowrap}}
                          - {type: text, text: '2604', design: {color: '#000000', font_size: 12px, font_weight: '600', letter_spacing: 0.5px, line_height: '1', text_align: right, white_space: nowrap}}
                  - id: content
                    vertical_align: stretch
                    gap: 0px
                    modules:
                      - type: vertical
                        gap: 12px
                        design: {flex: '1', box_sizing: border-box, min_width: 0px, padding: 4px 4px 14px 14px}
