# Railroad Depot: a Sections dashboard made only of Magic Cards.
# edit the generator, not this file.
title: Railroad Depot
views:
  - title: Depot
    path: depot
    icon: mdi:train
    type: sections
    max_columns: 4
    theme: Railroad Depot
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Heading · Station office
            background: 'linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0) 40%), linear-gradient(180deg, #8e2a1a 0%, #5a1a10 100%)'
            border_radius: 6px
            padding: 0px 14px
            box_shadow: '0 0 0 2px #c9973f, 0 0 0 4px #2a170c, 0 8px 18px rgba(0,0,0,0.5)'
            overflow: hidden
            css: 'font-family: ''Old Standard TT'', ''PT Serif'', serif; color: #f3e6c8; display: flex; flex-direction: column; justify-content: center; min-height: 56px; box-sizing: border-box;'
            card_height: 56px
            rows:
              - id: h_office_plate
                columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 8px
                              height: 8px
                              flex: none
                              border_radius: 50%
                              background: 'radial-gradient(circle at 35% 35%, #f6dc9c, #c9973f 45%, #3b2810 100%)'
                              box_shadow: 0 1px 2px rgba(0,0,0,0.6)
                          - type: icon
                            icon: mdi:clock-outline
                            size: 22px
                            design:
                              color: '#e8c27a'
                              display: flex
                              align_items: center
                              justify_content: center
                              flex: none
                          - type: text
                            text: Station office
                            design:
                              font_family: Rye, 'Playfair Display', serif
                              font_size: 20px
                              color: '#f3e6c8'
                              letter_spacing: 2px
                              line_height: '1'
                              white_space: nowrap
                              text_shadow: 0 2px 0 rgba(0,0,0,0.45)
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              min_width: 10px
                              height: 0px
                              border_top: 1px dashed rgba(243,230,200,0.35)
                          - type: text
                            text: Track 1
                            design:
                              font_family: '''Special Elite'', ''Courier New'', monospace'
                              font_size: 12px
                              color: '#f0c9a8'
                              letter_spacing: 1px
                              white_space: nowrap
                              text_transform: uppercase
                          - type: separator
                            separator_style: none
                            design:
                              width: 8px
                              height: 8px
                              flex: none
                              border_radius: 50%
                              background: 'radial-gradient(circle at 35% 35%, #f6dc9c, #c9973f 45%, #3b2810 100%)'
                              box_shadow: 0 1px 2px rgba(0,0,0,0.6)
            grid_options:
              columns: full
              rows: auto
          - type: custom:magic-card
            name: Station office
            background: 'radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) left 5px top 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) right 5px top 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) left 5px bottom 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) right 5px bottom 5px / 10px 10px no-repeat, repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 37px, rgba(0,0,0,0.28) 37px 39px), repeating-linear-gradient(90deg, rgba(255,235,200,0.018) 0 3px, rgba(0,0,0,0) 3px 11px), linear-gradient(170deg, #3a2516 0%, #2b1b11 55%, #24170e 100%)'
            border_radius: 10px
            padding: 16px
            box_shadow: '0 0 0 2px #6b4a22, inset 0 0 0 1px rgba(232,194,122,0.18), 0 12px 26px rgba(0,0,0,0.55)'
            overflow: hidden
            css: 'font-family: ''Old Standard TT'', ''PT Serif'', serif; color: #f3e6c8;'
            custom_animations:
              - id: clock-sweep
                name: Clock sweep
                kind: keyframes
                duration: 60
                easing: linear
                iterations: infinite
                target: element
                origin: 50% 100%
                keyframes:
                  - at: 0
                    transform:
                      rotate: 0
                  - at: 100
                    transform:
                      rotate: 360
            rows:
              - id: hero_head
                columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: end
                        design:
                          padding_bottom: 2px
                        modules:
                          - type: vertical
                            gap: 3px
                            design:
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: text
                                text: Silver Creek Rail Road · Station office
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c9973f'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                              - type: text
                                text: Silver Creek Depot
                                design:
                                  font_family: Rye, 'Playfair Display', serif
                                  font_size: 20px
                                  color: '#e8c27a'
                                  line_height: '1.1'
                                  letter_spacing: 1px
                                  white_space: nowrap
              - id: hero_main
                column_widths:
                  - 166px
                  - 1fr
                gap: 12px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        align: center
                        design:
                          width: 148px
                          height: 148px
                          flex: none
                          border_radius: 50%
                          position: relative
                          box_sizing: border-box
                          overflow: hidden
                          display: flex
                          flex_direction: column
                          align_items: center
                          justify_content: center
                          background: 'radial-gradient(circle, rgba(0,0,0,0) 0 60%, rgba(0,0,0,0) 60%), radial-gradient(circle, #f6ebd0 0 57%, rgba(0,0,0,0) 57.5%), repeating-conic-gradient(from -1.5deg, #2b1b11 0 3deg, rgba(0,0,0,0) 3deg 30deg), repeating-conic-gradient(from -0.5deg, rgba(43,27,17,0.55) 0 1deg, rgba(0,0,0,0) 1deg 6deg), radial-gradient(circle, #f3e6c8 0 64%, #e2cfa1 100%)'
                          box_shadow: '0 0 0 5px #c9973f, 0 0 0 7px #4a3115, 0 0 0 9px #e8c27a, 0 10px 22px rgba(0,0,0,0.65), inset 0 0 18px rgba(80,50,20,0.45)'
                          margin: 9px
                        modules:
                          - type: vertical
                            gap: 0px
                            design:
                              position: absolute
                              left: 0px
                              top: 0px
                              width: 100%
                              height: 100%
                              z_index: '0'
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  left: calc(50% - 1px)
                                  top: calc(50% - 62px)
                                  width: 2px
                                  height: 62px
                                  background_color: '#d94a32'
                                  border_radius: 1px
                                  z_index: '1'
                                  animations:
                                    - preset: custom:clock-sweep
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  left: calc(50% - 5px)
                                  top: calc(50% - 5px)
                                  width: 10px
                                  height: 10px
                                  border_radius: 50%
                                  background_color: '#d94a32'
                                  z_index: '3'
                                  box_shadow: 0 1px 2px rgba(0,0,0,0.5)
                          - type: vertical
                            gap: 0px
                            align: center
                            design:
                              position: relative
                              z_index: '2'
                            modules:
                              - type: text
                                text: S. C. R. R.
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 9px
                                  color: '#6b4a22'
                                  letter_spacing: 2px
                                  line_height: '1'
                                  position: relative
                                  z_index: '2'
                              - type: text
                                use_template: true
                                text: '{{ now().strftime(''%H:%M'') }}'
                                design:
                                  font_family: Rye, 'Playfair Display', serif
                                  font_size: 31px
                                  color: '#24150c'
                                  line_height: '1'
                                  position: relative
                                  z_index: '2'
                                  margin_top: 20px
                                  margin_bottom: 20px
                                  font_variant: tabular-nums
                                  background_color: '#f6ebd0'
                                  padding: 2px 5px
                                  border_radius: 4px
                              - type: text
                                text: Railway time
                                design:
                                  font_family: '''Old Standard TT'', ''PT Serif'', serif'
                                  font_style: italic
                                  font_size: 10px
                                  color: '#6b4a22'
                                  line_height: '1'
                                  position: relative
                                  z_index: '2'
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 2px
                        design:
                          flex: '1'
                          min_width: 0px
                        modules:
                          - type: horizontal
                            gap: 10px
                            align: center
                            design:
                              padding_bottom: 6px
                            modules:
                              - type: icon
                                entity: weather.home
                                use_entity_icon: true
                                size: 40px
                                design:
                                  color: '#ffb547'
                                  flex: none
                                  display: flex
                                  align_items: center
                                  justify_content: center
                              - type: vertical
                                gap: 3px
                                design:
                                  min_width: 0px
                                modules:
                                  - type: text
                                    use_entity: true
                                    entity: sensor.outdoor_temperature
                                    design:
                                      font_family: Rye, 'Playfair Display', serif
                                      font_size: 28px
                                      color: '#f3e6c8'
                                      line_height: '1'
                                      white_space: nowrap
                                  - type: text
                                    use_entity: true
                                    entity: weather.home
                                    design:
                                      font_family: '''Old Standard TT'', ''PT Serif'', serif'
                                      font_style: italic
                                      font_size: 14px
                                      color: '#c2ab85'
                                      line_height: '1.2'
                                      white_space: nowrap
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 3px 0
                              border_bottom: 1px dotted rgba(201,151,63,0.35)
                            modules:
                              - type: text
                                text: Gusts
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c2ab85'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  flex: '1'
                              - type: text
                                use_entity: true
                                entity: sensor.wind_gust
                                design:
                                  font_family: '''Old Standard TT'', ''PT Serif'', serif'
                                  font_size: 15px
                                  font_weight: '700'
                                  color: '#f3e6c8'
                                  white_space: nowrap
                                  text_align: right
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 3px 0
                              border_bottom: 1px dotted rgba(201,151,63,0.35)
                            modules:
                              - type: text
                                text: Rain today
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c2ab85'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  flex: '1'
                              - type: text
                                use_entity: true
                                entity: sensor.rain_today
                                design:
                                  font_family: '''Old Standard TT'', ''PT Serif'', serif'
                                  font_size: 15px
                                  font_weight: '700'
                                  color: '#f3e6c8'
                                  white_space: nowrap
                                  text_align: right
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 3px 0
                              border_bottom: 1px dotted rgba(201,151,63,0.35)
                            modules:
                              - type: text
                                text: Sundown
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c2ab85'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  flex: '1'
                              - type: text
                                use_entity: true
                                entity: sensor.sunset
                                design:
                                  font_family: '''Old Standard TT'', ''PT Serif'', serif'
                                  font_size: 15px
                                  font_weight: '700'
                                  color: '#f3e6c8'
                                  white_space: nowrap
                                  text_align: right
              - id: hero_status
                columns:
                  - modules:
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, stationmaster.'
                        design:
                          font_family: Rye, 'Playfair Display', serif
                          font_size: 16px
                          color: '#e8c27a'
                          line_height: '1.2'
                      - type: horizontal
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            justify: center
                            design:
                              padding: 4px 9px
                              border_radius: 4px
                              background_color: rgba(0,0,0,0.3)
                              border: 1px solid rgba(201,151,63,0.4)
                              white_space: nowrap
                              flex: '1'
                              min_width: 0px
                              justify_content: center
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  flex: none
                                  border_radius: 50%
                                  background_color: '#7fc15d'
                                  box_shadow: '0 0 6px #7fc15d'
                              - type: text
                                text: Alarm
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c2ab85'
                                  letter_spacing: 0.5px
                                  white_space: nowrap
                                  text_transform: uppercase
                                  line_height: '1.3'
                              - type: text
                                use_entity: true
                                entity: alarm_control_panel.home
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#f3e6c8'
                                  letter_spacing: 0.5px
                                  white_space: nowrap
                                  text_transform: uppercase
                                  line_height: '1.3'
                          - type: horizontal
                            gap: 6px
                            align: center
                            justify: center
                            design:
                              padding: 4px 9px
                              border_radius: 4px
                              background_color: rgba(0,0,0,0.3)
                              border: 1px solid rgba(201,151,63,0.4)
                              white_space: nowrap
                              flex: '1'
                              min_width: 0px
                              justify_content: center
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  flex: none
                                  border_radius: 50%
                                  background_color: '#7fc15d'
                                  box_shadow: '0 0 6px #7fc15d'
                              - type: text
                                use_template: true
                                text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of {{ states.person | list | count }} aboard'
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#f3e6c8'
                                  letter_spacing: 0.5px
                                  white_space: nowrap
                                  text_transform: uppercase
                                  line_height: '1.3'
                    gap: 8px
            grid_options:
              columns: full
              rows: auto
          - type: custom:magic-card
            name: Arrivals and departures
            background: 'radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) left 5px top 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) right 5px top 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) left 5px bottom 5px / 10px 10px no-repeat, radial-gradient(circle at 50% 50%, #e8c27a 0 1.6px, #6b4a22 2.4px, rgba(0,0,0,0) 3.2px) right 5px bottom 5px / 10px 10px no-repeat, repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 37px, rgba(0,0,0,0.28) 37px 39px), repeating-linear-gradient(90deg, rgba(255,235,200,0.018) 0 3px, rgba(0,0,0,0) 3px 11px), linear-gradient(170deg, #3a2516 0%, #2b1b11 55%, #24170e 100%)'
            border_radius: 10px
            padding: 16px
            box_shadow: '0 0 0 2px #6b4a22, inset 0 0 0 1px rgba(232,194,122,0.18), 0 12px 26px rgba(0,0,0,0.55)'
            overflow: hidden
            css: 'font-family: ''Old Standard TT'', ''PT Serif'', serif; color: #f3e6c8;'
            custom_animations:
              - id: flap
                name: Split flap
                kind: keyframes
                duration: 11
                easing: ease-in-out
                iterations: infinite
                target: element
                origin: 50% 50%
                keyframes:
                  - at: 0
                    transform:
                      rotate: 0
                      axis:
                        - 1
                        - 0
                        - 0
                    filter: brightness(1)
                  - at: 1.5
                    transform:
                      rotate: 88
                      axis:
                        - 1
                        - 0
                        - 0
                    filter: brightness(0.5)
                  - at: 2.5
                    transform:
                      rotate: -88
                      axis:
                        - 1
                        - 0
                        - 0
                    filter: brightness(0.5)
                  - at: 4
                    transform:
                      rotate: 0
                      axis:
                        - 1
                        - 0
                        - 0
                    filter: brightness(1)
                  - at: 100
                    transform:
                      rotate: 0
                      axis:
                        - 1
                        - 0
                        - 0
                    filter: brightness(1)
            rows:
              - id: board_head
                columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: end
                        design:
                          padding_bottom: 2px
                        modules:
                          - type: vertical
                            gap: 3px
                            design:
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: text
                                text: Main line connections
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 11px
                                  color: '#c9973f'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                              - type: text
                                text: Arrivals & departures
                                design:
                                  font_family: Rye, 'Playfair Display', serif
                                  font_size: 20px
                                  color: '#e8c27a'
                                  line_height: '1.1'
                                  letter_spacing: 1px
                                  white_space: nowrap
                          - type: icon
                            icon: mdi:train
                            size: 28px
                            design:
                              color: '#c9973f'
                              display: flex
                              align_items: center
                              justify_content: center
              - id: board_face
                columns:
                  - modules:
                      - type: vertical
                        gap: 5px
                        design:
                          background: 'linear-gradient(180deg, #14110e, #0d0b0a)'
                          border_radius: 6px
                          padding: 10px 10px 12px
                          box_sizing: border-box
                          box_shadow: 'inset 0 0 0 1px #000, inset 0 0 0 2px rgba(201,151,63,0.25), inset 0 6px 14px rgba(0,0,0,0.7)'
                        modules:
                          - type: horizontal
                            gap: 8px
                            align: center
                            design:
                              padding: 2px 0 3px
                            modules:
                              - type: text
                                text: Arrivals
                                design:
                                  font_family: Rye, 'Playfair Display', serif
                                  font_size: 14px
                                  color: '#ffd36b'
                                  letter_spacing: 2px
                                  line_height: '1'
                                  white_space: nowrap
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  height: 1px
                                  background_color: rgba(255,211,107,0.25)
                          - type: horizontal
                            gap: 4px
                            align: center
                            design:
                              padding: 0 0 0 14px
                            modules:
                              - type: text
                                text: Time
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 10px
                                  color: '#ffd36b'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  width: 62px
                                  flex: none
                              - type: text
                                text: Passenger
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 10px
                                  color: '#ffd36b'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  flex: '1'
                              - type: text
                                text: Platform
                                design:
                                  font_family: '''Special Elite'', ''Courier New'', monospace'
                                  font_size: 10px
                                  color: '#ffd36b'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                                  width: 112px
                                  flex: none
                          - type: horizontal
                            gap: 4px
                            align: center
                            design: {}
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 8px
                                  height: 8px
                                  flex: none
                                  border_radius: 50%
                                  background_color: '#ffd36b'
                                  box_shadow: '0 0 6px #ffd36b'
                                  conditional:
                                    - id: home
                                      name: Home
                                      conditions:
                                        - type: state
                                          entity: person.anna
                                          state: home
                                      design:
                                        background_color: '#7fc15d'
                                        box_shadow: '0 0 6px #7fc15d'
                                    - id: away
                                      name: Away
                                      conditions:
                                        - type: state
                                          entity: person.anna
                                          state: not_home
                                      design:
                                        background_color: '#d94a32'
                                        box_shadow: '0 0 6px #d94a32'
                              - type: text
                                use_template: true
                                text: '{{ as_timestamp(states.person.anna.last_changed) | timestamp_custom(''%H:%M'') }}'
                                design:
                                  font_family: Oswald, 'Arial Narrow', sans-serif
                                  font_size: 15px
                                  font_weight: '500'
                                  color: '#f2e3b8'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                                  line_height: 26px
                                  height: 26px
                                  padding: 0 7px
                                  box_sizing: border-box
                                  border_radius: 3px
                                  background: 'linear-gradient(180deg, #2a2520 0%, #1c1916 48%, #070605 48%, #070605 52%, #1c1916 52%, #26211c 100%)'
                                  box_shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 1px 0 rgba(0,0,0,0.8)
                                  white_space: nowrap
                                  overflow: hidden
                                  text_overflow: ellipsis
                                  width: 62px
