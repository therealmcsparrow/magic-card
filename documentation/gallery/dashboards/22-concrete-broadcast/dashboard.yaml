# Block 7 dashboard (theme "Concrete Broadcast"). edit the generator, not this file.
title: Block 7
views:
  - type: sections
    max_columns: 4
    path: block-7
    title: Wall screen
    icon: mdi:eye-outline
    theme: Concrete Broadcast
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px), radial-gradient(rgba(0,0,0,0.10) 0.7px, transparent 1.1px) 0 0 / 5px 5px, radial-gradient(rgba(255,255,255,0.045) 0.7px, transparent 1.1px) 2px 3px / 7px 7px, linear-gradient(118deg, transparent 0 54%, rgba(200,38,29,0.22) 54% 72%, transparent 72%), radial-gradient(ellipse 80% 60% at 20% 30%, rgba(169,196,184,0.12), transparent 70%), linear-gradient(170deg, #30302d 0%, #1a1a19 100%)'
            border_radius: 3px
            padding: 16px 18px 18px
            box_shadow: 6px 6px 0 rgba(0,0,0,0.45), inset 0 0 0 1px rgba(236,232,222,0.07), inset 0 3px 0 rgba(200,38,29,0.85)
            css: 'font-family: Oswald, ''Arial Narrow'', sans-serif; color: #ece8de;'
            custom_animations:
              - id: iris-look
                name: Iris looks around
                kind: keyframes
                duration: 9
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes:
                  - {at: 0, transform: {x: 0, 'y': 0}}
                  - {at: 12, transform: {x: 0, 'y': 0}}
                  - {at: 18, transform: {x: -20, 'y': 2}}
                  - {at: 34, transform: {x: -20, 'y': 2}}
                  - {at: 40, transform: {x: 19, 'y': 3}}
                  - {at: 58, transform: {x: 19, 'y': 3}}
                  - {at: 64, transform: {x: 0, 'y': 0}}
                  - {at: 100, transform: {x: 0, 'y': 0}}
              - id: eye-blink
                name: Blink
                kind: keyframes
                duration: 9
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes:
                  - {at: 0, transform: {scale_y: 1}}
                  - {at: 86, transform: {scale_y: 1}}
                  - {at: 88, transform: {scale_y: 0.06}}
                  - {at: 90, transform: {scale_y: 1}}
                  - {at: 100, transform: {scale_y: 1}}
              - id: ray-turn
                name: Slow rays
                kind: keyframes
                duration: 60
                iterations: infinite
                target: element
                easing: linear
                keyframes: [{at: 0, transform: {rotate: 0}}, {at: 100, transform: {rotate: 360}}]
            animations: [{id: scan, preset: scanline, intensity: 18, duration: 6s}]
            rows:
              - id: top
                column_widths: [1fr, auto]
                gap: 8px
                columns:
                  - vertical_align: center
                    modules:
                      - type: text
                        text: Wall screen · Block 7 · Flat 12
                        design:
                          font_family: Oswald, 'Arial Narrow', sans-serif
                          font_size: 11px
                          font_weight: '600'
                          letter_spacing: 2.5px
                          text_transform: uppercase
                          color: '#ece8de'
                          opacity: '0.75'
                  - vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        design: {}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 8px
                              min_width: 8px
                              height: 8px
                              margin: '0'
                              border_radius: 50%
                              background_color: '#e8402f'
                              animations: [{id: rec, preset: blink, duration: 1.6s, intensity: 80}]
                          - type: text
                            text: Live
                            design: {font_family: 'Oswald, ''Arial Narrow'', sans-serif', font_size: 11px, font_weight: '600', letter_spacing: 2px, text_transform: uppercase, color: '#e8402f'}
              - id: poster
                column_widths: [148px, 1fr]
                gap: 14px
                padding: 6px 0 4px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          width: 140px
                          height: 140px
                          overflow: hidden
                          border_radius: 50%
                          box_shadow: '0 0 0 4px #0d0d0c, 5px 5px 0 4px rgba(0,0,0,0.45)'
                          display: flex
                          align_items: center
                          justify_content: center
                        modules:
                          - type: vertical
                            gap: 0px
                            design:
                              position: absolute
                              top: -40px
                              left: -40px
                              width: 220px
                              height: 220px
                              margin: '0'
                              background: repeating-conic-gradient(from 0deg, rgba(200,38,29,0.95) 0deg 9deg, rgba(122,20,16,0.95) 9deg 18deg)
                              border_radius: 50%
                              animations: [{id: rays, preset: custom:ray-turn}]
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              width: 140px
                              height: 140px
                              border_radius: 50%
                              display: flex
                              align_items: center
                              justify_content: center
                              background: 'radial-gradient(circle closest-side, #1a1a19 0 82%, transparent 83%)'
                              box_shadow: 'inset 0 0 0 3px #0d0d0c'
                            modules:
                              - type: vertical
                                gap: 0px
                                design:
                                  filter: 'drop-shadow(2.5px 0 0 #0d0d0c) drop-shadow(-2.5px 0 0 #0d0d0c) drop-shadow(0 2.5px 0 #0d0d0c) drop-shadow(0 -2.5px 0 #0d0d0c) drop-shadow(0 3px 0 rgba(0,0,0,0.5))'
                                modules:
                                  - type: vertical
                                    gap: 0px
                                    design:
                                      position: relative
                                      width: 120px
                                      height: 72px
                                      overflow: hidden
                                      background: 'radial-gradient(ellipse 60% 70% at 50% 50%, #f4efe2, #d8d1c0)'
                                      css: 'clip-path: path(''M4 36 Q60 -12 116 36 Q60 84 4 36 Z'');'
                                      animations: [{id: blink, preset: custom:eye-blink}]
                                    modules:
                                      - type: vertical
                                        gap: 0px
                                        design:
                                          position: absolute
                                          top: 19px
                                          left: 43px
                                          width: 34px
                                          height: 34px
                                          margin: '0'
                                          border_radius: 50%
                                          background: 'radial-gradient(circle at 36% 34%, #ffffff 0 2.5px, transparent 3px), radial-gradient(circle, #0d0d0c 0 6.5px, transparent 7px), repeating-conic-gradient(#3b3b38 0deg 8deg, #2a2a28 8deg 16deg)'
                                          box_shadow: 'inset 0 0 0 2.5px #0d0d0c, inset 0 0 0 5px rgba(138,135,126,0.55)'
                                          animations: [{id: look, preset: custom:iris-look}]
                                        modules: []
                  - gap: 0px
                    vertical_align: center
                    modules:
                      - type: text
                        text: The Eye
                        design:
                          font_family: Anton, 'Bebas Neue', Oswald, Impact, sans-serif
                          font_size: 50px
                          line_height: '0.95'
                          text_transform: uppercase
                          color: '#ece8de'
                          letter_spacing: 0.5px
                          transform: rotate(-6deg)
                          transform_origin: left bottom
                          text_shadow: '3px 3px 0 #0d0d0c'
                      - type: text
                        text: is watching you
                        design:
                          font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                          font_size: 23px
                          letter_spacing: 1.5px
                          text_transform: uppercase
                          color: '#ece8de'
                          background_color: '#c8261d'
                          padding: 3px 10px 1px
                          margin_top: 10px
                          transform: rotate(-6deg)
                          transform_origin: left top
                          white_space: nowrap
                          box_shadow: '4px 4px 0 #0d0d0c'
                          width: fit-content
              - id: slogans
                layout: 1-1-1
                gap: 4px
                padding: 7px 6px 6px
                design: {background: 'linear-gradient(100deg, #e4dccb 0%, #cfc5ae 100%)', box_shadow: '4px 4px 0 #0d0d0c'}
                columns:
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Work
                        design:
                          font_family: Anton, 'Bebas Neue', Oswald, Impact, sans-serif
                          font_size: 21px
                          text_transform: uppercase
                          color: '#0d0d0c'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
                      - type: text
                        text: is rest
                        design:
                          font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                          font_size: 15px
                          letter_spacing: 1.5px
                          text_transform: uppercase
                          color: '#c8261d'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Order
                        design:
                          font_family: Anton, 'Bebas Neue', Oswald, Impact, sans-serif
                          font_size: 21px
                          text_transform: uppercase
                          color: '#0d0d0c'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
                      - type: text
                        text: is calm
                        design:
                          font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                          font_size: 15px
                          letter_spacing: 1.5px
                          text_transform: uppercase
                          color: '#c8261d'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Silence
                        design:
                          font_family: Anton, 'Bebas Neue', Oswald, Impact, sans-serif
                          font_size: 21px
                          text_transform: uppercase
                          color: '#0d0d0c'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
                      - type: text
                        text: is safety
                        design:
                          font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                          font_size: 15px
                          letter_spacing: 1.5px
                          text_transform: uppercase
                          color: '#c8261d'
                          text_align: center
                          line_height: '1'
                          white_space: nowrap
              - id: clock
                column_widths: [auto, 1fr]
                gap: 14px
                padding: 6px 0 0
                columns:
                  - vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design: {font_family: 'Anton, ''Bebas Neue'', Oswald, Impact, sans-serif', font_size: 44px, color: '#ece8de', line_height: '1', letter_spacing: 1px}
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: Oswald, 'Arial Narrow', sans-serif
                          font_size: 15px
                          font_weight: '600'
                          text_transform: uppercase
                          letter_spacing: 1px
                          color: '#ece8de'
                          white_space: nowrap
                      - {type: text, text: District 1 · The Union, design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 13px, color: '#9a968c', white_space: nowrap}}
              - id: status
                layout: 1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #c9c3b2'}
                        modules:
                          - {type: icon, icon: mdi:lock, size: 15px, design: {color: '#c9c3b2', display: flex}}
                          - type: text
                            text: Door sealed
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {conditions: [{type: state, entity: lock.front_door, state: locked}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #e8402f'}
                        modules:
                          - {type: icon, icon: mdi:lock-open-variant, size: 15px, design: {color: '#e8402f', display: flex}}
                          - type: text
                            text: Door open
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {conditions: [{type: state, entity: lock.front_door, state_not: locked}]}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #e8402f'}
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg viewBox="0 0 24 24"><path d="M1 12 Q12 2 23 12 Q12 22 1 12 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="currentColor"/></svg>
                            size: 15px
                            design: {color: '#e8402f', display: flex, animations: [{id: b, preset: blink, duration: 1.2s, intensity: 70}]}
                          - type: text
                            text: Movement
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {mode: any, conditions: [{type: state, entity: binary_sensor.hall_motion, state: 'on'}, {type: state, entity: binary_sensor.patio_motion, state: 'on'}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #c9c3b2'}
                        modules:
                          - type: icon
                            icon: svg
                            svg: <svg viewBox="0 0 24 24"><path d="M1 12 Q12 2 23 12 Q12 22 1 12 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="currentColor"/></svg>
                            size: 15px
                            design: {color: '#c9c3b2', display: flex}
                          - type: text
                            text: All quiet
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {mode: every, conditions: [{type: state, entity: binary_sensor.hall_motion, state_not: 'on'}, {type: state, entity: binary_sensor.patio_motion, state_not: 'on'}]}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #c9c3b2'}
                        modules:
                          - {type: icon, icon: mdi:shield-half-full, size: 15px, design: {color: '#c9c3b2', display: flex}}
                          - type: text
                            use_entity: true
                            entity: alarm_control_panel.home
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {conditions: [{type: state, entity: alarm_control_panel.home, state_not: triggered}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 6px 6px, background_color: 'rgba(0,0,0,0.45)', border: '1px solid rgba(236,232,222,0.12)', border_left: '3px solid #e8402f'}
                        modules:
                          - {type: icon, icon: mdi:bullhorn, size: 15px, design: {color: '#e8402f', display: flex, animations: [{id: b, preset: blink, duration: 0.8s, intensity: 70}]}}
                          - type: text
                            text: Alarm
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 12px
                              font_weight: '600'
                              letter_spacing: 0.5px
                              text_transform: uppercase
                              color: '#ece8de'
                              white_space: nowrap
                        display: {conditions: [{type: state, entity: alarm_control_panel.home, state: triggered}]}
              - id: foot
                padding: 2px 0 0
                columns:
                  - modules:
                      - type: text
                        text: The screen is always on
                        design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 12px, color: '#9a968c', line_height: '1.3', text_align: center}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: People
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px), radial-gradient(rgba(0,0,0,0.10) 0.7px, transparent 1.1px) 0 0 / 5px 5px, radial-gradient(rgba(255,255,255,0.045) 0.7px, transparent 1.1px) 2px 3px / 7px 7px, radial-gradient(ellipse 110% 70% at 50% -15%, rgba(169,196,184,0.09), transparent 60%), linear-gradient(170deg, #2a2a28 0%, #1e1e1d 100%)'
            border_radius: 3px
            padding: 16px
            box_shadow: 6px 6px 0 rgba(0,0,0,0.45), inset 0 0 0 1px rgba(236,232,222,0.07), inset 0 3px 0 rgba(200,38,29,0.85)
            css: 'font-family: Oswald, ''Arial Narrow'', sans-serif; color: #ece8de;'
            rows:
              - id: head
                column_widths: [1fr, auto]
                padding: 0 0 6px
                columns:
                  - gap: 3px
                    modules:
                      - type: text
                        text: Residents
                        design: {font_family: 'Oswald, ''Arial Narrow'', sans-serif', font_size: 11px, font_weight: '600', letter_spacing: 2.5px, text_transform: uppercase, color: '#c8261d'}
                      - type: text
                        text: Resident files
                        design: {font_family: '''Bebas Neue'', Oswald, Impact, sans-serif', font_size: 28px, letter_spacing: 1px, text_transform: uppercase, color: '#ece8de', line_height: '1'}
                  - vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of 3 present'
                        design:
                          font_family: Oswald, 'Arial Narrow', sans-serif
                          font_size: 12px
                          font_weight: '600'
                          text_transform: uppercase
                          letter_spacing: 1px
                          color: '#ece8de'
                          padding: 4px 10px
                          background_color: '#c8261d'
                          white_space: nowrap
              - id: anna
                padding: 0 0 10px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 12px
                        align: center
                        design:
                          padding: 9px 14px 9px 10px
                          background: 'radial-gradient(rgba(0,0,0,0.10) 0.7px, transparent 1.1px) 0 0 / 5px 5px, radial-gradient(rgba(255,255,255,0.045) 0.7px, transparent 1.1px) 2px 3px / 7px 7px, radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 55%), radial-gradient(ellipse at 90% 100%, rgba(110,80,40,0.22), transparent 60%), linear-gradient(180deg, #e4dccb, #cfc5ae)'
                          box_shadow: '4px 4px 0 #0d0d0c'
                          cursor: pointer
                          border_left: '6px solid #c8261d'
                        modules:
                          - type: vertical
                            gap: 0px
                            design: {position: relative}
                            modules:
                              - type: image
                                entity: person.anna
                                entity_picture: true
                                aspect_ratio: '1'
                                design:
                                  width: 58px
                                  border_radius: '0'
                                  filter: grayscale(1) contrast(1.15)
                                  css: 'outline: 2px solid #1a1814; outline-offset: 2px;'
                                  conditional:
                                    - {id: gone, name: Away, conditions: [{type: state, entity: person.anna, state: not_home}], design: {filter: grayscale(1) brightness(0.25) contrast(1.4)}}
                          - type: vertical
                            gap: 3px
                            design: {flex: '1', min_width: '0'}
                            modules:
                              - {type: text, text: File 3141, design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 12px, color: '#5b5448', line_height: '1.1'}}
                              - type: text
                                text: Anna
                                design:
                                  font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                                  font_size: 26px
                                  letter_spacing: 1px
                                  text_transform: uppercase
                                  color: '#1a1814'
                                  line_height: '1'
                                  conditional:
                                    - id: gone
                                      name: Away
                                      conditions: [{type: state, entity: person.anna, state: not_home}]
                                      design: {text_decoration: line-through, text_decoration_thickness: 3px, color: '#5b5448'}
                              - type: text
                                text: 'Conduct: exemplary'
                                design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 12px, color: '#5b5448', line_height: '1.1'}
                                display: {conditions: [{type: state, entity: person.anna, state: home}]}
                              - type: text
                                text: Out of the building
                                design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 12px, color: '#c8261d', line_height: '1.1'}
                                display: {conditions: [{type: state, entity: person.anna, state: not_home}]}
                              - type: text
                                text: Out on business
                                design: {font_family: '''Special Elite'', ''Courier New'', monospace', font_size: 12px, color: '#5b5448', line_height: '1.1'}
                                display: {mode: every, conditions: [{type: state, entity: person.anna, state_not: home}, {type: state, entity: person.anna, state_not: not_home}]}
                          - type: text
                            text: Present · noted
                            design:
                              font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                              font_size: 16px
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#1a1814'
                              line_height: '1'
                              padding: 4px 8px 2px
                              border: '2px solid #1a1814'
                              transform: rotate(-4deg)
                              white_space: nowrap
                              opacity: '0.9'
                            display: {conditions: [{type: state, entity: person.anna, state: home}]}
                          - type: text
                            text: Away
                            design:
                              font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                              font_size: 16px
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#c8261d'
                              line_height: '1'
                              padding: 4px 8px 2px
                              border: '2px solid #c8261d'
                              transform: rotate(-7deg)
                              white_space: nowrap
                              opacity: '0.9'
                            display: {conditions: [{type: state, entity: person.anna, state: not_home}]}
                          - type: text
                            text: At work
                            design:
                              font_family: '''Bebas Neue'', Oswald, Impact, sans-serif'
                              font_size: 16px
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              color: '#7a1410'
                              line_height: '1'
                              padding: 4px 8px 2px
                              border: '2px solid #7a1410'
