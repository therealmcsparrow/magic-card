# Gunmetal Freighter: brushed gunmetal, amber indicator lamps and teal holo readouts.
Gunmetal Freighter:
  ha-card-border-radius: 12px
  ha-card-border-width: 0px
  ha-card-box-shadow: "inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px #3B4249, 0 8px 22px rgba(0,0,0,0.55)"
  ha-font-family-body: "Oswald, 'Arial Narrow', sans-serif"
  paper-font-common-base_-_font-family: "Oswald, 'Arial Narrow', sans-serif"
  modes:
    dark:
      primary-color: "#FFB02E"
      accent-color: "#4FE0E6"
      dark-primary-color: "#C7841A"
      light-primary-color: "#FFD27A"
      text-primary-color: "#0B0D0F"
      primary-background-color: "#15181B"
      secondary-background-color: "#1E2226"
      card-background-color: "#262A30"
      ha-card-background: "#262A30"
      primary-text-color: "#E8E2D4"
      secondary-text-color: "#9AA3A9"
      disabled-text-color: "#646C73"
      divider-color: "rgba(232,226,212,0.10)"
      lovelace-background: "radial-gradient(ellipse at 50% -10%, rgba(255,176,46,0.10), transparent 55%), radial-gradient(ellipse at 100% 100%, rgba(79,224,230,0.08), transparent 50%), repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 96px), repeating-linear-gradient(90deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 2px, transparent 2px, transparent 240px), linear-gradient(170deg, #1C2024 0%, #121417 60%, #0B0C0E 100%)"
      state-icon-color: "#9AA3A9"
      state-icon-active-color: "#FFB02E"
      state-active-color: "#FFB02E"
      sidebar-background-color: "#121417"
      sidebar-text-color: "#C9C3B6"
      sidebar-selected-icon-color: "#FFB02E"
      sidebar-selected-text-color: "#FFB02E"
      app-header-background-color: "#121417"
      app-header-text-color: "#E8E2D4"
      success-color: "#8EE05A"
      warning-color: "#FFB02E"
      error-color: "#FF4A3D"
      info-color: "#4FE0E6"
      state-on-color: "#FFB02E"
      state-off-color: "#646C73"
      state-home-color: "#4FE0E6"
      state-not_home-color: "#646C73"
      state-unavailable-color: "#4A525B"
      switch-checked-color: "#FFB02E"
      switch-checked-button-color: "#FFD27A"
      switch-checked-track-color: "#5C3F12"
      switch-unchecked-button-color: "#9AA3A9"
      switch-unchecked-track-color: "#2A2F35"
      slider-color: "#FFB02E"
      slider-track-color: "#2A2F35"
      paper-slider-knob-color: "#FFB02E"
      mdc-theme-primary: "#FFB02E"
      input-fill-color: "#1E2226"
      code-editor-background-color: "#121417"
