            padding: 16px
            box_shadow: 'inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px #3B4249, inset 0 0 0 2px #121417, 0 8px 22px rgba(0,0,0,0.55)'
            css: 'font-family: Oswald, ''Arial Narrow'', sans-serif; color: #E8E2D4;'
            custom_animations:
              data-blink:
                id: data-blink
                name: Data blink
                kind: keyframes
                duration: 3.2
                iterations: infinite
                target: element
                easing: linear
                keyframes: [{at: 0, opacity: 1}, {at: 46, opacity: 1}, {at: 48, opacity: 0.25}, {at: 62, opacity: 0.25}, {at: 64, opacity: 1}, {at: 100, opacity: 1}]
            rows:
              - id: r0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {padding: 0 0 2px}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 9px
                              height: 9px
                              min_width: 9px
                              border_radius: 50%
                              border: '1px solid #0A0B0C'
                              box_sizing: border-box
                              background: 'radial-gradient(circle at 35% 35%, #FFF6DD 0 12%, #4FE0E6 45%, #4FE0E6 100%)'
                              box_shadow: '0 0 8px #4FE0E6, 0 0 2px #4FE0E6'
                              animations: [{preset: blink, duration: 2.6s, intensity: 55}]
                          - type: text
                            text: Nav computer
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 15px
                              color: '#E8E2D4'
                              line_height: '1.1'
                              text_transform: uppercase
                              letter_spacing: 1.5px
                              font_weight: '500'
                              white_space: nowrap
                          - {type: separator, separator_style: none, design: {flex: '1', min_width: 12px, height: 1px, background: 'linear-gradient(90deg, #3A4148, rgba(58,65,72,0.2))'}}
                          - type: text
                            text: NAV-7
                            design:
                              font_family: Inconsolata, 'Share Tech Mono', monospace
                              font_size: 11px
                              color: '#4FE0E6'
                              line_height: '1.15'
                              letter_spacing: 1.5px
                              white_space: nowrap
                              text_transform: uppercase
              - id: r1
                columns:
                  - modules:
                      - type: vertical
                        gap: 8px
                        design:
                          background: 'linear-gradient(180deg, rgba(79,224,230,0.10), rgba(79,224,230,0.02) 60%), #08161A'
                          border: 1px solid rgba(79,224,230,0.32)
                          border_radius: 6px
                          box_shadow: inset 0 0 22px rgba(79,224,230,0.14), inset 0 2px 6px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.05)
                          box_sizing: border-box
                          padding: 10px 12px
                          position: relative
                          overflow: hidden
                          animations: [{preset: scanline, color: '#4FE0E6', intensity: 22, duration: 4s, strength: 45}]
                        modules:
                          - type: horizontal
                            gap: 10px
                            align: center
                            justify: space-between
                            design: {}
                            modules:
                              - type: weather
                                entity: weather.home
                                show_temperature: true
                                show_condition: true
                                show_forecast: false
                                animated_icons: true
                                design: {flex: '1', min_width: 0px, color: '#9AF6FF', font_family: 'Oswald, ''Arial Narrow'', sans-serif'}
                              - type: vertical
                                gap: 2px
                                align: end
                                design: {}
                                modules:
                                  - type: text
                                    text: Hull exterior
                                    design:
                                      font_family: Oswald, 'Arial Narrow', sans-serif
                                      font_size: 10px
                                      color: '#4FE0E6'
                                      line_height: '1.1'
                                      text_transform: uppercase
                                      letter_spacing: 1.4px
                                      font_weight: '500'
                                      text_align: right
                                  - type: text
                                    use_entity: true
                                    entity: sensor.outdoor_temperature
                                    design:
                                      font_family: Inconsolata, 'Share Tech Mono', monospace
                                      font_size: 24px
                                      color: '#9AF6FF'
                                      line_height: '1.15'
                                      letter_spacing: 0.5px
                                      text_align: right
                                      text_shadow: 0 0 8px rgba(79,224,230,0.6)
                                      font_variant: tabular-nums
                          - {type: separator, separator_style: none, design: {height: 1px, background: 'linear-gradient(90deg, transparent, rgba(79,224,230,0.45), transparent)'}}
                          - type: forecast
                            entity: weather.home
                            forecast_type: daily
                            num_forecasts: 5
                            show_temperature: true
                            show_precipitation: false
                            show_wind: false
                            animated_icons: true
                            design: {color: '#9AF6FF', font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 12px}
                          - type: text
                            text: Course plotted · five days out
                            design:
                              font_family: Inconsolata, 'Share Tech Mono', monospace
                              font_size: 11px
                              color: rgba(154,246,255,0.7)
                              line_height: '1.15'
                              letter_spacing: 1.5px
                              text_transform: uppercase
                              white_space: nowrap
                              overflow: hidden
                              text_overflow: ellipsis
                              animations: [{preset: custom:data-blink}]
              - id: tiles
                layout: 1-1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: vertical
                        gap: 3px
                        design:
                          background_color: rgba(8,9,11,0.55)
                          border_radius: 6px
                          box_shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05)
                          box_sizing: border-box
                          padding: 7px 8px
                          min_width: 0px
                          overflow: hidden
                        modules:
                          - type: text
                            text: Dawn
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 10.5px
                              color: '#9AA3A9'
                              line_height: '1.1'
                              text_transform: uppercase
                              letter_spacing: 1px
                              font_weight: '500'
                              white_space: nowrap
                              overflow: hidden
                              text_overflow: ellipsis
                          - type: text
                            use_entity: true
                            entity: sensor.sunrise
                            design:
                              font_family: Inconsolata, 'Share Tech Mono', monospace
                              font_size: 14.5px
                              color: '#FFD27A'
