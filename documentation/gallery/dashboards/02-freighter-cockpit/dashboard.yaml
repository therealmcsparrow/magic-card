# Freighter Cockpit: a light-freighter cockpit dashboard made only of Magic Cards.
# edit the generator, not this file.
title: Freighter Cockpit
views:
  - title: Cockpit
    path: cockpit
    icon: mdi:space-station
    type: sections
    max_columns: 4
    theme: Gunmetal Freighter
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Heading 1
            background: 'radial-gradient(circle at 10px 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at 10px calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(ellipse 70% 40% at 18% 0%, rgba(255,255,255,0.07), transparent 70%), radial-gradient(ellipse 50% 30% at 90% 100%, rgba(0,0,0,0.35), transparent 70%), repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 3px), linear-gradient(165deg, #343a41 0%, #262a30 50%, #1c1f23 100%)'
            border_radius: 12px
            padding: 12px 16px
            box_shadow: 'inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px #3B4249, inset 0 0 0 2px #121417, 0 8px 22px rgba(0,0,0,0.55)'
            css: 'font-family: Oswald, ''Arial Narrow'', sans-serif; color: #E8E2D4;'
            rows:
              - id: r0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 12px
                        align: center
                        design: {}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 26px
                              height: 26px
                              min_width: 26px
                              border_radius: 3px
                              background: 'repeating-linear-gradient(-45deg, #FFB02E 0px, #FFB02E 5px, #15181B 5px, #15181B 10px)'
                              box_shadow: inset 0 0 0 1px rgba(0,0,0,0.6)
                          - type: text
                            text: Cockpit
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 21px
                              color: '#E8E2D4'
                              line_height: '1.1'
                              text_transform: uppercase
                              letter_spacing: 2.5px
                              font_weight: '500'
                              white_space: nowrap
                              text_shadow: '0 1px 0 #000'
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              min_width: 10px
                              height: 6px
                              background: 'repeating-linear-gradient(90deg, #3A4148 0px, #3A4148 2px, transparent 2px, transparent 6px)'
                              opacity: '0.8'
                          - type: text
                            text: SEC-01
                            design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 12px, color: '#4FE0E6', line_height: '1.15', letter_spacing: 2px, white_space: nowrap}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Cockpit
            background: 'radial-gradient(circle at 10px 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at 10px calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(ellipse 70% 40% at 18% 0%, rgba(255,255,255,0.07), transparent 70%), radial-gradient(ellipse 50% 30% at 90% 100%, rgba(0,0,0,0.35), transparent 70%), repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 3px), linear-gradient(165deg, #343a41 0%, #262a30 50%, #1c1f23 100%)'
            border_radius: 12px
            padding: 14px 16px 16px
            box_shadow: 'inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px #3B4249, inset 0 0 0 2px #121417, 0 8px 22px rgba(0,0,0,0.55)'
            css: 'font-family: Oswald, ''Arial Narrow'', sans-serif; color: #E8E2D4;'
            rows:
              - id: top
                column_widths: [166px, 1fr]
                gap: 14px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          width: 150px
                          height: 150px
                          border_radius: 50%
                          overflow: hidden
                          box_sizing: border-box
                          background: 'radial-gradient(circle at 60% 30%, #1B3A5C 0%, #0A1626 45%, #04070D 100%)'
                          box_shadow: '0 0 0 5px #3A4148, 0 0 0 7px #0E1012, 0 0 0 8px #4A525B, inset 0 0 26px rgba(0,0,0,0.85)'
                          margin: 8px
                        modules:
                          - type: separator
                            separator_style: none
                            design: {position: absolute, inset: '0', pointer_events: none, animations: [{preset: twinkle, color: '#DDEEFF', intensity: 10, duration: 3s, strength: 90}]}
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              inset: '0'
                              pointer_events: none
                              background: 'radial-gradient(circle, transparent 0 34%, #3A4148 34.5% 37.5%, transparent 38%), repeating-conic-gradient(from 22.5deg, #3A4148 0deg 3deg, transparent 3deg 45deg)'
                          - type: vertical
                            gap: 1px
                            design:
                              position: absolute
                              left: 31px
                              top: 31px
                              width: 88px
                              height: 88px
                              border_radius: 50%
                              box_sizing: border-box
                              display: flex
                              flex_direction: column
                              align_items: center
                              justify_content: center
                              background: radial-gradient(circle at 50% 40%, rgba(15,40,58,0.92), rgba(5,9,14,0.95))
                              border: '3px solid #3A4148'
                              box_shadow: 'inset 0 0 14px rgba(0,0,0,0.9), 0 0 0 1px #111'
                            modules:
                              - type: text
                                use_template: true
                                text: '{{ now().strftime(''%H:%M'') }}'
                                design:
                                  font_family: Inconsolata, 'Share Tech Mono', monospace
                                  font_size: 27px
                                  color: '#FFD27A'
                                  line_height: '1.15'
                                  letter_spacing: 1px
                                  text_align: center
                                  text_shadow: 0 0 10px rgba(255,176,46,0.65)
                                  font_weight: '700'
                              - type: text
                                text: Local
                                design:
                                  font_family: Oswald, 'Arial Narrow', sans-serif
                                  font_size: 9px
                                  color: '#4FE0E6'
                                  line_height: '1.1'
                                  text_transform: uppercase
                                  letter_spacing: 2px
                                  font_weight: '500'
                                  text_align: center
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 4px
                        design: {min_width: 0px}
                        modules:
                          - type: text
                            text: Light freighter · home run
                            design:
                              font_family: Inconsolata, 'Share Tech Mono', monospace
                              font_size: 11px
                              color: '#FFB02E'
                              line_height: '1.15'
                              letter_spacing: 2px
                              text_transform: uppercase
                              white_space: nowrap
                              overflow: hidden
                              text_overflow: ellipsis
                          - type: text
                            use_template: true
                            text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}'
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 28px
                              color: '#E8E2D4'
                              line_height: '1.05'
                              text_transform: none
                              letter_spacing: 0.5px
                              font_weight: '500'
                          - type: text
                            text: Captain.
                            design:
                              font_family: Oswald, 'Arial Narrow', sans-serif
                              font_size: 28px
                              color: '#FFB02E'
                              line_height: '1.05'
                              text_transform: none
                              letter_spacing: 0.5px
                              font_weight: '500'
                              margin_top: -4px
                          - type: text
                            use_template: true
                            text: '{{ now().strftime(''%A %-d %B'') }}'
                            design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 13px, color: '#9AA3A9', line_height: '1.15', letter_spacing: 0.5px, white_space: nowrap}
                          - type: horizontal
                            gap: 7px
                            align: center
                            design: {margin_top: 4px}
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 8px
                                  height: 8px
                                  min_width: 8px
                                  border_radius: 50%
                                  border: '1px solid #0A0B0C'
                                  box_sizing: border-box
                                  background: 'radial-gradient(circle at 35% 35%, #77706A 0 10%, #3A3226 60%)'
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions: [{type: state, entity: sensor.solar_power, above: 50}]
                                      design: {background: 'radial-gradient(circle at 35% 35%, #FFF6DD 0 12%, #4FE0E6 45%, #4FE0E6 100%)', box_shadow: '0 0 8px #4FE0E6, 0 0 2px #4FE0E6'}
                              - type: text
                                text: Jump drive ready
                                design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 12px, color: '#4FE0E6', line_height: '1.15', letter_spacing: 0.5px, white_space: nowrap}
                                display: {conditions: [{type: state, entity: sensor.solar_power, above: 50}]}
                              - type: text
                                text: Jump drive cold
                                design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 12px, color: '#646C73', line_height: '1.15', letter_spacing: 0.5px, white_space: nowrap}
                                display: {conditions: [{type: state, entity: sensor.solar_power, below: 50.01}]}
              - id: status
                layout: 1-1-1
                gap: 8px
                columns:
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          background_color: rgba(8,9,11,0.55)
                          border_radius: 6px
                          box_shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05)
                          box_sizing: border-box
                          padding: 7px 9px
                          min_width: 0px
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  min_width: 7px
                                  border_radius: 50%
                                  border: '1px solid #0A0B0C'
                                  box_sizing: border-box
                                  background: 'radial-gradient(circle at 35% 35%, #77706A 0 10%, #3A3226 60%)'
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions: [{type: state, entity: alarm_control_panel.home, state_not: disarmed}]
                                      design: {background: 'radial-gradient(circle at 35% 35%, #FFF6DD 0 12%, #4FE0E6 45%, #4FE0E6 100%)', box_shadow: '0 0 8px #4FE0E6, 0 0 2px #4FE0E6'}
                              - type: text
                                text: Shields
                                design:
                                  font_family: Oswald, 'Arial Narrow', sans-serif
                                  font_size: 10.5px
                                  color: '#9AA3A9'
                                  line_height: '1.1'
                                  text_transform: uppercase
                                  letter_spacing: 1.3px
                                  font_weight: '500'
                                  white_space: nowrap
                          - type: text
                            use_entity: true
                            entity: alarm_control_panel.home
                            design:
                              font_family: Inconsolata, 'Share Tech Mono', monospace
                              font_size: 14px
                              color: '#FFD27A'
                              line_height: '1.15'
                              letter_spacing: 0.5px
                              white_space: nowrap
                              overflow: hidden
                              text_overflow: ellipsis
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          background_color: rgba(8,9,11,0.55)
                          border_radius: 6px
                          box_shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05)
                          box_sizing: border-box
                          padding: 7px 9px
                          min_width: 0px
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  min_width: 7px
                                  border_radius: 50%
                                  border: '1px solid #0A0B0C'
                                  box_sizing: border-box
                                  background: 'radial-gradient(circle at 35% 35%, #77706A 0 10%, #3A3226 60%)'
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions: [{type: state, entity: lock.front_door, state: locked}]
                                      design: {background: 'radial-gradient(circle at 35% 35%, #FFF6DD 0 12%, #4FE0E6 45%, #4FE0E6 100%)', box_shadow: '0 0 8px #4FE0E6, 0 0 2px #4FE0E6'}
                              - type: text
                                text: Hatch
                                design:
                                  font_family: Oswald, 'Arial Narrow', sans-serif
                                  font_size: 10.5px
                                  color: '#9AA3A9'
                                  line_height: '1.1'
                                  text_transform: uppercase
                                  letter_spacing: 1.3px
                                  font_weight: '500'
                                  white_space: nowrap
                          - type: text
                            use_entity: true
                            entity: lock.front_door
                            design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 14px, color: '#FFD27A', line_height: '1.15', letter_spacing: 0.5px, white_space: nowrap}
                  - modules:
                      - type: vertical
                        gap: 4px
                        design:
                          background_color: rgba(8,9,11,0.55)
                          border_radius: 6px
                          box_shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05)
                          box_sizing: border-box
                          padding: 7px 9px
                          min_width: 0px
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  min_width: 7px
                                  border_radius: 50%
                                  border: '1px solid #0A0B0C'
                                  box_sizing: border-box
                                  background: 'radial-gradient(circle at 35% 35%, #77706A 0 10%, #3A3226 60%)'
                                  conditional:
                                    - id: lit
                                      name: lit
                                      conditions: [{type: state, entity: person.anna, state: home}]
                                      design: {background: 'radial-gradient(circle at 35% 35%, #FFF6DD 0 12%, #FFB02E 45%, #FFB02E 100%)', box_shadow: '0 0 8px #FFB02E, 0 0 2px #FFB02E'}
                              - type: text
                                text: Crew aboard
                                design:
                                  font_family: Oswald, 'Arial Narrow', sans-serif
                                  font_size: 10.5px
                                  color: '#9AA3A9'
                                  line_height: '1.1'
                                  text_transform: uppercase
                                  letter_spacing: 1.3px
                                  font_weight: '500'
                                  white_space: nowrap
                          - type: text
                            use_template: true
                            text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of 3'
                            design: {font_family: 'Inconsolata, ''Share Tech Mono'', monospace', font_size: 14px, color: '#FFD27A', line_height: '1.15', letter_spacing: 0.5px, white_space: nowrap}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Nav computer
            background: 'radial-gradient(circle at 10px 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) 10px, #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at 10px calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #9AA2AA 0 1.4px, #2A2E33 1.8px, #0A0B0C 2.4px, transparent 3px), radial-gradient(ellipse 70% 40% at 18% 0%, rgba(255,255,255,0.07), transparent 70%), radial-gradient(ellipse 50% 30% at 90% 100%, rgba(0,0,0,0.35), transparent 70%), repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 3px), linear-gradient(165deg, #343a41 0%, #262a30 50%, #1c1f23 100%)'
