title: Park Control
views:
  - title: Park Control
    path: park-control
    icon: mdi:account-cowboy-hat
    type: sections
    max_columns: 4
    theme: Park Control
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Park control header
            background: linear-gradient(180deg, rgba(255,253,248,0.95) 0%, rgba(247,241,229,0.93) 100%)
            border_radius: 6px
            padding: 18px
            box_shadow: 0 18px 38px rgba(70,28,10,0.32), inset 0 0 0 1px rgba(168,130,58,0.55)
            css: 'font-family: Montserrat, sans-serif; color: #1b232b;'
            grid_options:
              columns: 12
              rows: auto
            rows:
              - id: head
                columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: end
                        justify: space-between
                        design: {}
                        modules:
                          - type: vertical
                            gap: 3px
                            design:
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: text
                                text: Frontier park · Park Control
                                design:
                                  font_family: '''IBM Plex Mono'', ''Source Code Pro'', monospace'
                                  font_size: 10px
                                  font_weight: '500'
                                  letter_spacing: 2.2px
                                  text_transform: uppercase
                                  color: '#a8823a'
                                  line_height: '1.3'
                              - type: text
                                text: Dry Creek operations
                                design:
                                  font_family: '''Cormorant Garamond'', ''Playfair Display'', Georgia, serif'
                                  font_size: 24px
                                  font_weight: '500'
                                  color: '#1b232b'
                                  line_height: '1.15'
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding_bottom: 4px
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 7px
                                  height: 7px
                                  border_radius: 50%
                                  background: '#b5532b'
                                  animations:
                                    - id: live
                                      preset: blink
                                      duration: 1.6s
                              - type: text
                                text: Live
                                design:
                                  font_family: '''IBM Plex Mono'', ''Source Code Pro'', monospace'
                                  font_size: 10px
                                  font_weight: '500'
                                  letter_spacing: 2px
                                  text_transform: uppercase
                                  color: '#b5532b'
                                  line_height: '1.3'
              - id: rule
                columns:
                  - modules:
                      - type: separator
                        separator_style: none
                        design:
                          height: 1px
                          background: 'linear-gradient(90deg, #a8823a 0%, rgba(168,130,58,0.25) 70%, rgba(168,130,58,0) 100%)'
              - id: clock
                padding: 4px 0 0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 14px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: '{{ now().strftime(''%H:%M'') }}'
                            use_template: true
                            design:
                              font_family: '''Cormorant Garamond'', ''Playfair Display'', Georgia, serif'
                              font_size: 58px
                              font_weight: '400'
                              color: '#1b232b'
                              line_height: '0.95'
                              letter_spacing: -1px
                              font_variant: lining-nums tabular-nums
                          - type: vertical
                            gap: 4px
                            design:
                              padding_left: 14px
                              border_left: 1px solid rgba(168,130,58,0.55)
                              min_width: 0px
                            modules:
                              - type: text
                                text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}'
                                use_template: true
                                design:
                                  font_family: '''Cormorant Garamond'', ''Playfair Display'', Georgia, serif'
                                  font_style: italic
                                  font_size: 19px
                                  color: '#3c4650'
                                  line_height: '1.15'
                              - type: text
                                text: '{{ now().strftime(''%A %-d %B'') }}'
                                use_template: true
                                design:
                                  font_family: '''IBM Plex Mono'', ''Source Code Pro'', monospace'
                                  font_size: 12px
                                  color: '#6f7780'
                                  line_height: '1.25'
                                  font_variant: tabular-nums
              - id: desert
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                          height: 170px
                          overflow: hidden
                          border_radius: 3px
                          background: 'radial-gradient(ellipse at 72% 40%, rgba(255,226,160,0.55) 0%, rgba(255,226,160,0) 55%), linear-gradient(180deg, #f6e6c4 0%, #f1cf98 50%, #e7a76a 100%)'
                          box_shadow: inset 0 0 0 1px rgba(168,130,58,0.55)
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              left: 10%
                              width: 80%
                              top: 30px
                              height: 105px
                              border_radius: 50% 50% 0 0 / 100% 100% 0 0
                              border: 1px dashed rgba(122,74,30,0.5)
                              border_bottom: none
                              box_sizing: border-box
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              left: '0'
                              right: '0'
                              top: 135px
                              height: 1px
                              background: rgba(122,74,30,0.35)
                          - type: icon
                            icon: mdi:white-balance-sunny
                            size: 18px
                            design:
                              position: absolute
                              left: calc(50.0% - 13px)
                              top: 17px
                              width: 26px
                              height: 26px
                              display: flex
                              align_items: center
                              justify_content: center
                              border_radius: 50%
                              background: 'radial-gradient(circle, #fff6d8 0%, #ffd77a 55%, #f2a541 100%)'
                              color: '#c0701f'
                              box_shadow: 0 0 0 4px rgba(255,236,170,0.45), 0 0 28px 8px rgba(255,200,90,0.75)
                              z_index: '1'
                              animations:
                                - id: sun
                                  preset: glow-pulse
                                  color: '#ffd77a'
                                  intensity: 18
                                  duration: 4s
                              conditional:
                                - id: sun-0
                                  name: Azimuth 0-115
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      below: 115
                                  design:
                                    left: calc(11.4% - 13px)
                                    top: 95px
                                - id: sun-1
                                  name: Azimuth 115-140
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      above: 115
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      below: 140
                                  design:
                                    left: calc(19.4% - 13px)
                                    top: 55px
                                - id: sun-2
                                  name: Azimuth 140-165
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      above: 140
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      below: 165
                                  design:
                                    left: calc(33.1% - 13px)
                                    top: 27px
                                - id: sun-3
                                  name: Azimuth 195-220
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      above: 195
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      below: 220
                                  design:
                                    left: calc(66.9% - 13px)
                                    top: 27px
                                - id: sun-4
                                  name: Azimuth 220-245
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      above: 220
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      below: 245
                                  design:
                                    left: calc(80.6% - 13px)
                                    top: 55px
                                - id: sun-5
                                  name: Azimuth 245-360
                                  mode: every
                                  conditions:
                                    - type: attribute
                                      entity: sun.sun
                                      attribute: azimuth
                                      above: 245
                                  design:
                                    left: calc(88.6% - 13px)
                                    top: 95px
                            display:
                              conditions:
                                - type: state
                                  entity: sun.sun
                                  state: above_horizon
                          - type: icon
                            icon: mdi:weather-night
                            size: 18px
                            design:
                              position: absolute
                              right: 14%
                              top: 26px
                              width: 26px
                              height: 26px
                              display: flex
                              align_items: center
                              justify_content: center
                              border_radius: 50%
                              background: '#f4ecd6'
                              color: '#5b6b8a'
                              box_shadow: 0 0 24px 6px rgba(244,236,214,0.6)
                            display:
                              conditions:
                                - type: state
                                  entity: sun.sun
                                  state: below_horizon
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              left: '0'
                              right: '0'
                              bottom: '0'
                              height: 56px
                              background_image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 70' preserveAspectRatio='none'> <path d='M0 34 L30 34 L36 26 L78 26 L86 36 L120 38 L150 40 L160 22 L172 18 L214 18 L222 24 L230 38 L270 42 L300 30 L306 24 L338 24 L346 34 L400 36 L400 70 L0 70 Z' fill='%23b8673a'/> <path d='M0 50 L60 46 L110 52 L170 48 L240 54 L300 49 L360 53 L400 50 L400 70 L0 70 Z' fill='%238a4426'/> <path d='M0 62 L80 59 L160 63 L250 60 L330 64 L400 61 L400 70 L0 70 Z' fill='%235e2b19'/></svg>")
