                              background_repeat: no-repeat
                              animations:
                                - id: heat
                                  preset: heat-shimmer
                                  intensity: 1
                                  duration: 2.4s
                          - type: horizontal
                            gap: 4px
                            align: center
                            design:
                              position: absolute
                              left: 10px
                              bottom: 6px
                              z_index: '2'
                            modules:
                              - type: icon
                                icon: mdi:weather-sunset-up
                                size: 14px
                                design:
                                  color: '#ffe2b0'
                              - type: text
                                use_entity: true
                                entity: sensor.sunrise
