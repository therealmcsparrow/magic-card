# Park Control: white-and-glass control room, thin gold lines, over a sun-baked desert.
Park Control:
  ha-card-border-radius: 6px
  ha-card-border-width: 0px
  ha-card-box-shadow: "0 18px 38px rgba(70,28,10,0.32), inset 0 0 0 1px rgba(168,130,58,0.55)"
  primary-font-family: "Montserrat, Roboto, sans-serif"
  paper-font-common-base_-_font-family: "Montserrat, Roboto, sans-serif"
  modes:
    light:
      primary-color: "#a8823a"
      accent-color: "#b5532b"
      primary-background-color: "#efe1c4"
      secondary-background-color: "#f7f0e2"
      card-background-color: "#fbf7ef"
      ha-card-background: "rgba(252,248,240,0.94)"
      primary-text-color: "#1b232b"
      secondary-text-color: "#6f7780"
      text-primary-color: "#ffffff"
      disabled-text-color: "#a9a49a"
      divider-color: "rgba(168,130,58,0.28)"
      state-icon-color: "#a8823a"
      state-active-color: "#c8862a"
      paper-item-icon-color: "#a8823a"
      sidebar-background-color: "#f7f0e2"
      sidebar-text-color: "#1b232b"
      sidebar-icon-color: "#a8823a"
      app-header-background-color: "#f7f0e2"
      app-header-text-color: "#1b232b"
      success-color: "#2b8a83"
      info-color: "#2d6f8f"
      warning-color: "#c8862a"
      error-color: "#b3261e"
      lovelace-background: "radial-gradient(ellipse at 80% 0%, rgba(255,240,200,0.7) 0%, rgba(255,240,200,0) 45%), linear-gradient(180deg, #f1d7a4 0%, #e2ad6e 30%, #c97a46 60%, #9a4e2c 85%, #6e3420 100%)"
    dark:
      primary-color: "#d6b874"
      accent-color: "#e0794a"
      primary-background-color: "#2a150d"
      secondary-background-color: "#3a2116"
      card-background-color: "#fbf7ef"
      ha-card-background: "rgba(252,248,240,0.94)"
      primary-text-color: "#1b232b"
      secondary-text-color: "#6f7780"
      text-primary-color: "#ffffff"
      disabled-text-color: "#a9a49a"
      divider-color: "rgba(168,130,58,0.3)"
      state-icon-color: "#a8823a"
      state-active-color: "#c8862a"
      paper-item-icon-color: "#a8823a"
      sidebar-background-color: "#241209"
      sidebar-text-color: "#f3e6cc"
      sidebar-icon-color: "#d6b874"
      app-header-background-color: "#241209"
      app-header-text-color: "#f3e6cc"
      success-color: "#2b8a83"
      info-color: "#2d6f8f"
      warning-color: "#c8862a"
      error-color: "#b3261e"
      lovelace-background: "radial-gradient(ellipse at 78% 0%, rgba(255,214,150,0.55) 0%, rgba(255,214,150,0) 42%), linear-gradient(180deg, #d99a5c 0%, #b8673a 26%, #8a4426 52%, #5e2b19 78%, #2f150d 100%)"
