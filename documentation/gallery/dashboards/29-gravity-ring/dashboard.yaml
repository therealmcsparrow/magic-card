title: Gravity ring
views:
 -
  type: sections
  max_columns: 5
  path: gravity-ring
  title: Gravity ring
  icon: mdi:orbit
  theme: Gravity Ring
  background: linear-gradient(rgba(17, 16, 15, .5), rgba(17, 16, 15, .5)), url("/local/future/parts/hullPanel.webp") 0 0/512px
  sections:
   -
    type: grid
    column_span: 5
    cards:
     -
      type: custom:magic-card
      name: Gravity ring
      border_radius: '0'
      padding: '0'
      overflow: hidden
      box_shadow: none
