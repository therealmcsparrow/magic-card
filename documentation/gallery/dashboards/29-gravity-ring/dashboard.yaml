      custom_animations:
       ring-turn:
        id: ring-turn
        name: ring turn
        kind: keyframes
        duration: 120
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           rotate: 0
         -
          at: 100
          transform:
           rotate: 360
        bindings:
         -
          target: element
          property: speed
          input:
           min: 100
           max: 5000
          output:
           - 0.35
           - 2.4
          smoothing: 3
        origin: center
       roller-spin:
        id: roller-spin
        name: roller spin
        kind: keyframes
        duration: 14
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           rotate: 0
         -
          at: 100
          transform:
           rotate: 360
        bindings:
         -
          target: element
          property: speed
          input:
           min: 100
           max: 5000
          output:
           - 0.35
           - 2.4
          smoothing: 3
        origin: center
       room-warm:
        id: room-warm
        name: room warm
        kind: keyframes
        duration: 9
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.84
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.84
       lamp-soft:
        id: lamp-soft
        name: lamp soft
