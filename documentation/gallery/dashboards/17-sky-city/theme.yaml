# Sky City: a golden-hour sky over a city of floating buildings. Navy enamel cards with gilt edges,
# cream type, red-white-blue accents. Light mode is a bright noon sky with parchment cards.
Sky City:
  ha-card-border-radius: 14px
  ha-card-border-width: 0px
  ha-dialog-border-radius: 16px
  mdc-shape-medium: 14px
  primary-font-family: "'Playfair Display', Georgia, serif"
  paper-font-common-base_-_font-family: "'Playfair Display', Georgia, serif"
  modes:
    dark:
      primary-color: "#d6a845"
      accent-color: "#b73a3a"
      dark-primary-color: "#a8812f"
      light-primary-color: "#f3d27a"
      primary-background-color: "#0d1c38"
      secondary-background-color: "#15294d"
      card-background-color: "#13284a"
      ha-card-background: "#13284a"
      ha-card-box-shadow: "inset 0 0 0 1px rgba(214,168,69,0.75), 0 12px 30px rgba(3,8,20,0.5)"
      primary-text-color: "#f5ead0"
      secondary-text-color: "#a9b4c8"
      text-primary-color: "#0d1c38"
      disabled-text-color: "#6b7891"
      divider-color: "rgba(214,168,69,0.28)"
      lovelace-background: "linear-gradient(180deg, #0b1a36 0%, #183663 32%, #3d4f7f 58%, #8a6a7e 80%, #d99a62 100%)"
      app-header-background-color: "#0d1c38"
      app-header-text-color: "#f3d27a"
      sidebar-background-color: "#0a1630"
      sidebar-text-color: "#f5ead0"
      sidebar-icon-color: "#a9b4c8"
      sidebar-selected-icon-color: "#f3d27a"
      sidebar-selected-text-color: "#f3d27a"
      state-icon-color: "#f3d27a"
      state-icon-active-color: "#ffd56b"
      state-active-color: "#ffd56b"
      paper-item-icon-color: "#f3d27a"
      success-color: "#5fd38a"
      warning-color: "#ffb347"
      error-color: "#e2453c"
      info-color: "#8ec5e8"
      switch-checked-color: "#d6a845"
      switch-checked-button-color: "#f3d27a"
      switch-checked-track-color: "#a8812f"
      input-fill-color: "#15294d"
      code-editor-background-color: "#0a1630"
      rgb-primary-color: "214, 168, 69"
      rgb-accent-color: "183, 58, 58"
      rgb-primary-text-color: "245, 234, 208"
    light:
      primary-color: "#2c4f8f"
      accent-color: "#b73a3a"
      dark-primary-color: "#1d3a6e"
      light-primary-color: "#8ec5e8"
      primary-background-color: "#e9f2f8"
      secondary-background-color: "#f5ead0"
      card-background-color: "#fbf5e6"
      ha-card-background: "#fbf5e6"
      ha-card-box-shadow: "inset 0 0 0 1px rgba(184,138,58,0.6), 0 8px 22px rgba(19,40,74,0.15)"
      primary-text-color: "#13284a"
      secondary-text-color: "#4d607f"
      text-primary-color: "#fbf5e6"
      disabled-text-color: "#93a0b5"
      divider-color: "rgba(184,138,58,0.35)"
      lovelace-background: "linear-gradient(180deg, #4f9bd6 0%, #8cc6ec 45%, #d7ecf7 78%, #fbe7c2 100%)"
      app-header-background-color: "#2c4f8f"
      app-header-text-color: "#fbf5e6"
      state-icon-color: "#2c4f8f"
      state-icon-active-color: "#d6a845"
      state-active-color: "#d6a845"
      success-color: "#2e9e5b"
      warning-color: "#d98a1c"
      error-color: "#b73a3a"
      info-color: "#2c78b8"
      switch-checked-color: "#2c4f8f"
      rgb-primary-color: "44, 79, 143"
      rgb-accent-color: "183, 58, 58"
      rgb-primary-text-color: "19, 40, 74"
