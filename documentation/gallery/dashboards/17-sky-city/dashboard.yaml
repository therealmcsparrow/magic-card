            custom_animations:
              - {id: cloud-sea, name: Cloud sea drift, kind: path, duration: 60, easing: linear, iterations: infinite, path: {d: M0 0 L-50 0, units: percent}}
            grid_options: {columns: 12, rows: auto}
            rows:
              - id: main
                design: {}
                columns:
                  - id: body
