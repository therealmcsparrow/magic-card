                            design:
                              position: absolute
                              pointer_events: none
                              inset: '0'
                              background: radial-gradient(circle at 86% 14%, rgba(255,246,214,0.95) 0px, rgba(255,236,170,0.55) 40px, rgba(255,236,170,0) 140px)
                          - type: separator
                            separator_style: none
                            design:
                              position: absolute
                              pointer_events: none
                              inset: '0'
