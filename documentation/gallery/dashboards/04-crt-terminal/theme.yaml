# Green Phosphor: green phosphor on black CRT glass, amber for warnings.
# Copy into /config/themes/ (with `frontend: themes: !include_dir_merge_named themes` in configuration.yaml),
# then run "Reload themes" (Developer tools > Actions > frontend.reload_themes).
Green Phosphor:
  modes:
    dark:
      primary-color: "#39ff6a"
      accent-color: "#ffb000"
      primary-background-color: "#000000"
      secondary-background-color: "#03140a"
      card-background-color: "#020c05"
      ha-card-background: "#020c05"
      primary-text-color: "#39ff6a"
      secondary-text-color: "#25b04a"
      disabled-text-color: "#1d7a37"
      text-primary-color: "#000000"
      divider-color: "rgba(57, 255, 106, 0.22)"
      lovelace-background: "radial-gradient(ellipse at 50% 0%, #062512 0%, #010a04 45%, #000000 100%) #000000"
      app-header-background-color: "#000000"
      app-header-text-color: "#39ff6a"
      sidebar-background-color: "#000000"
      sidebar-text-color: "#25b04a"
      sidebar-icon-color: "#25b04a"
      sidebar-selected-text-color: "#39ff6a"
      sidebar-selected-icon-color: "#39ff6a"
      ha-card-border-radius: "6px"
      ha-card-border-color: "rgba(57, 255, 106, 0.3)"
      ha-card-border-width: "0px"
      ha-card-box-shadow: "0 0 22px rgba(57, 255, 106, 0.07)"
      state-icon-color: "#25b04a"
      state-active-color: "#9dffb8"
      paper-item-icon-color: "#25b04a"
      paper-item-icon-active-color: "#9dffb8"
      success-color: "#39ff6a"
      info-color: "#9dffb8"
      warning-color: "#ffb000"
      error-color: "#ff3b2f"
      state-on-color: "#39ff6a"
      state-off-color: "#1d7a37"
      state-light-on-color: "#39ff6a"
      state-lock-locked-color: "#39ff6a"
      state-lock-unlocked-color: "#ffb000"
      state-alarm_control_panel-triggered-color: "#ff3b2f"
      state-binary_sensor-active-color: "#ffb000"
      mdc-theme-primary: "#39ff6a"
      switch-checked-color: "#39ff6a"
      input-fill-color: "#03140a"
      code-editor-background-color: "#000000"
      codemirror-keyword: "#ffb000"
