# "CRT terminal": a computer-terminal dashboard (green phosphor on black) for Home Assistant.
# Paste into a new dashboard: Edit dashboard > three dots > Raw configuration editor.
# Needs Magic Card, the "Green Phosphor" theme (theme.yaml) and, for the right fonts, the VT323 + Share Tech Mono resource (README).
title: CRT Terminal
views:
  - title: Terminal
    path: terminal
    icon: mdi:console
    type: sections
    max_columns: 4
    theme: Green Phosphor
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Heading · Interface
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.32) 0px, rgba(0,0,0,0.32) 1px, transparent 1px, transparent 3px), linear-gradient(90deg, rgba(57,255,106,0.16), rgba(57,255,106,0.03) 70%)
            box_shadow: inset 0 0 0 1px rgba(57,255,106,0.30), 0 0 16px rgba(57,255,106,0.06)
            border_radius: 6px
            padding: 8px 12px 8px 8px
            css: 'font-family: ''Share Tech Mono'', ''Source Code Pro'', monospace; color: #39ff6a; text-transform: uppercase; text-shadow: 0 0 6px rgba(57,255,106,0.55);'
            grid_options:
              columns: 12
              rows: auto
            rows:
              - id: heading
                columns:
                  - modules:
                      - type: horizontal
                        gap: 12px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: '01'
                            design:
                              font_family: VT323, 'Source Code Pro', monospace
                              font_size: 34px
                              line_height: '1'
                              color: '#000000'
                              background_color: '#39ff6a'
                              padding: 0 6px
                              text_shadow: none
                              box_shadow: '0 0 12px #39ff6a88'
                          - type: vertical
                            gap: 0px
                            design:
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: text
                                text: Interface
                                design:
                                  font_family: VT323, 'Source Code Pro', monospace
                                  font_size: 30px
                                  line_height: '1'
                                  white_space: nowrap
                                  letter_spacing: 2px
                          - type: text
                            text: Main computer
                            design:
                              font_size: 12px
                              color: '#1d7a37'
                              letter_spacing: 1.5px
                              line_height: '1.2'
                              white_space: nowrap
          - type: custom:magic-card
            name: Main terminal
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.32) 0px, rgba(0,0,0,0.32) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse at 50% 35%, #06240f 0%, #021007 60%, #000000 100%)'
            border_radius: 6px
            padding: 14px 16px 16px
            box_shadow: inset 0 0 0 1px rgba(57,255,106,0.30), inset 0 0 32px rgba(57,255,106,0.10), 0 0 22px rgba(57,255,106,0.07)
            css: 'font-family: ''Share Tech Mono'', ''Source Code Pro'', monospace; font-size: 15px; color: #39ff6a; text-transform: uppercase; text-shadow: 0 0 6px rgba(57,255,106,0.55); letter-spacing: 0.5px;'
            custom_animations:
              - id: mt-cursor
                name: Cursor blink
                kind: keyframes
                duration: 1.1
                iterations: infinite
                target: element
                easing: linear
                keyframes:
                  - at: 0
                    opacity: 1
                  - at: 49
                    opacity: 1
                  - at: 50
                    opacity: 0
                  - at: 99
                    opacity: 0
                  - at: 100
                    opacity: 1
              - id: mt-flicker
                name: CRT flicker
                kind: keyframes
                duration: 7
                iterations: infinite
                target: element
                easing: linear
                keyframes:
                  - at: 0
                    opacity: 1
                  - at: 31
                    opacity: 1
                  - at: 32
                    opacity: 0.82
                  - at: 33
                    opacity: 1
                  - at: 34
                    opacity: 0.9
                  - at: 35
                    opacity: 1
                  - at: 77
                    opacity: 1
                  - at: 78
                    opacity: 0.88
                  - at: 79
                    opacity: 1
                  - at: 100
                    opacity: 1
            animations:
              - preset: scanline
                duration: 6s
                intensity: 18
                strength: 40
                color: '#39ff6a'
            grid_options:
              columns: 12
              rows: auto
            rows:
              - id: main
                columns:
                  - id: stack
                    gap: 10px
                    modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: Main computer
                            design:
                              font_family: VT323, 'Source Code Pro', monospace
                              font_size: 22px
                              line_height: '1'
                              color: '#000000'
                              background_color: '#39ff6a'
                              padding: 2px 8px 1px
                              text_shadow: none
                              white_space: nowrap
                              box_shadow: '0 0 10px #39ff6a66'
                              letter_spacing: 1px
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              min_width: 12px
                              height: 3px
                              border_top: '1px solid #39ff6a'
                              border_bottom: '1px solid #39ff6a'
                              opacity: '0.55'
                          - type: text
                            text: INTERFACE 01
                            design:
                              font_size: 12px
                              color: '#25b04a'
                              letter_spacing: 1.5px
                              line_height: '1.2'
                              white_space: nowrap
                      - type: horizontal
                        gap: 10px
                        align: end
                        justify: space-between
                        design:
                          padding: 4px 0 6px
                          border_bottom: '1px solid #0c3a1a'
                        modules:
                          - type: vertical
                            gap: 0px
                            design: {}
                            modules:
                              - type: text
                                use_template: true
                                text: '{{ now().strftime(''%H:%M'') }}'
                                design:
                                  font_family: VT323, 'Source Code Pro', monospace
                                  font_size: 76px
                                  line_height: '1'
                                  color: '#9dffb8'
                                  letter_spacing: 2px
                                  text_shadow: 0 0 10px rgba(57,255,106,0.8), 0 0 24px rgba(57,255,106,0.35)
                              - type: text
                                use_template: true
                                text: '{{ now().strftime(''%a %d %b %Y'') }}'
                                design:
                                  font_size: 13px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  margin_top: 2px
                          - type: vertical
                            gap: 3px
                            align: end
                            design:
                              min_width: 0px
                            modules:
                              - type: text
                                text: Home systems
                                design:
                                  font_size: 12px
                                  color: '#1d7a37'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  text_align: right
                              - type: text
                                text: Home base
                                design:
                                  font_family: VT323, 'Source Code Pro', monospace
                                  font_size: 26px
                                  line_height: '1'
                                  text_align: right
                                  letter_spacing: 1px
                              - type: text
                                text: Unit 0001
                                design:
                                  font_size: 12px
                                  color: '#1d7a37'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  text_align: right
                      - type: vertical
                        gap: 5px
                        design:
                          animations:
                            - preset: custom:mt-flicker
                        modules:
                          - type: text
                            use_template: true
                            text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, crew.'
                            design:
                              color: '#9dffb8'
                              font_size: 16px
                              margin_bottom: 4px
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Crew aboard'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ states.person | selectattr(''state'', ''eq'', ''home'') | list | count }} / {{ states.person | list | count }}'
                                design:
                                  white_space: nowrap
                                  text_align: right
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Hull integrity'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ ''SEALED'' if is_state(''lock.front_door'', ''locked'') else ''UNSEALED'' }}'
                                design:
                                  white_space: nowrap
                                  text_align: right
                                  conditional:
                                    - id: warn
                                      name: Warning
                                      conditions:
                                        - type: state
                                          entity: lock.front_door
                                          state_not: locked
                                      design:
                                        color: '#ffb000'
                                        text_shadow: 0 0 6px rgba(255,176,0,0.6)
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Alarm status'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ states(''alarm_control_panel.home'') | replace(''_'', '' '') }}'
                                design:
                                  white_space: nowrap
                                  text_align: right
                                  conditional:
                                    - id: 'off'
                                      name: Disarmed
                                      conditions:
                                        - type: state
                                          entity: alarm_control_panel.home
                                          state: disarmed
                                      design:
                                        color: '#ffb000'
                                        text_shadow: 0 0 6px rgba(255,176,0,0.6)
                                    - id: trig
                                      name: Triggered
                                      conditions:
                                        - type: state
                                          entity: alarm_control_panel.home
                                          state: triggered
                                      design:
                                        color: '#ff3b2f'
                                        text_shadow: 0 0 8px rgba(255,59,47,0.75)
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Atmosphere'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ states(''sensor.indoor_temperature'') }}°C · {{ states(''sensor.indoor_humidity'') }}% RH'
                                design:
                                  white_space: nowrap
                                  text_align: right
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Motion contacts'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ [''binary_sensor.hall_motion'', ''binary_sensor.patio_motion''] | select(''is_state'', ''on'') | list | count }}'
                                design:
                                  white_space: nowrap
                                  text_align: right
                                  conditional:
                                    - id: warn
                                      name: Warning
                                      conditions:
                                        - type: state
                                          entity: binary_sensor.hall_motion
                                          state: 'on'
                                      design:
                                        color: '#ffb000'
                                        text_shadow: 0 0 6px rgba(255,176,0,0.6)
                          - type: horizontal
                            gap: 6px
                            align: center
                            design: {}
                            modules:
                              - type: text
                                text: '> Power balance'
                                design:
                                  white_space: nowrap
                                  color: '#25b04a'
                              - type: separator
                                separator_style: none
                                design:
                                  flex: '1'
                                  min_width: 10px
                                  height: 0px
                                  border_bottom: '2px dotted #0c3a1a'
                                  margin_top: 6px
                              - type: text
                                use_template: true
                                text: '{{ ''SURPLUS'' if states(''sensor.grid_power'') | float(0) < 0 else ''DRAWING'' }} {{ states(''sensor.grid_power'') | float(0) | abs | int }} W'
                                design:
                                  white_space: nowrap
                                  text_align: right
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              margin_top: 4px
                            modules:
                              - type: text
                                text: '> Awaiting input'
                                design:
                                  color: '#9dffb8'
                                  white_space: nowrap
                              - type: separator
                                separator_style: none
                                design:
                                  width: 10px
                                  height: 17px
                                  background_color: '#39ff6a'
                                  box_shadow: '0 0 8px #39ff6a'
                                  animations:
                                    - preset: custom:mt-cursor
                      - type: horizontal
                        gap: 6px
                        align: center
                        design:
                          padding_top: 8px
                          border_top: '1px solid #0c3a1a'
                        modules:
                          - type: text
                            text: Programs
                            design:
                              font_size: 11px
                              color: '#25b04a'
                              letter_spacing: 1.5px
                              line_height: '1.2'
                              white_space: nowrap
                          - type: horizontal
                            gap: 8px
                            align: center
                            justify: center
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 6px 4px
                              border: '1px solid #1d7a37'
                              box_sizing: border-box
                              cursor: pointer
                              hover:
                                background_color: '#39ff6a'
                                color: '#000000'
                                text_shadow: none
                            modules:
                              - type: text
                                text: Relax
                                design:
                                  font_size: 13px
                                  white_space: nowrap
                            actions:
                              tap_action:
                                action: perform-action
                                service: scene.turn_on
                                data:
                                  entity_id: scene.relax
                          - type: horizontal
                            gap: 8px
                            align: center
                            justify: center
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 6px 4px
                              border: '1px solid #1d7a37'
                              box_sizing: border-box
                              cursor: pointer
                              hover:
                                background_color: '#39ff6a'
                                color: '#000000'
                                text_shadow: none
                            modules:
                              - type: text
                                text: Movie
                                design:
                                  font_size: 13px
                                  white_space: nowrap
                            actions:
                              tap_action:
                                action: perform-action
                                service: scene.turn_on
                                data:
                                  entity_id: scene.movie
                          - type: horizontal
                            gap: 8px
                            align: center
                            justify: center
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 6px 4px
                              border: '1px solid #1d7a37'
                              box_sizing: border-box
                              cursor: pointer
                              hover:
                                background_color: '#39ff6a'
                                color: '#000000'
                                text_shadow: none
                            modules:
                              - type: text
                                text: Dinner
                                design:
                                  font_size: 13px
                                  white_space: nowrap
                            actions:
                              tap_action:
                                action: perform-action
                                service: scene.turn_on
                                data:
                                  entity_id: scene.dinner
                          - type: horizontal
                            gap: 8px
                            align: center
                            justify: center
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 6px 4px
                              border: '1px solid #1d7a37'
                              box_sizing: border-box
                              cursor: pointer
                              hover:
                                background_color: '#39ff6a'
                                color: '#000000'
                                text_shadow: none
                            modules:
                              - type: text
                                text: Focus
                                design:
                                  font_size: 13px
                                  white_space: nowrap
                            actions:
                              tap_action:
                                action: perform-action
                                service: scene.turn_on
                                data:
                                  entity_id: scene.focus
          - type: custom:magic-card
            name: Exterior scan
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.32) 0px, rgba(0,0,0,0.32) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse at 50% 35%, #06240f 0%, #021007 60%, #000000 100%)'
            border_radius: 6px
            padding: 14px 16px 16px
            box_shadow: inset 0 0 0 1px rgba(57,255,106,0.30), inset 0 0 32px rgba(57,255,106,0.10), 0 0 22px rgba(57,255,106,0.07)
            css: 'font-family: ''Share Tech Mono'', ''Source Code Pro'', monospace; font-size: 15px; color: #39ff6a; text-transform: uppercase; text-shadow: 0 0 6px rgba(57,255,106,0.55); letter-spacing: 0.5px;'
            grid_options:
              columns: 12
              rows: auto
            rows:
              - id: main
                columns:
                  - id: stack
                    gap: 10px
                    modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: Exterior scan
                            design:
                              font_family: VT323, 'Source Code Pro', monospace
                              font_size: 22px
                              line_height: '1'
                              color: '#000000'
                              background_color: '#39ff6a'
                              padding: 2px 8px 1px
                              text_shadow: none
                              white_space: nowrap
                              box_shadow: '0 0 10px #39ff6a66'
                              letter_spacing: 1px
                          - type: separator
                            separator_style: none
                            design:
                              flex: '1'
                              min_width: 12px
                              height: 3px
                              border_top: '1px solid #39ff6a'
                              border_bottom: '1px solid #39ff6a'
                              opacity: '0.55'
                          - type: text
                            text: Outside · Surface
                            design:
                              font_size: 12px
                              color: '#25b04a'
                              letter_spacing: 1.5px
                              line_height: '1.2'
                              white_space: nowrap
                      - type: horizontal
                        gap: 12px
                        align: center
                        design: {}
                        modules:
                          - type: icon
                            entity: weather.home
                            use_entity_icon: true
                            size: 52px
                            design:
                              color: '#9dffb8'
                              filter: 'drop-shadow(0 0 6px #39ff6a)'
                              display: flex
                              align_items: center
                              justify_content: center
                              width: 56px
                              height: 56px
                              border: '1px solid #1d7a37'
                          - type: vertical
                            gap: 4px
                            design:
                              flex: '1'
                              min_width: 0px
                            modules:
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  font_family: VT323, 'Source Code Pro', monospace
                                  font_size: 26px
                                  line_height: '1'
                                  white_space: nowrap
                                  overflow: hidden
                                  text_overflow: ellipsis
                              - type: text
                                text: Air breathable
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                                  white_space: nowrap
                          - type: text
                            use_entity: true
                            entity: sensor.outdoor_temperature
                            design:
                              font_family: VT323, 'Source Code Pro', monospace
                              font_size: 46px
                              line_height: '1'
                              color: '#9dffb8'
                              white_space: nowrap
                              text_shadow: 0 0 10px rgba(57,255,106,0.8)
                      - type: horizontal
                        gap: 6px
                        align: stretch
                        design: {}
                        modules:
                          - type: vertical
                            gap: 2px
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 5px 8px
                              border: '1px solid #0c3a1a'
                              box_sizing: border-box
                            modules:
                              - type: text
                                text: Humidity
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  white_space: nowrap
                                  color: '#9dffb8'
                                attribute: humidity
                          - type: vertical
                            gap: 2px
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 5px 8px
                              border: '1px solid #0c3a1a'
                              box_sizing: border-box
                            modules:
                              - type: text
                                text: Wind
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                              - type: text
                                use_entity: true
                                entity: weather.home
                                design:
                                  white_space: nowrap
                                  color: '#9dffb8'
                                attribute: wind_speed
                          - type: vertical
                            gap: 2px
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 5px 8px
                              border: '1px solid #0c3a1a'
                              box_sizing: border-box
                            modules:
                              - type: text
                                text: Gusts
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                              - type: text
                                use_entity: true
                                entity: sensor.wind_gust
                                design:
                                  white_space: nowrap
                                  conditional:
                                    - id: warn
                                      name: Warning
                                      conditions:
                                        - type: state
                                          entity: sensor.wind_gust
                                          above: 50
                                      design:
                                        color: '#ffb000'
                                        text_shadow: 0 0 6px rgba(255,176,0,0.6)
                                  color: '#9dffb8'
                      - type: horizontal
                        gap: 6px
                        align: stretch
                        design: {}
                        modules:
                          - type: vertical
                            gap: 2px
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 5px 8px
                              border: '1px solid #0c3a1a'
                              box_sizing: border-box
                            modules:
                              - type: text
                                text: Precip.
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                              - type: text
                                use_entity: true
                                entity: sensor.rain_today
                                design:
                                  white_space: nowrap
                                  color: '#9dffb8'
                          - type: vertical
                            gap: 2px
                            design:
                              flex: '1'
                              min_width: 0px
                              padding: 5px 8px
                              border: '1px solid #0c3a1a'
                              box_sizing: border-box
                            modules:
                              - type: text
                                text: Sunrise
                                design:
                                  font_size: 11px
                                  color: '#25b04a'
                                  letter_spacing: 1.5px
                                  line_height: '1.2'
                              - type: text
                                use_entity: true
                                entity: sensor.sunrise
                                design:
                                  white_space: nowrap
                                  color: '#9dffb8'
