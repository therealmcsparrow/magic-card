# Moonlit Valley: a moonlit valley dashboard, built only from Magic Cards.
# Edit the generator, not this file.
title: Moonlit Valley
views:
  - type: sections
    max_columns: 4
    path: valley
    title: The Valley
    icon: mdi:leaf
    theme: Moonlit Valley
    background: 'radial-gradient(ellipse 70% 45% at 75% -5%, rgba(215,231,239,0.16), transparent 65%), radial-gradient(ellipse 55% 40% at 8% 105%, rgba(217,180,90,0.10), transparent 60%), radial-gradient(ellipse 60% 50% at 40% 60%, rgba(95,138,114,0.10), transparent 70%), linear-gradient(180deg, #10201a 0%, #0b1511 60%, #08100d 100%)'
