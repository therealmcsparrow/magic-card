# Green Terminal: green phosphor on dark glass, amber only as an accent. Built from the OLED Green preset.
Green Terminal:
  modes:
    dark:
      primary-color: "#3cff7d"
      accent-color: "#ffb642"
      dark-primary-color: "#1d9149"
      light-primary-color: "#b8ffd2"
      text-primary-color: "#021008"
      primary-background-color: "#020805"
      secondary-background-color: "#06140c"
      card-background-color: "#041009"
      ha-card-background: "#041009"
      primary-text-color: "#3cff7d"
      secondary-text-color: "#2bc862"
      disabled-text-color: "#1d6b3b"
      divider-color: "rgba(60, 255, 125, 0.22)"
      lovelace-background: "repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.35) 0 1px, transparent 1px 3px), radial-gradient(ellipse 80% 60% at 50% 0%, rgba(60, 255, 125, 0.10), transparent 70%), radial-gradient(ellipse 70% 60% at 100% 100%, rgba(255, 182, 66, 0.05), transparent 70%), linear-gradient(180deg, #04120a 0%, #010402 100%)"
      ha-card-border-radius: "10px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(60, 255, 125, 0.25)"
      ha-card-box-shadow: "0 0 16px rgba(60, 255, 125, 0.07), 0 14px 30px rgba(0, 0, 0, 0.65)"
      ha-card-header-color: "#3cff7d"
      state-icon-color: "#2bc862"
      state-active-color: "#3cff7d"
      state-on-color: "#3cff7d"
      state-off-color: "#1d6b3b"
      paper-item-icon-color: "#2bc862"
      paper-item-icon-active-color: "#3cff7d"
      success-color: "#3cff7d"
      warning-color: "#ffb642"
      error-color: "#ff6a3d"
      info-color: "#b8ffd2"
      state-lock-locked-color: "#3cff7d"
      state-lock-unlocked-color: "#ffb642"
      state-alarm_control_panel-armed_home-color: "#3cff7d"
      state-alarm_control_panel-triggered-color: "#ff6a3d"
      state-person-home-color: "#3cff7d"
      state-light-on-color: "#3cff7d"
      state-climate-heat-color: "#ffb642"
      state-climate-cool-color: "#b8ffd2"
      app-header-background-color: "#020805"
      app-header-text-color: "#3cff7d"
      sidebar-background-color: "#020805"
      sidebar-text-color: "#2bc862"
      sidebar-selected-text-color: "#3cff7d"
      sidebar-selected-icon-color: "#3cff7d"
      sidebar-icon-color: "#1d9149"
      switch-checked-color: "#3cff7d"
      switch-checked-button-color: "#3cff7d"
      switch-checked-track-color: "#1d9149"
      input-fill-color: "#06140c"
      mdc-theme-primary: "#3cff7d"
      code-editor-background-color: "#020805"
      markdown-code-background-color: "#06140c"
      primary-font-family: "'Share Tech Mono', Inconsolata, 'Fira Code', monospace"
