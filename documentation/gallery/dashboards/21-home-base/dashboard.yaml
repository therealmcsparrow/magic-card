            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Power cell
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0px, rgba(0,0,0,0.30) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse 120% 80% at 50% 35%, rgba(60,255,125,0.075), transparent 70%), linear-gradient(180deg, #06150c 0%, #030a06 100%)'
            border_radius: 10px
            padding: 14px 16px 16px
            box_shadow: inset 0 0 0 1px rgba(60,255,125,0.30), inset 0 0 36px rgba(0,0,0,0.75), 0 0 16px rgba(60,255,125,0.07), 0 14px 30px rgba(0,0,0,0.65)
            css: 'font-family: ''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace; color: #3cff7d;'
            custom_animations:
              - id: core-glow
                name: Core glow
                kind: keyframes
                duration: 2.6
                iterations: infinite
                target: element
                easing: ease-in-out
                keyframes:
                  - {at: 0, filter: 'drop-shadow(0 0 4px rgba(60,255,125,0.45)) brightness(0.95)'}
                  - {at: 50, filter: 'drop-shadow(0 0 14px rgba(60,255,125,0.85)) brightness(1.15)'}
                  - {at: 100, filter: 'drop-shadow(0 0 4px rgba(60,255,125,0.45)) brightness(0.95)'}
            rows:
              - id: head
                columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: Power cell
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 26px
                              color: '#3cff7d'
                              line_height: '1'
                              text_transform: uppercase
                              letter_spacing: 1px
                              text_shadow: 0 0 6px rgba(60,255,125,0.55)
                              white_space: nowrap
                          - type: separator
                            separator_style: none
                            design: {height: 1px, margin: '0', background_color: '#1d9149', box_shadow: '0 0 4px rgba(60,255,125,0.4)', flex: '1', margin_top: 4px}
                          - type: text
                            text: Energy
                            design:
                              font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                              font_size: 12px
                              letter_spacing: 1px
                              text_transform: uppercase
                              color: '#1d9149'
                              white_space: nowrap
                              margin_top: 4px
              - id: body
                column_widths: [84px, 1fr]
                gap: 14px
                columns:
                  - vertical_align: center
                    modules:
                      - type: vertical
                        gap: 0px
                        align: center
                        design: {cursor: pointer}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 50px
                              height: 10px
                              margin: '0'
                              border_radius: 3px 3px 0 0
                              background: 'repeating-linear-gradient(90deg, #2b3b30 0 4px, #1a241e 4px 7px)'
                              border: '1px solid #1d9149'
                          - type: separator
                            separator_style: none
                            design: {width: 62px, height: 7px, margin: '0', border_radius: 2px, background: 'linear-gradient(180deg, #3a4a3f, #18221b)', border: '1px solid #1d9149'}
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              width: 52px
                              height: 128px
                              overflow: hidden
                              border_radius: 4px
                              border: '1.5px solid #3cff7d'
                              background_color: '#06180e'
                              value_background: {type: fill, entity: sensor.home_battery, min: 0, max: 100, direction: up, color: '#3cff7d', opacity: 85%, wave: true}
                              animations: [{id: core-glow, preset: custom:core-glow}]
                              conditional:
                                - id: low
                                  name: Low
                                  conditions: [{type: state, entity: sensor.home_battery, below: 20}]
                                  design: {value_background: {type: fill, entity: sensor.home_battery, min: 0, max: 100, direction: up, color: '#ffb642', opacity: 85%, wave: true}}
                            modules:
                              - type: separator
