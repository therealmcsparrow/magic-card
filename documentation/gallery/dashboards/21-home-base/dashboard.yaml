                                  height: auto
                                  background: linear-gradient(90deg, rgba(255,255,255,0.0), rgba(255,255,255,0.22) 25%, rgba(255,255,255,0.0) 45%), repeating-linear-gradient(0deg, transparent 0 13px, rgba(2,16,8,0.75) 13px 15px)
                              - type: text
                                use_template: true
