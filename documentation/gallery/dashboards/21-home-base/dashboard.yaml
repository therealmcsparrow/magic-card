# Home Base dashboard (theme "Green Terminal"). edit the generator, not this file.
title: Home Base
views:
  - type: sections
    max_columns: 4
    path: home
    title: Terminal
    icon: mdi:cog-outline
    theme: Green Terminal
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0px, rgba(0,0,0,0.30) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse 80% 70% at 30% 20%, rgba(60,255,125,0.13), transparent 65%), radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%), linear-gradient(180deg, #071a0e 0%, #030a06 100%)'
            border_radius: 10px
            padding: 16px 16px 14px
            box_shadow: inset 0 0 0 1px rgba(60,255,125,0.30), inset 0 0 36px rgba(0,0,0,0.75), 0 0 16px rgba(60,255,125,0.07), 0 14px 30px rgba(0,0,0,0.65)
            css: 'font-family: ''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace; color: #3cff7d;'
            custom_animations:
              - id: cursor-blink
                name: Cursor blink
                kind: keyframes
                duration: 1.1
                iterations: infinite
                target: element
                easing: steps(1, end)
                keyframes: [{at: 0, opacity: 1}, {at: 50, opacity: 0}, {at: 100, opacity: 1}]
              - id: phosphor-flicker
                name: Phosphor flicker
                kind: keyframes
                duration: 6
                iterations: infinite
                target: element
                easing: linear
                keyframes:
                  - {at: 0, opacity: 1}
                  - {at: 41, opacity: 1}
                  - {at: 42, opacity: 0.82}
                  - {at: 43, opacity: 1}
                  - {at: 77, opacity: 1}
                  - {at: 78, opacity: 0.88}
                  - {at: 79.5, opacity: 0.97}
                  - {at: 81, opacity: 1}
                  - {at: 100, opacity: 1}
            animations: [{id: scan, preset: scanline, color: '#3cff7d', intensity: 35, duration: 4.5s}, {id: phosphor-flicker, preset: custom:phosphor-flicker}]
            rows:
              - id: top
                column_widths: [1fr, auto]
                gap: 10px
                columns:
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Home Systems · Wrist terminal
                        design:
                          font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                          font_size: 11px
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#1d9149'
                          white_space: nowrap
                      - type: text
                        text: Home Base
                        design:
                          font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                          font_size: clamp(44px, 12vw, 58px)
                          white_space: nowrap
                          color: '#3cff7d'
                          line_height: '0.95'
                          letter_spacing: 2px
                          text_transform: uppercase
                          text_shadow: 0 0 10px rgba(60,255,125,0.6), 0 0 22px rgba(60,255,125,0.25)
                          margin_top: 2px
                      - type: horizontal
                        gap: 4px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            use_template: true
                            text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, Commander'
                            design: {font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace', font_size: 14px, color: '#b8ffd2'}
                          - type: separator
                            separator_style: none
                            design: {width: 9px, height: 15px, margin: '0', background_color: '#3cff7d', animations: [{id: cursor-blink, preset: custom:cursor-blink}]}
                  - gap: 0px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                          font_size: clamp(46px, 12vw, 60px)
                          color: '#3cff7d'
                          line_height: '0.9'
                          text_align: right
                          text_shadow: 0 0 10px rgba(60,255,125,0.6), 0 0 22px rgba(60,255,125,0.25)
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                          font_size: 12px
                          color: '#2bc862'
                          text_align: right
                          margin_top: 4px
                          white_space: nowrap
                          text_transform: uppercase
                          letter_spacing: 1px
              - id: tabs
                padding: 4px 0 0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 0px
                        align: end
                        justify: space-between
                        design: {border_bottom: '1px solid #3cff7d', box_shadow: '0 1px 0 rgba(60,255,125,0.25)'}
                        modules:
                          - type: text
                            text: STATUS
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 21px
                              line_height: '1'
                              letter_spacing: 1px
                              padding: 3px 8px 2px
                              white_space: nowrap
                              color: '#3cff7d'
                              text_shadow: 0 0 6px rgba(60,255,125,0.55)
                              border: '1px solid #3cff7d'
                              border_bottom: '1px solid #041009'
                              margin_bottom: -1px
                              background_color: rgba(60,255,125,0.08)
                              box_shadow: 0 0 8px rgba(60,255,125,0.25)
                          - type: text
                            text: SUPPLY
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 21px
                              line_height: '1'
                              letter_spacing: 1px
                              padding: 3px 8px 2px
                              white_space: nowrap
                              color: '#1d9149'
                              text_shadow: none
                              border: 1px solid transparent
                          - type: text
                            text: LOG
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 21px
                              line_height: '1'
                              letter_spacing: 1px
                              padding: 3px 8px 2px
                              white_space: nowrap
                              color: '#1d9149'
                              text_shadow: none
                              border: 1px solid transparent
                          - type: text
                            text: MAP
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 21px
                              line_height: '1'
                              letter_spacing: 1px
                              padding: 3px 8px 2px
                              white_space: nowrap
                              color: '#1d9149'
                              text_shadow: none
                              border: 1px solid transparent
                          - type: text
                            text: MEDIA
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 21px
                              line_height: '1'
                              letter_spacing: 1px
                              padding: 3px 8px 2px
                              white_space: nowrap
                              color: '#1d9149'
                              text_shadow: none
                              border: 1px solid transparent
              - id: chips
                layout: 1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          border_radius: 6px
                          background_color: rgba(60,255,125,0.045)
                          border: 1px solid rgba(60,255,125,0.22)
                          box_sizing: border-box
                          padding: 7px 6px
                          justify_content: center
                          cursor: pointer
                        modules:
                          - type: icon
                            icon: mdi:shield-lock-outline
                            size: 17px
                            design: {color: '#3cff7d', display: flex, conditional: [{id: bad, name: Not ok, conditions: [{type: state, state_not: locked}], design: {color: '#ffb642'}}]}
                            entity: lock.front_door
                          - type: text
                            text: DOOR SEALED
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 18px, color: '#3cff7d', white_space: nowrap, line_height: '1'}
                            display: {conditions: [{type: state, entity: lock.front_door, state: locked}]}
                          - type: text
                            text: DOOR OPEN
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 18px, color: '#ffb642', white_space: nowrap, line_height: '1'}
                            display: {conditions: [{type: state, entity: lock.front_door, state_not: locked}]}
                        actions: {tap_action: {action: more-info, entity: lock.front_door}}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          border_radius: 6px
                          background_color: rgba(60,255,125,0.045)
                          border: 1px solid rgba(60,255,125,0.22)
                          box_sizing: border-box
                          padding: 7px 6px
                          justify_content: center
                        modules:
                          - {type: icon, icon: mdi:account-group-outline, size: 17px, design: {color: '#3cff7d', display: flex}}
                          - type: text
                            use_template: true
                            text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }}/3 AT HOME'
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 18px, color: '#3cff7d', white_space: nowrap, line_height: '1'}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          border_radius: 6px
                          background_color: rgba(60,255,125,0.045)
                          border: 1px solid rgba(60,255,125,0.22)
                          box_sizing: border-box
                          padding: 7px 6px
                          justify_content: center
                          cursor: pointer
                        modules:
                          - type: icon
                            icon: mdi:alarm-light-outline
                            size: 17px
                            design: {color: '#3cff7d', display: flex, conditional: [{id: bad, name: Not ok, conditions: [{type: state, state_not: armed_home}], design: {color: '#ffb642'}}]}
                            entity: alarm_control_panel.home
                          - type: text
                            text: ALARM ARMED
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 18px, color: '#3cff7d', white_space: nowrap, line_height: '1'}
                            display: {conditions: [{type: state, entity: alarm_control_panel.home, state: armed_home}]}
                          - type: text
                            text: ALARM OFF
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 18px, color: '#ffb642', white_space: nowrap, line_height: '1'}
                            display: {conditions: [{type: state, entity: alarm_control_panel.home, state_not: armed_home}]}
                        actions: {tap_action: {action: more-info, entity: alarm_control_panel.home}}
              - id: bar
                column_widths: [1fr, 1.5fr, 1fr]
                gap: 4px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 4px 8px, background_color: '#2bc862'}
                        modules:
                          - type: text
                            text: BAT
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 19px, color: '#021008', line_height: '1', white_space: nowrap}
                          - type: text
                            use_template: true
                            text: '{{ states(''sensor.home_battery'') }}/100'
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 19px, color: '#021008', line_height: '1', white_space: nowrap}
                        actions: {tap_action: {action: more-info, entity: sensor.home_battery}}
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {padding: 4px 8px, background_color: '#2bc862'}
                        modules:
                          - type: text
                            text: ENERGY
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 19px, color: '#021008', line_height: '1', white_space: nowrap}
                          - type: vertical
                            gap: 0px
                            design:
                              flex: '1'
                              height: 8px
                              border: '1px solid #021008'
                              value_background: {type: fill, entity: sensor.energy_today, min: 0, max: 30, direction: right, color: '#021008', opacity: 85%, wave: false}
                            modules: []
                        actions: {tap_action: {action: more-info, entity: sensor.energy_today}}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design: {padding: 4px 8px, background_color: '#2bc862'}
                        modules:
                          - type: text
                            text: PHONE
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 19px, color: '#021008', line_height: '1', white_space: nowrap}
                          - type: text
                            use_template: true
                            text: '{{ states(''sensor.phone_battery'') }}/100'
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 19px, color: '#021008', line_height: '1', white_space: nowrap}
                        actions: {tap_action: {action: more-info, entity: sensor.phone_battery}}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Home stats
            background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0px, rgba(0,0,0,0.30) 1px, transparent 1px, transparent 3px), radial-gradient(ellipse 120% 80% at 50% 35%, rgba(60,255,125,0.075), transparent 70%), linear-gradient(180deg, #06150c 0%, #030a06 100%)'
            border_radius: 10px
            padding: 14px 16px 16px
            box_shadow: inset 0 0 0 1px rgba(60,255,125,0.30), inset 0 0 36px rgba(0,0,0,0.75), 0 0 16px rgba(60,255,125,0.07), 0 14px 30px rgba(0,0,0,0.65)
            css: 'font-family: ''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace; color: #3cff7d;'
            rows:
              - id: head
                columns:
                  - modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {}
                        modules:
                          - type: text
                            text: Home stats
                            design:
                              font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                              font_size: 26px
                              color: '#3cff7d'
                              line_height: '1'
                              text_transform: uppercase
                              letter_spacing: 1px
                              text_shadow: 0 0 6px rgba(60,255,125,0.55)
                              white_space: nowrap
                          - type: separator
                            separator_style: none
                            design: {height: 1px, margin: '0', background_color: '#1d9149', box_shadow: '0 0 4px rgba(60,255,125,0.4)', flex: '1', margin_top: 4px}
                          - type: text
                            text: Status
                            design:
                              font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                              font_size: 12px
                              letter_spacing: 1px
                              text_transform: uppercase
                              color: '#1d9149'
                              white_space: nowrap
                              margin_top: 4px
              - id: body
                column_widths: [112px, 1fr]
                gap: 14px
                columns:
                  - vertical_align: stretch
                    modules:
                      - type: vertical
                        gap: 0px
                        align: center
                        design:
                          border_radius: 6px
                          background_color: rgba(60,255,125,0.045)
                          border: 1px solid rgba(60,255,125,0.22)
                          box_sizing: border-box
                          padding: 12px 6px 10px
                          height: 100%
                          justify_content: center
                        modules:
                          - type: image
                            image: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20170%22%20fill%3D%22none%22%20stroke%3D%22%233cff7d%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Cpath%20d%3D%22M37%20120%20L35%20156%20L27%20162%20L41%20162%20L44%20122%22%20fill%3D%22%23072414%22%2F%3E%20%3Cpath%20d%3D%22M63%20120%20L65%20156%20L73%20162%20L59%20162%20L56%20122%22%20fill%3D%22%23072414%22%2F%3E%20%3Cpath%20d%3D%22M33%2060%20Q50%2054%2067%2060%20L68%2098%20Q66%20118%2063%20122%20L37%20122%20Q34%20118%2032%2098%20Z%22%20fill%3D%22%23072414%22%2F%3E%20%3Cpath%20d%3D%22M50%2060%20L50%20118%22%20stroke-width%3D%225%22%20stroke%3D%22%231d9149%22%2F%3E%20%3Cpath%20d%3D%22M50%2060%20L50%20118%22%2F%3E%20%3Cpath%20d%3D%22M34%20100%20L66%20100%22%20stroke-width%3D%221.6%22%2F%3E%20%3Cpath%20d%3D%22M42%2058%20L50%2068%20L58%2058%22%20%2F%3E%20%3Cpath%20d%3D%22M33%2062%20Q24%2078%2026%20100%20L30%20104%22%20fill%3D%22%23072414%22%2F%3E%20%3Cpath%20d%3D%22M67%2062%20Q76%2078%2074%20100%20L70%20104%22%20fill%3D%22%23072414%22%2F%3E%20%3Ccircle%20cx%3D%2270%22%20cy%3D%22104%22%20r%3D%224%22%20fill%3D%22%23072414%22%2F%3E%20%3Ccircle%20cx%3D%2230%22%20cy%3D%22104%22%20r%3D%224%22%20fill%3D%22%23072414%22%2F%3E%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2232%22%20r%3D%2221%22%20fill%3D%22%23072414%22%2F%3E%20%3Ccircle%20cx%3D%2243%22%20cy%3D%2233%22%20r%3D%222.2%22%20fill%3D%22%233cff7d%22%20stroke%3D%22none%22%2F%3E%20%3Ccircle%20cx%3D%2258%22%20cy%3D%2233%22%20r%3D%222.2%22%20fill%3D%22%233cff7d%22%20stroke%3D%22none%22%2F%3E%20%3Cpath%20d%3D%22M41%2042%20Q50%2050%2060%2042%22%2F%3E%20%3Cpath%20d%3D%22M29%2034%20Q26%2036%2029%2040%20M71%2034%20Q74%2036%2071%2040%22%20stroke-width%3D%221.6%22%2F%3E%20%3Ccircle%20cx%3D%2259%22%20cy%3D%2280%22%20r%3D%224.5%22%20stroke-width%3D%221.5%22%2F%3E%20%3C%2Fsvg%3E
                            aspect_ratio: 100:170
                            fit: contain
                            design: {width: 96px, animations: [{id: float, preset: float, intensity: 3, duration: 3.4s}]}
                          - type: text
                            text: Resident
                            design:
                              font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                              font_size: 11px
                              letter_spacing: 1px
                              text_transform: uppercase
                              color: '#2bc862'
                              white_space: normal
                              text_align: center
                              margin_top: 8px
                              line_height: '1.2'
                          - type: text
                            text: ON DUTY
                            design: {font_family: 'VT323, ''Share Tech Mono'', Inconsolata, ''Courier New'', monospace', font_size: 20px, color: '#3cff7d', text_align: center, line_height: '1'}
                  - gap: 4px
                    vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {padding: 2px 0, cursor: pointer}
                        modules:
                          - {type: icon, icon: mdi:solar-power-variant-outline, size: 20px, design: {color: '#3cff7d', display: flex, width: 20px}}
                          - type: vertical
                            gap: 3px
                            design: {flex: '1', min_width: 0px}
                            modules:
                              - type: horizontal
                                gap: 6px
                                align: baseline
                                design: {}
                                modules:
                                  - type: text
                                    text: Solar
                                    design:
                                      font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                                      font_size: 12px
                                      letter_spacing: 1px
                                      text_transform: uppercase
                                      color: '#b8ffd2'
                                      white_space: nowrap
                                      flex: '1'
                                  - type: text
                                    use_entity: true
                                    entity: sensor.solar_power
                                    design:
                                      font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                                      font_size: 19px
                                      color: '#3cff7d'
                                      line_height: '1'
                                      text_shadow: none
                                      white_space: nowrap
                              - type: vertical
                                gap: 0px
                                design:
                                  position: relative
                                  height: 9px
                                  overflow: hidden
                                  background_color: rgba(60,255,125,0.10)
                                  value_background: {type: fill, entity: sensor.solar_power, min: 0, max: 5000, direction: right, color: '#3cff7d', opacity: 92%, wave: false}
                                modules:
                                  - type: separator
                                    separator_style: none
                                    design:
                                      position: absolute
                                      inset: '0'
                                      margin: '0'
                                      height: auto
                                      background: 'repeating-linear-gradient(90deg, transparent 0px, transparent calc(10% - 2px), #041009 calc(10% - 2px), #041009 10%)'
                        actions: {tap_action: {action: more-info, entity: sensor.solar_power}}
                      - type: horizontal
                        gap: 10px
                        align: center
                        design: {padding: 2px 0, cursor: pointer}
                        modules:
                          - {type: icon, icon: mdi:flash-outline, size: 20px, design: {color: '#3cff7d', display: flex, width: 20px}}
                          - type: vertical
                            gap: 3px
                            design: {flex: '1', min_width: 0px}
                            modules:
                              - type: horizontal
                                gap: 6px
                                align: baseline
                                design: {}
                                modules:
                                  - type: text
                                    text: Power draw
                                    design:
                                      font_family: '''Share Tech Mono'', Inconsolata, ''Fira Code'', ''Courier New'', monospace'
                                      font_size: 12px
                                      letter_spacing: 1px
                                      text_transform: uppercase
                                      color: '#b8ffd2'
                                      white_space: nowrap
                                      flex: '1'
                                  - type: text
                                    use_entity: true
                                    entity: sensor.house_power
                                    design:
                                      font_family: VT323, 'Share Tech Mono', Inconsolata, 'Courier New', monospace
                                      font_size: 19px
                                      color: '#3cff7d'
                                      line_height: '1'
                                      text_shadow: none
                                      white_space: nowrap
                              - type: vertical
                                gap: 0px
                                design:
                                  position: relative
                                  height: 9px
                                  overflow: hidden
                                  background_color: rgba(60,255,125,0.10)
                                  value_background: {type: fill, entity: sensor.house_power, min: 0, max: 3000, direction: right, color: '#3cff7d', opacity: 92%, wave: false}
                                  conditional:
                                    - id: warn
