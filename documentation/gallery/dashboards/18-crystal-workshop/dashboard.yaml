                                          font_size: 16px
                                          font_weight: '700'
                                          color: '#2a1d0c'
                                          margin_top: 2px
                                  - vertical_align: start
                                    modules:
                                      - type: icon
                                        icon: mdi:weather-partly-cloudy
                                        size: 54px
