                                linear-gradient(#1d2a24, #1d2a24) 19% calc(100% - 58px) / 2px 16px no-repeat, linear-gradient(#1d2a24,
                                #1d2a24) 38% calc(100% - 66px) / 2px 16px no-repeat, linear-gradient(#1d2a24, #1d2a24) 70% calc(100% - 60px)
                                / 2px 16px no-repeat, linear-gradient(#1d2a24, #1d2a24) 2% 100% / 22px 30px no-repeat,
