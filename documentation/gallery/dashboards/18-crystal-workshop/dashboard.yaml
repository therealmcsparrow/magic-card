                                / 26px 24px no-repeat, linear-gradient(#1d2a24, #1d2a24) 19% 100% / 10px 58px no-repeat,
                                linear-gradient(#1d2a24, #1d2a24) 24% 100% / 30px 34px no-repeat, linear-gradient(#1d2a24, #1d2a24) 32% 100%
                                / 16px 44px no-repeat, linear-gradient(#1d2a24, #1d2a24) 38% 100% / 8px 66px no-repeat,
                                linear-gradient(#1d2a24, #1d2a24) 44% 100% / 28px 28px no-repeat, linear-gradient(#1d2a24, #1d2a24) 52% 100%
                                / 18px 50px no-repeat, linear-gradient(#1d2a24, #1d2a24) 58% 100% / 12px 38px no-repeat,
                                linear-gradient(#1d2a24, #1d2a24) 64% 100% / 26px 26px no-repeat, linear-gradient(#1d2a24, #1d2a24) 70% 100%
                                / 10px 60px no-repeat, linear-gradient(#1d2a24, #1d2a24) 76% 100% / 24px 36px no-repeat,
                                linear-gradient(#1d2a24, #1d2a24) 83% 100% / 14px 48px no-repeat, linear-gradient(#1d2a24, #1d2a24) 89% 100%
                                / 30px 26px no-repeat, linear-gradient(#1d2a24, #1d2a24) 95% 100% / 12px 42px no-repeat,
                                linear-gradient(#1d2a24, #1d2a24) 99% 100% / 20px 30px no-repeat, radial-gradient(circle at 82% 30%,
                                rgba(255,250,225,0.95) 0 22px, rgba(255,236,170,0.45) 34px, transparent 90px), repeating-conic-gradient(from
