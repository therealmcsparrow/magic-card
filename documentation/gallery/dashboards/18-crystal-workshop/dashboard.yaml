                                        design:
                                          font_size: 11px
                                          font_weight: '700'
                                          letter_spacing: 2.5px
                                          text_transform: uppercase
                                          color: '#5a3a10'
                                      - type: text
                                        use_template: true
                                        text: '{{ state_attr(''weather.home'',''temperature'') }}°'
                                        design:
                                          font_family: '''Poiret One'', Raleway, sans-serif'
                                          font_size: 56px
