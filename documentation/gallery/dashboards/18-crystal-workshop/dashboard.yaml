# Crystal Workshop: a Sections dashboard made of Magic Cards. edit that and run it again.
title: Crystal Workshop
views:
  - title: Workshop
    path: workshop
    icon: mdi:hexagon-multiple
    type: sections
    max_columns: 4
    theme: Crystal Workshop
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Workshop header
            background: >-
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) left 8px top 8px / 24px 2px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) left 8px top 8px / 2px 24px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) right 8px top 8px / 24px 2px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) right 8px top 8px / 2px 24px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) left 8px bottom 8px / 24px 2px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) left 8px bottom 8px / 2px 24px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) right 8px bottom 8px / 24px 2px no-repeat,
              linear-gradient(rgba(224,179,84,0.8),rgba(224,179,84,0.8)) right 8px bottom 8px / 2px 24px no-repeat,
              repeating-conic-gradient(from 180deg at 50% -10%, rgba(224,179,84,0.07) 0deg 3deg, transparent 3deg 9deg),
              radial-gradient(ellipse 60% 70% at 50% -10%, rgba(246,220,150,0.20), transparent 70%), radial-gradient(ellipse 60% 60% at 0%
              100%, rgba(79,227,216,0.12), transparent 70%), linear-gradient(170deg, #193843 0%, #10232b 60%, #0b171c 100%)
            border_radius: 6px
            padding: 22px 22px 20px
            box_shadow: >-
              inset 0 0 0 1px rgba(224,179,84,0.45), inset 0 0 0 4px rgba(11,21,25,0.9), inset 0 0 0 5px rgba(224,179,84,0.18), 0 14px 34px
              rgba(0,0,0,0.55)
            overflow: hidden
            css: 'font-family: ''Josefin Sans'', Raleway, sans-serif; color: #efe6d2;'
            rows:
              - id: hero
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          position: relative
                        modules:
                          - type: icon
                            icon: mdi:cog
                            size: 150px
                            design:
                              position: absolute
                              right: -52px
                              top: -58px
                              color: '#e0b354'
                              opacity: '0.16'
                              pointer_events: none
                              animations:
                                - id: turn
                                  preset: spin
                                  target: icon
                                  duration: 36s
                                  easing: linear
                          - type: icon
                            icon: mdi:cog
                            size: 92px
                            design:
                              position: absolute
                              right: 74px
                              top: -38px
                              color: '#4fe3d8'
                              opacity: '0.13'
                              pointer_events: none
                              animations:
                                - id: turn
                                  preset: spin
                                  target: icon
                                  duration: 22s
                                  easing: linear
                                  direction: reverse
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              z_index: '1'
                            modules:
                              - type: text
                                text: Upper city · Inventors’ row
                                design:
                                  font_family: '''Josefin Sans'', Raleway, sans-serif'
                                  font_size: 11px
                                  font_weight: '600'
                                  letter_spacing: 2.5px
                                  text_transform: uppercase
                                  color: '#4fe3d8'
                              - type: text
                                text: The Crystal Workshop
                                design:
                                  font_family: Cinzel, 'Playfair Display', serif
                                  font_size: 25px
                                  font_weight: '700'
                                  color: '#e0b354'
                                  letter_spacing: 0.5px
                                  line_height: '1.15'
                                  margin_top: 6px
                                  text_shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 18px rgba(224,179,84,0.35)
                                  white_space: nowrap
                              - type: separator
                                separator_style: none
                                design:
                                  height: 2px
                                  width: 100%
                                  margin: 10px 0 8px
                                  background: 'linear-gradient(90deg, #e0b354, rgba(224,179,84,0.15) 70%, transparent)'
                              - type: row
                                gap: 10px
                                column_widths:
                                  - 1fr
                                  - auto
                                columns:
                                  - vertical_align: center
                                    modules:
                                      - type: text
                                        use_template: true
                                        text: >-
                                          {{ 'Good morning' if now().hour < 12 else 'Good afternoon' if now().hour < 18 else 'Good evening'
                                          }}, inventors
                                        design:
                                          font_size: 15px
                                          color: '#efe6d2'
                                          font_weight: '600'
                                      - type: text
                                        use_template: true
                                        text: '{{ now().strftime(''%A %-d %B'') }}'
                                        design:
                                          font_size: 12px
                                          color: '#9fb0ad'
                                          letter_spacing: 1px
                                          text_transform: uppercase
                                          margin_top: 3px
                                      - type: text
                                        text: the lab never sleeps
                                        design:
                                          font_family: Caveat, 'Dancing Script', cursive
                                          font_size: 17px
                                          line_height: '1.1'
                                          color: '#f6dc96'
                                          margin_top: 4px
                                  - vertical_align: center
                                    modules:
                                      - type: text
                                        use_template: true
                                        text: '{{ now().strftime(''%H:%M'') }}'
                                        design:
                                          font_family: '''Poiret One'', Raleway, sans-serif'
                                          font_size: 50px
                                          line_height: '1'
                                          color: '#f6dc96'
                                          text_align: right
                                          letter_spacing: 1px
                                          text_shadow: 0 0 16px rgba(246,220,150,0.35)
                              - type: row
                                gap: 6px
                                design:
                                  margin_top: 12px
                                columns:
                                  - modules:
                                      - type: horizontal
                                        gap: 6px
                                        align: center
                                        justify: center
                                        design:
                                          padding: 7px 10px
                                          border_radius: 3px
                                          background_color: rgba(11,21,25,0.55)
                                          border: 1px solid rgba(224,179,84,0.35)
                                          min_width: '0'
                                          justify_content: center
                                        modules:
                                          - type: icon
                                            icon: mdi:shield-home
                                            size: 16px
                                            design:
                                              color: '#4fe3d8'
                                          - type: text
                                            use_entity: true
                                            entity: alarm_control_panel.home
                                            design:
                                              font_size: 12px
                                              font_weight: '600'
                                              letter_spacing: 0.5px
                                              white_space: nowrap
                                              color: '#efe6d2'
                                  - modules:
                                      - type: horizontal
                                        gap: 6px
                                        align: center
                                        justify: center
                                        design:
                                          padding: 7px 10px
                                          border_radius: 3px
                                          background_color: rgba(11,21,25,0.55)
                                          border: 1px solid rgba(224,179,84,0.35)
                                          min_width: '0'
                                          justify_content: center
                                        modules:
                                          - type: icon
                                            icon: mdi:account-group
                                            size: 16px
                                            design:
                                              color: '#4fe3d8'
                                          - type: text
                                            use_template: true
                                            text: >-
                                              {{ states.person | selectattr('state','eq','home') | list | count }} of {{ states.person |
                                              list | count }} home
                                            design:
                                              font_size: 12px
                                              font_weight: '600'
                                              letter_spacing: 0.5px
                                              white_space: nowrap
                                              color: '#efe6d2'
                                  - modules:
                                      - type: horizontal
                                        gap: 6px
                                        align: center
                                        justify: center
                                        design:
                                          padding: 7px 10px
                                          border_radius: 3px
                                          background_color: rgba(11,21,25,0.55)
                                          border: 1px solid rgba(224,179,84,0.35)
                                          min_width: '0'
                                          justify_content: center
                                        modules:
                                          - type: icon
                                            icon: mdi:flash
                                            size: 16px
                                            design:
                                              color: '#e0b354'
                                          - type: text
                                            use_entity: true
                                            entity: sensor.solar_power
                                            design:
                                              font_size: 12px
                                              font_weight: '600'
                                              letter_spacing: 0.5px
                                              white_space: nowrap
                                              color: '#efe6d2'
            grid_options:
              columns: full
              rows: auto
          - type: custom:magic-card
            name: Weather · above and below
            background: '#0b171c'
            border_radius: 6px
            padding: 0px
            box_shadow: inset 0 0 0 1px rgba(224,179,84,0.5), 0 14px 34px rgba(0,0,0,0.55)
            overflow: hidden
