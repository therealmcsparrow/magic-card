                                at 20% 20%, rgba(255,255,255,0.35), transparent 70%), linear-gradient(180deg, #f3dfa6 0%, #e7bd70 55%,
                                #c98f45 100%)
                              padding: 18px 20px 76px
                              position: relative
                            modules:
                              - type: row
