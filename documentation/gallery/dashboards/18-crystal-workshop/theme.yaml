# Crystal Workshop: gold-and-teal deco above, green-purple smog below.
# Put this file in /config/themes/ and reload themes.
Crystal Workshop:
  modes:
    dark:
      primary-color: "#e0b354"
      accent-color: "#4fe3d8"
      primary-background-color: "#0b1519"
      secondary-background-color: "#132730"
      card-background-color: "#11222a"
      ha-card-background: "#11222a"
      primary-text-color: "#efe6d2"
      secondary-text-color: "#9fb0ad"
      disabled-text-color: "#56666b"
      text-primary-color: "#0b1519"
      divider-color: "rgba(224, 179, 84, 0.22)"
      lovelace-background: "radial-gradient(ellipse 70% 45% at 50% -5%, rgba(224, 179, 84, 0.18), transparent 70%), radial-gradient(ellipse 60% 40% at 15% 105%, rgba(139, 227, 107, 0.10), transparent 70%), radial-gradient(ellipse 60% 40% at 90% 105%, rgba(196, 92, 255, 0.12), transparent 70%), linear-gradient(180deg, #102830 0%, #0b1519 55%, #0d0f16 100%)"
      ha-card-border-radius: "6px"
      ha-card-border-width: "0px"
      ha-card-border-color: "rgba(224, 179, 84, 0.45)"
      ha-card-box-shadow: "0 14px 34px rgba(0, 0, 0, 0.55)"
      state-icon-color: "#4fe3d8"
      state-active-color: "#e0b354"
      paper-item-icon-color: "#4fe3d8"
      paper-item-icon-active-color: "#e0b354"
      sidebar-background-color: "#0b1519"
      sidebar-text-color: "#efe6d2"
      sidebar-icon-color: "#9fb0ad"
      sidebar-selected-icon-color: "#e0b354"
      sidebar-selected-text-color: "#e0b354"
      app-header-background-color: "#0b1519"
      app-header-text-color: "#e0b354"
      app-header-border-bottom: "1px solid rgba(224, 179, 84, 0.35)"
      success-color: "#8be36b"
      warning-color: "#ffb347"
      error-color: "#c45cff"
      info-color: "#6fd3ff"
      state-on-color: "#e0b354"
      state-off-color: "#56666b"
      state-unavailable-color: "#56666b"
      state-alarm_control_panel-triggered-color: "#c45cff"
      state-alarm_control_panel-armed_home-color: "#4fe3d8"
      state-alarm_control_panel-armed_away-color: "#4fe3d8"
      state-lock-locked-color: "#4fe3d8"
      state-lock-unlocked-color: "#ffb347"
      state-climate-heat-color: "#ffb347"
      state-climate-cool-color: "#6fd3ff"
      state-light-on-color: "#e0b354"
      switch-checked-color: "#e0b354"
      switch-checked-button-color: "#f6dc96"
      switch-checked-track-color: "#9c6f28"
      mdc-theme-primary: "#e0b354"
      mdc-theme-secondary: "#4fe3d8"
      code-editor-background-color: "#0b1519"
