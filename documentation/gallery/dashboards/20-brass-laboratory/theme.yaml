# Brass Laboratory: mahogany, green leather and brass by gaslight.
# Copy into /config/themes/ (with `frontend: themes: !include_dir_merge_named themes` in configuration.yaml).
Brass Laboratory:
  modes:
    dark:
      primary-color: "#d4a94f"
      accent-color: "#ffc861"
      primary-background-color: "#170d08"
      secondary-background-color: "#2a170e"
      card-background-color: "#2a160d"
      primary-text-color: "#f1e6c8"
      secondary-text-color: "#b9a27a"
      disabled-text-color: "#7a6850"
      text-primary-color: "#2a1a10"
      divider-color: "rgba(212, 169, 79, 0.25)"
      lovelace-background: "radial-gradient(ellipse at 50% -15%, rgba(255, 200, 97, 0.16), transparent 55%), radial-gradient(ellipse at 0% 100%, rgba(31, 58, 42, 0.55), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(90, 30, 20, 0.35), transparent 55%), linear-gradient(180deg, #1d110a 0%, #120a06 100%)"
      ha-card-border-radius: "14px"
      ha-card-box-shadow: "inset 0 0 0 1px rgba(212, 169, 79, 0.6), 0 14px 30px rgba(0, 0, 0, 0.55)"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      state-icon-color: "#d4a94f"
      state-icon-active-color: "#ffc861"
      state-active-color: "#ffc861"
      success-color: "#7fbf9a"
      warning-color: "#e8a23a"
      error-color: "#c8473b"
      info-color: "#8fc6dc"
      app-header-background-color: "#1d110a"
      app-header-text-color: "#f3d58a"
      sidebar-background-color: "#150c07"
      sidebar-text-color: "#e6d6ad"
      sidebar-selected-icon-color: "#ffc861"
      sidebar-selected-text-color: "#ffc861"
      paper-item-icon-color: "#d4a94f"
      mdc-theme-primary: "#d4a94f"
      switch-checked-color: "#d4a94f"
      slider-color: "#d4a94f"
      ha-font-family-body: "'IM Fell English', Lora, Georgia, serif"
