# Brass Laboratory: a Victorian laboratory dashboard, made only of Magic Cards.
title: Brass Laboratory
views:
  - type: sections
    max_columns: 4
    path: laboratory
    title: Laboratory
    icon: mdi:timer-sand
    theme: Brass Laboratory
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Brass machine
            background: 'linear-gradient(180deg, rgba(255,214,150,0.07), rgba(0,0,0,0.28)), repeating-linear-gradient(96deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 11px, rgba(255,220,170,0.025) 11px 13px, transparent 13px 23px), linear-gradient(135deg, #3a1f14 0%, #2a160d 55%, #1e0f09 100%)'
            border_radius: 14px
            padding: 18px
            box_shadow: inset 0 0 0 1px rgba(212, 169, 79, 0.6), inset 0 0 0 5px rgba(20,10,5,0.55), inset 0 0 0 6px rgba(212, 169, 79, 0.22), 0 14px 30px rgba(0,0,0,0.55)
            rows:
              - id: title
                columns:
                  - modules:
                      - type: text
                        text: The laboratory log
                        design:
                          font_family: '''IM Fell English SC'', ''Playfair Display'', Georgia, serif'
                          font_size: 10.5px
                          letter_spacing: 3px
                          text_transform: uppercase
                          color: '#b9a27a'
                      - type: text
                        text: The Brass Machine
                        design:
                          font_family: '''IM Fell English SC'', ''Playfair Display'', Georgia, serif'
                          font_size: 30px
                          line_height: '1.1'
                          letter_spacing: 0.5px
                          css: 'background: linear-gradient(180deg, #f3d58a 10%, #d4a94f 55%, #8a6a2c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.55));'
                    gap: 2px
              - id: machine
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        modules:
                          - type: vertical
                            gap: 0px
                            modules: []
                            design:
                              position: absolute
                              left: 4px
                              top: 4px
                              width: 132px
                              height: 132px
                              border_radius: 50%
                              background: radial-gradient(circle, rgba(255, 200, 97, 0.35), transparent 70%)
                              animations:
                                - id: aura
                                  preset: fade-pulse
                                  intensity: 55
                                  duration: 3s
