            custom_animations:
              - id: cannon-flash
                name: Cannon flash
                kind: keyframes
                duration: 2.2
                iterations: infinite
                target: element
                easing: ease-out
                keyframes:
                  - {at: 0, opacity: 0, transform: {scale: 0.4}}
                  - {at: 4, opacity: 1, transform: {scale: 1.25}}
                  - {at: 22, opacity: 0.35, transform: {scale: 1.5}}
                  - {at: 40, opacity: 0, transform: {scale: 1.7}}
                  - {at: 100, opacity: 0, transform: {scale: 0.4}}
              - id: cannon-recoil
                name: Cannon recoil
                kind: keyframes
                duration: 2.2
                iterations: infinite
                target: icon
                easing: ease-out
                keyframes: [{at: 0, transform: {x: 0}}, {at: 4, transform: {x: -9, rotate: -3}}, {at: 20, transform: {x: 0, rotate: 0}}, {at: 100, transform: {x: 0}}]
