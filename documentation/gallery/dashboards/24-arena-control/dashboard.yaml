# Arena Control dashboard (theme "Arena Control"). edit the generator, not this file.
title: Arena Control
views:
  - type: sections
    max_columns: 4
    path: arena
    title: Arena Control
    icon: mdi:stadium
    theme: Arena Control
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero
            background: 'radial-gradient(ellipse 60% 70% at 12% 0%, rgba(255,255,255,0.95), transparent 60%), linear-gradient(118deg, transparent 38%, rgba(150,138,118,0.16) 40%, transparent 43%), linear-gradient(152deg, transparent 58%, rgba(150,138,118,0.12) 60%, transparent 62%), linear-gradient(100deg, transparent 75%, rgba(216,180,90,0.10) 78%, transparent 82%), linear-gradient(140deg, #f4f0e8 0%, #e4ddd0 100%)'
            border_radius: 12px
            padding: 18px 18px 14px
            box_shadow: '0 18px 36px rgba(0,0,0,0.55), inset 0 0 0 2px #d8b45a, inset 0 0 0 5px #f4f0e8, inset 0 0 0 6px rgba(138,109,42,0.55)'
            css: 'font-family: ''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif; color: #ece8e0;font-family: ''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif; color: #1d1b18;'
            rows:
              - id: crest
                column_widths: [52px, 1fr, auto]
                gap: 10px
                columns:
                  - vertical_align: center
                    modules:
                      - type: icon
                        icon: svg
                        svg: <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="50" cy="50" r="39.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/><path fill="currentColor" d="M50.0 20.0 L55.0 38.0 L71.2 28.8 L62.0 45.0 L80.0 50.0 L62.0 55.0 L71.2 71.2 L55.0 62.0 L50.0 80.0 L45.0 62.0 L28.8 71.2 L38.0 55.0 L20.0 50.0 L38.0 45.0 L28.8 28.8 L45.0 38.0 Z"/><circle cx="50" cy="50" r="5" fill="#1d1b18" fill-opacity="0.5"/></svg>
                        size: 52px
                        design:
                          color: '#8a6d2a'
                          display: flex
                          filter: drop-shadow(0 1px 0 rgba(255,255,255,0.8)) drop-shadow(0 3px 4px rgba(138,109,42,0.35))
                          animations: [{id: shine, preset: shine-sweep, intensity: 60, duration: 4.5s}]
                  - gap: 2px
                    vertical_align: center
                    modules:
                      - type: text
                        text: Home · Arena control
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 10px
                          font_weight: '700'
                          letter_spacing: 2.5px
                          text_transform: uppercase
                          color: '#e0338a'
                          line_height: '1.3'
                      - type: text
                        text: Arena HQ
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 30px, font_weight: '700', color: '#1d1b18', line_height: '1.05', white_space: nowrap}
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, controller'
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 15px, font_style: italic, color: '#5a5348', white_space: nowrap}
                  - gap: 0px
                    vertical_align: center
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 36px, font_weight: '700', color: '#8a6d2a', line_height: '1', text_align: right}
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A'') }}'
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 11px
                          font_weight: '700'
                          color: '#5a5348'
                          text_align: right
                          margin_top: 5px
                          white_space: nowrap
                          letter_spacing: 1.5px
                          text_transform: uppercase
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%-d %B'') }}'
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 11px
                          font_weight: '600'
                          color: '#5a5348'
                          text_align: right
                          white_space: nowrap
                          letter_spacing: 0.5px
              - id: rule
                columns:
                  - modules:
                      - type: separator
                        separator_style: none
                        design: {height: 1px, margin: 2px 0, background: 'linear-gradient(90deg, transparent, #8a6d2a 12%, #f3d98b 50%, #8a6d2a 88%, transparent)'}
              - id: status
                layout: 1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          padding: 6px 8px
                          border_radius: 999px
                          background_color: rgba(29,27,24,0.06)
                          border: '1px solid #d8b45a'
                          justify_content: center
                          box_shadow: inset 0 1px 0 rgba(255,255,255,0.7)
                        modules:
                          - {type: icon, icon: mdi:shield-lock, size: 16px, design: {color: '#2f8a5c', display: flex}}
                          - type: text
                            text: Arena sealed
                            design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 13px, font_weight: '700', color: '#1d1b18', white_space: nowrap}
                        display: {conditions: [{type: state, entity: alarm_control_panel.home, state: armed_home}]}
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          padding: 6px 8px
                          border_radius: 999px
                          background_color: rgba(29,27,24,0.06)
                          border: '1px solid #d8b45a'
                          justify_content: center
                          box_shadow: inset 0 1px 0 rgba(255,255,255,0.7)
                        modules:
                          - {type: icon, icon: mdi:shield-alert, size: 16px, design: {color: '#e0338a', display: flex}}
                          - type: text
                            text: Arena open
                            design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 13px, font_weight: '700', color: '#1d1b18', white_space: nowrap}
                        display: {conditions: [{type: state, entity: alarm_control_panel.home, state_not: armed_home}]}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          padding: 6px 8px
                          border_radius: 999px
                          background_color: rgba(29,27,24,0.06)
                          border: '1px solid #d8b45a'
                          justify_content: center
                          box_shadow: inset 0 1px 0 rgba(255,255,255,0.7)
                        modules:
                          - {type: icon, icon: mdi:account-group, size: 16px, design: {color: '#ff6a1f', display: flex}}
                          - type: text
                            use_template: true
                            text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} of 3 safe'
                            design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 13px, font_weight: '700', color: '#1d1b18', white_space: nowrap}
                  - modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        justify: center
                        design:
                          padding: 6px 8px
                          border_radius: 999px
                          background_color: rgba(29,27,24,0.06)
                          border: '1px solid #d8b45a'
                          justify_content: center
                          box_shadow: inset 0 1px 0 rgba(255,255,255,0.7)
                        modules:
                          - {type: icon, icon: mdi:thermometer, size: 16px, design: {color: '#0f5c56', display: flex}}
                          - type: text
                            use_entity: true
                            entity: sensor.outdoor_temperature
                            design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 13px, font_weight: '700', color: '#1d1b18', white_space: nowrap}
              - id: foot
                padding: 2px 0 0
                columns:
                  - modules:
                      - type: text
                        text: Good luck out there
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 14px, font_style: italic, color: '#8a6d2a', text_align: center, letter_spacing: 0.3px}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Weather
            background: 'radial-gradient(ellipse 80% 60% at 50% 0%, rgba(31,200,184,0.13), transparent 65%), repeating-linear-gradient(0deg, rgba(31,200,184,0.035) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(31,200,184,0.035) 0 1px, transparent 1px 22px), linear-gradient(170deg, #10181c 0%, #0a0e12 100%)'
            border_radius: 12px
            padding: 16px
            box_shadow: 0 18px 36px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(31,200,184,0.28), inset 0 1px 0 rgba(143,245,234,0.14)
            css: 'font-family: ''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif; color: #ece8e0;'
            rows:
              - id: head
                column_widths: [1fr, auto]
                gap: 10px
                columns:
                  - gap: 3px
                    modules:
                      - type: text
                        text: Arena climate control
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 11px
                          font_weight: '700'
                          letter_spacing: 3px
                          text_transform: uppercase
                          color: '#1fc8b8'
                          line_height: '1.3'
                      - type: text
                        text: Arena forecast
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 23px, font_weight: '700', color: '#f4f0e8', line_height: '1.1'}
                  - vertical_align: center
                    modules:
                      - type: text
                        text: Approved
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 10px
                          font_weight: '700'
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#0b0d12'
                          background_color: '#1fc8b8'
                          padding: 4px 9px 3px
                          border_radius: 3px
                          white_space: nowrap
              - id: sky
                design:
                  padding: 6px 10px
                  border_radius: 10px
                  background_color: rgba(0,0,0,0.30)
                  border: 1px solid rgba(31,200,184,0.18)
                  animations: [{id: scan, preset: scanline, color: '#1fc8b8', intensity: 25, duration: 5s}]
                columns:
                  - modules:
                      - type: weather
                        entity: weather.home
                        show_temperature: true
                        show_condition: true
                        show_forecast: true
                        forecast_days: 5
                        animated_icons: true
                        design: {color: '#ece8e0', font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'}
              - id: stats
                layout: 1-1-1
                gap: 8px
                columns:
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 9px 4px 7px, border_radius: 8px, background_color: 'rgba(31,200,184,0.07)', border: '1px solid rgba(31,200,184,0.25)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:thermometer, size: 16px, design: {color: '#1fc8b8', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.outdoor_temperature
                                design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 15px, font_weight: '700', color: '#f4f0e8', white_space: nowrap}
                          - type: text
                            text: Outside
                            design:
                              font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                              font_size: 10px
                              font_weight: '700'
                              color: '#8ff5ea'
                              text_transform: uppercase
                              letter_spacing: 2px
                              text_align: center
                              opacity: '0.8'
                        actions: {tap_action: {action: more-info, entity: sensor.outdoor_temperature}}
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 9px 4px 7px, border_radius: 8px, background_color: 'rgba(31,200,184,0.07)', border: '1px solid rgba(31,200,184,0.25)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:weather-windy, size: 16px, design: {color: '#1fc8b8', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.wind_gust
                                design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 15px, font_weight: '700', color: '#f4f0e8', white_space: nowrap}
                          - type: text
                            text: Gusts
                            design:
                              font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                              font_size: 10px
                              font_weight: '700'
                              color: '#8ff5ea'
                              text_transform: uppercase
                              letter_spacing: 2px
                              text_align: center
                              opacity: '0.8'
                        actions: {tap_action: {action: more-info, entity: sensor.wind_gust}}
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design: {padding: 9px 4px 7px, border_radius: 8px, background_color: 'rgba(31,200,184,0.07)', border: '1px solid rgba(31,200,184,0.25)'}
                        modules:
                          - type: horizontal
                            gap: 5px
                            align: center
                            justify: center
                            design: {}
                            modules:
                              - {type: icon, icon: mdi:weather-pouring, size: 16px, design: {color: '#1fc8b8', display: flex}}
                              - type: text
                                use_entity: true
                                entity: sensor.rain_today
                                design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 15px, font_weight: '700', color: '#f4f0e8', white_space: nowrap}
                          - type: text
                            text: Rain
                            design:
                              font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                              font_size: 10px
                              font_weight: '700'
                              color: '#8ff5ea'
                              text_transform: uppercase
                              letter_spacing: 2px
                              text_align: center
                              opacity: '0.8'
                        actions: {tap_action: {action: more-info, entity: sensor.rain_today}}
            grid_options: {columns: 12, rows: auto}
          - type: custom:magic-card
            name: Broadcast
            background: 'radial-gradient(ellipse 55% 60% at 0% 0%, rgba(224,51,138,0.20), transparent 70%), radial-gradient(ellipse 50% 60% at 100% 10%, rgba(31,200,184,0.14), transparent 70%), linear-gradient(170deg, #1a1420 0%, #0d0f14 100%)'
            border_radius: 12px
            padding: 16px
            box_shadow: 0 18px 36px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(216,180,90,0.28), inset 0 1px 0 rgba(243,217,139,0.18)
            css: 'font-family: ''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif; color: #ece8e0;'
            animations: [{id: spot, preset: spotlight, color: '#f3d98b', intensity: 22, duration: 9s}]
            rows:
              - id: head
                column_widths: [1fr, auto]
                gap: 10px
                columns:
                  - gap: 3px
                    modules:
                      - type: text
                        text: Live from the studio
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 11px
                          font_weight: '700'
                          letter_spacing: 3px
                          text_transform: uppercase
                          color: '#ff6cb5'
                          line_height: '1.3'
                      - type: text
                        text: The broadcast
                        design: {font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif', font_size: 23px, font_weight: '700', color: '#f4f0e8', line_height: '1.1'}
                  - vertical_align: center
                    modules:
                      - type: horizontal
                        gap: 6px
                        align: center
                        design:
                          padding: 4px 9px 3px
                          border_radius: 3px
                          border: '1px solid #ff4b4b'
                          background_color: rgba(255,75,75,0.12)
                          animations: [{id: blink, preset: blink, intensity: 55, duration: 1.6s, trigger: state, trigger_entity: media_player.living_room, state: playing}]
                        modules:
                          - type: separator
                            separator_style: none
                            design: {width: 8px, min_width: 8px, height: 8px, margin: '0', border_radius: 50%, background_color: '#ff4b4b', box_shadow: '0 0 8px #ff4b4b'}
                          - type: text
                            text: On air
                            design:
                              font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                              font_size: 10px
                              font_weight: '700'
                              letter_spacing: 2px
                              text_transform: uppercase
                              color: '#f4f0e8'
                              white_space: nowrap
                        display: {conditions: [{type: state, entity: media_player.living_room, state: playing}]}
              - id: now
                column_widths: [108px, 1fr]
                gap: 16px
                columns:
                  - modules:
                      - type: vertical
                        gap: 0px
                        design:
                          padding: 4px
                          border_radius: 9px
                          background: 'linear-gradient(135deg, #e0338a, #d8b45a 50%, #1fc8b8)'
                          box_shadow: 0 8px 20px rgba(0,0,0,0.55), 0 0 22px rgba(224,51,138,0.25)
                        modules: [{type: image, entity: media_player.living_room, entity_picture: true, aspect_ratio: '1', design: {width: 100px, border_radius: 6px}}]
                  - gap: 3px
                    vertical_align: center
                    modules:
                      - type: text
                        use_entity: true
                        entity: media_player.living_room
                        design:
                          font_family: '''Bodoni Moda'', ''Playfair Display'', Georgia, serif'
                          font_size: 20px
                          font_weight: '700'
                          color: '#f4f0e8'
                          line_height: '1.15'
                          white_space: nowrap
                          overflow: hidden
                          text_overflow: ellipsis
                        attribute: media_title
                      - type: text
                        use_entity: true
                        entity: media_player.living_room
                        design:
                          font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                          font_size: 14px
                          color: '#f3d98b'
                          white_space: nowrap
                          overflow: hidden
                          text_overflow: ellipsis
                        attribute: media_artist
                      - type: vertical
                        gap: 0px
                        design:
                          height: 24px
                          margin_top: 6px
                          border_radius: 4px
                          overflow: hidden
                          animations: [{id: eq, preset: equalizer-bars, trigger: state, trigger_entity: media_player.living_room, state: playing, color: '#e0338a', intensity: 9, strength: 85}]
                        modules: []
                      - type: horizontal
                        gap: 10px
                        align: center
                        justify: start
                        design: {margin_top: 4px}
                        modules:
                          - type: vertical
                            gap: 0px
                            align: center
                            design:
                              width: 40px
                              height: 40px
                              border_radius: 50%
                              display: flex
                              align_items: center
                              justify_content: center
                              cursor: pointer
                              background: rgba(255,255,255,0.05)
                              border: 1px solid rgba(216,180,90,0.35)
                              box_shadow: none
                            modules: [{type: icon, icon: mdi:skip-previous, size: 21px, design: {color: '#f4f0e8', display: flex}}]
                            actions: {tap_action: {action: perform-action, service: media_player.media_previous_track, data: {entity_id: media_player.living_room}}}
                          - type: vertical
                            gap: 0px
                            align: center
                            design:
                              width: 50px
                              height: 50px
                              border_radius: 50%
                              display: flex
                              align_items: center
                              justify_content: center
                              cursor: pointer
                              background: 'radial-gradient(circle at 35% 30%, #ff6cb5, #e0338a 65%, #8c1552)'
                              border: none
                              box_shadow: 0 4px 16px rgba(224,51,138,0.45)
                            modules: [{type: icon, icon: mdi:play-pause, size: 26px, design: {color: '#0b0d12', display: flex}}]
                            actions: {tap_action: {action: perform-action, service: media_player.media_play_pause, data: {entity_id: media_player.living_room}}}
                          - type: vertical
                            gap: 0px
                            align: center
                            design:
                              width: 40px
                              height: 40px
                              border_radius: 50%
                              display: flex
                              align_items: center
                              justify_content: center
                              cursor: pointer
                              background: rgba(255,255,255,0.05)
                              border: 1px solid rgba(216,180,90,0.35)
                              box_shadow: none
                            modules: [{type: icon, icon: mdi:skip-next, size: 21px, design: {color: '#f4f0e8', display: flex}}]
                            actions: {tap_action: {action: perform-action, service: media_player.media_next_track, data: {entity_id: media_player.living_room}}}
              - id: feeds
                layout: 1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: horizontal
                        gap: 7px
                        align: center
                        design: {padding: 6px 8px, border_radius: 6px, background_color: 'rgba(255,255,255,0.03)', border: '1px solid rgba(216,180,90,0.14)', cursor: pointer}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 7px
                              min_width: 7px
                              height: 7px
                              margin: '0'
                              border_radius: 50%
                              background_color: '#9c978e'
                              conditional:
                                - id: live
                                  name: Live
                                  conditions: [{type: state, entity: media_player.kitchen, state: playing}]
                                  design: {background_color: '#e0338a', box_shadow: '0 0 6px #e0338a'}
                          - type: vertical
                            gap: 1px
                            design: {}
                            modules:
                              - type: text
                                text: Kitchen
                                design:
                                  font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif'
                                  font_size: 10px
                                  font_weight: '700'
                                  color: '#9c978e'
                                  text_transform: uppercase
                                  letter_spacing: 1.5px
                              - type: text
                                use_entity: true
                                entity: media_player.kitchen
                                design: {font_family: '''Josefin Sans'', Montserrat, ''Helvetica Neue'', sans-serif', font_size: 13px, font_weight: '600', color: '#ece8e0', white_space: nowrap}
                        actions: {tap_action: {action: more-info, entity: media_player.kitchen}}
                  - modules:
                      - type: horizontal
                        gap: 7px
                        align: center
                        design: {padding: 6px 8px, border_radius: 6px, background_color: 'rgba(255,255,255,0.03)', border: '1px solid rgba(216,180,90,0.14)', cursor: pointer}
                        modules:
                          - type: separator
                            separator_style: none
                            design:
                              width: 7px
                              min_width: 7px
                              height: 7px
                              margin: '0'
                              border_radius: 50%
                              background_color: '#9c978e'
                              conditional:
                                - {id: live, name: Live, conditions: [{type: state, entity: media_player.office, state: playing}], design: {background_color: '#e0338a', box_shadow: '0 0 6px #e0338a'}}
                          - type: vertical
                            gap: 1px
                            design: {}
                            modules:
