            background: 'radial-gradient(ellipse 80% 55% at 50% -12%, rgba(216,180,90,0.13), transparent 62%), radial-gradient(ellipse 60% 50% at 100% 100%, rgba(224,51,138,0.08), transparent 70%), linear-gradient(170deg, #151820 0%, #0d0f14 100%)'
