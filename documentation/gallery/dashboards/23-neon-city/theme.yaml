# Neon City: hard acid yellow, hot red and cyan on black. Cards draw their own cut-corner plates,
# so the theme's card surface is transparent and flat.
# Put this file in /config/themes/ (with `frontend: themes: !include_dir_merge_named themes` in configuration.yaml).
Neon City:
  modes:
    dark:
      primary-color: "#fcee0a"
      accent-color: "#ff003c"
      dark-primary-color: "#7d7606"
      light-primary-color: "#fff86a"
      text-primary-color: "#0a0a0a"
      primary-background-color: "#060607"
      secondary-background-color: "#0d0d10"
      card-background-color: "transparent"
      ha-card-background: "transparent"
      primary-text-color: "#f1efe2"
      secondary-text-color: "#9a978a"
      disabled-text-color: "#5a584f"
      divider-color: "rgba(252, 238, 10, 0.16)"
      lovelace-background: "radial-gradient(ellipse 60% 40% at 100% 0%, rgba(255, 0, 60, 0.16), transparent 70%), radial-gradient(ellipse 55% 45% at 0% 100%, rgba(0, 240, 255, 0.10), transparent 70%), repeating-linear-gradient(0deg, rgba(252, 238, 10, 0.022) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(252, 238, 10, 0.03) 0 1px, transparent 1px 96px), linear-gradient(180deg, #0b0b0d 0%, #050506 100%)"
      ha-card-border-radius: "0px"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-box-shadow: "none"
      ha-card-header-color: "#fcee0a"
      state-icon-color: "#00f0ff"
      state-active-color: "#fcee0a"
      state-on-color: "#fcee0a"
      state-off-color: "#5a584f"
      paper-item-icon-color: "#00f0ff"
      paper-item-icon-active-color: "#fcee0a"
      success-color: "#00f0ff"
      warning-color: "#fcee0a"
      error-color: "#ff003c"
      info-color: "#00f0ff"
      state-lock-locked-color: "#00f0ff"
      state-lock-unlocked-color: "#ff003c"
      state-alarm_control_panel-armed_home-color: "#00f0ff"
      state-alarm_control_panel-triggered-color: "#ff003c"
      state-person-home-color: "#fcee0a"
      state-light-on-color: "#fcee0a"
      state-climate-heat-color: "#ff003c"
      state-climate-cool-color: "#00f0ff"
      app-header-background-color: "#fcee0a"
      app-header-text-color: "#0a0a0a"
      sidebar-background-color: "#08080a"
      sidebar-text-color: "#d8d6c8"
      sidebar-selected-text-color: "#fcee0a"
      sidebar-selected-icon-color: "#fcee0a"
      sidebar-icon-color: "#9a978a"
      switch-checked-color: "#fcee0a"
      switch-checked-button-color: "#fcee0a"
      switch-checked-track-color: "#7d7606"
      input-fill-color: "#0d0d10"
      mdc-theme-primary: "#fcee0a"
      code-editor-background-color: "#0d0d10"
      markdown-code-background-color: "#0d0d10"
      primary-font-family: "Rajdhani, 'PT Sans', 'Source Sans Pro', sans-serif"
