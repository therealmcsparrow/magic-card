# Neon City dashboard (theme "Neon City"). edit the generator, not this file.
title: Neon City
views:
  - type: sections
    max_columns: 4
    path: den
    title: Neon City
    icon: mdi:skull-scan-outline
    theme: Neon City
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero
            background: 'linear-gradient(225deg, transparent 12.7px, rgba(252,238,10,0.75) 12.7px, rgba(252,238,10,0.75) 14.2px, transparent 14.2px), linear-gradient(45deg, transparent 8.5px, rgba(252,238,10,0.55) 8.5px, rgba(252,238,10,0.55) 9.9px, transparent 9.9px), linear-gradient(rgb(252,238,10), rgb(252,238,10)) 0 0 / 54px 3px no-repeat, linear-gradient(rgb(252,238,10), rgb(252,238,10)) 100% 100% / 3px 22px no-repeat, radial-gradient(ellipse 80% 55% at 100% 0%, rgba(255,0,60,0.10), transparent 65%), repeating-linear-gradient(0deg, rgba(252,238,10,0.028) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(252,238,10,0.028) 0 1px, transparent 1px 22px), linear-gradient(165deg, #141418 0%, #0d0d10 55%, #08080a 100%)'
            border_radius: 0px
            padding: 0px
            box_shadow: inset 0 0 0 1px rgba(252,238,10,0.26)
            css: 'font-family: Rajdhani, ''PT Sans'', ''Source Sans Pro'', sans-serif; color: #f1efe2; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 12px 100%, 0 calc(100% - 12px));'
            custom_animations:
              - id: matrix-column-scan
                name: Matrix column scan
                kind: keyframes
                duration: 4
                iterations: infinite
                target: element
                easing: steps(5, jump-none)
                keyframes: [{at: 0, transform: {x: 0}}, {at: 100, transform: {x: 144}}]
              - id: glitch-jolt
                name: Glitch jolt
                kind: keyframes
                duration: 3.6
                iterations: infinite
                target: element
                easing: linear
                keyframes:
                  - {at: 0, transform: {x: 0, skew: 0}, opacity: 1}
                  - {at: 90, transform: {x: 0, skew: 0}, opacity: 1}
                  - {at: 91, transform: {x: -5, skew: -8}, opacity: 0.8}
                  - {at: 93, transform: {x: 4, skew: 6}, opacity: 1}
                  - {at: 94, transform: {x: -2, skew: 0}, opacity: 0.6}
                  - {at: 96, transform: {x: 0, skew: 0}, opacity: 1}
                  - {at: 100, transform: {x: 0, skew: 0}, opacity: 1}
            rows:
              - id: band
                columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design: {padding: 5px 16px 5px 16px, background: 'repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 6px), #fcee0a'}
                        modules:
