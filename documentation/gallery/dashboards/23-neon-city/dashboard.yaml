                              font_family: '''Share Tech Mono'', ''Source Code Pro'', ''Fira Code'', monospace'
                              font_size: 11px
                              letter_spacing: 1px
                              text_transform: uppercase
                              color: '#0a0a0a'
                              white_space: nowrap
                              font_weight: '700'
                              flex: '1'
                              overflow: hidden
                              text_overflow: ellipsis
                          - type: text
                            text: SYS-OK
                            design:
                              font_family: '''Share Tech Mono'', ''Source Code Pro'', ''Fira Code'', monospace'
                              font_size: 11px
                              letter_spacing: 1px
                              text_transform: uppercase
                              color: '#0a0a0a'
                              white_space: nowrap
              - id: title
                column_widths: [1fr, auto]
                gap: 10px
