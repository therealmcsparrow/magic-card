       counter-drift:
        id: counter-drift
        name: counter drift
        kind: keyframes
        duration: 19
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           'y': 0
         -
          at: 100
          transform:
           'y': -360
       plasma-flicker:
        id: plasma-flicker
        name: plasma flicker
        kind: keyframes
        duration: 2.9
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.25
         -
          at: 23
          opacity: 0.4
         -
          at: 41
          opacity: 0.2
         -
          at: 68
          opacity: 0.46
         -
          at: 100
          opacity: 0.25
       thread-run:
