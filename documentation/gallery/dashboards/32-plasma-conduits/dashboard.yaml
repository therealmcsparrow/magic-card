title: Plasma conduits
views:
 -
  type: sections
  max_columns: 5
  path: plasma-conduits
  title: Plasma conduits
  icon: mdi:transmission-tower
  theme: Plasma Conduits
  background: linear-gradient(rgba(3, 4, 9, .62), rgba(3, 4, 9, .62)), url("/local/future/parts/hullPanel.webp") 0 0/512px
