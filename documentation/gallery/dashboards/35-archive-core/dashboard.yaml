title: Archive core
views:
 -
  type: sections
  max_columns: 5
  path: archive-core
  title: Archive core
  icon: mdi:server
  theme: Archive Core
  background: linear-gradient(rgba(3, 5, 7, .58), rgba(3, 5, 7, .58)), url("/local/future/parts/hullPanel.webp") 0 0/512px
  sections:
   -
    type: grid
    column_span: 5
    cards:
     -
      type: custom:magic-card
      name: Archive core
      border_radius: '0'
      padding: '0'
      overflow: hidden
      box_shadow: none
      border: none
      background: linear-gradient(rgba(3, 5, 7, .58), rgba(3, 5, 7, .58)), url("/local/future/parts/hullPanel.webp") calc(-32px + clamp(0px, calc((600px - 100vw) * 100), 24px)) calc(-32px + clamp(0px, calc((600px - 100vw) * 100), 24px))/512px
      css: 'font-synthesis: none; --primary-text-color: #d6f1f4; --secondary-text-color: #9cc3cb; --mc-slider-color: #9fdde8; --mc-slider-background: #05090c; --mc-slider-radius: 1px'
      custom_animations:
       blade-level:
        id: blade-level
        name: blade level
        kind: keyframes
        duration: 30
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
         -
          at: 100
        bindings:
         -
          target: element
          property: 'y'
          input:
           min: 0
           max: 255
           attribute: brightness
          output:
           - 280
           - 0
          smoothing: 3
         -
          target: element
          property: opacity
          input:
           min: 0
           max: 255
           attribute: brightness
          output:
           - 0.38
           - 0.72
          smoothing: 3
       pulse-climb:
        id: pulse-climb
        name: pulse climb
        kind: keyframes
        duration: 9
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0
          transform:
           'y': 0
         -
          at: 14
          opacity: 0.85
          transform:
           'y': -60
         -
          at: 80
          opacity: 0.6
          transform:
           'y': -300
         -
          at: 100
          opacity: 0
          transform:
           'y': -380
        bindings:
         -
          target: element
          property: speed
          input:
           min: 0
           max: 255
           attribute: brightness
          output:
           - 0.45
           - 1.5
          smoothing: 3
       pulse-climb-late:
        id: pulse-climb-late
        name: pulse climb late
        kind: keyframes
        duration: 14
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0
          transform:
           'y': 0
         -
          at: 14
          opacity: 0.85
          transform:
           'y': -60
         -
          at: 80
          opacity: 0.6
          transform:
           'y': -300
         -
          at: 100
          opacity: 0
          transform:
           'y': -380
        bindings:
         -
          target: element
          property: speed
          input:
           min: 0
           max: 255
           attribute: brightness
          output:
           - 0.45
           - 1.5
          smoothing: 3
       rail-run:
        id: rail-run
        name: rail run
        kind: keyframes
        duration: 2.8
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           x: 0
         -
          at: 100
          transform:
           x: 480
       rail-breath:
        id: rail-breath
        name: rail breath
        kind: keyframes
        duration: 2.2
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.35
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.35
       wall-red:
        id: wall-red
        name: wall red
        kind: keyframes
        duration: 4.5
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.55
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.55
       tube-glow:
        id: tube-glow
        name: tube glow
        kind: keyframes
        duration: 7.3
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.55
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.55
        bindings:
         -
          target: element
          property: speed
          input:
           min: 100
           max: 5000
          output:
           - 0.4
           - 2.2
          smoothing: 3
       bay-strip:
        id: bay-strip
        name: bay strip
        kind: keyframes
        duration: 11
        easing: ease-in-out
