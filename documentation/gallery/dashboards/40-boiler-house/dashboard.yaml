      custom_animations:
       gear-cw:
        id: gear-cw
        name: gear cw
        kind: keyframes
        duration: 60
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           rotate: 0
         -
          at: 100
          transform:
           rotate: 360
        origin: center
        bindings:
         -
          target: element
          property: speed
          input:
           min: 150
           max: 4000
          output:
           - 0.12
           - 2.6
          smoothing: 2.5
       gear-ccw:
        id: gear-ccw
        name: gear ccw
        kind: keyframes
        duration: 60
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           rotate: 0
         -
          at: 100
          transform:
           rotate: -360
        origin: center
        bindings:
         -
          target: element
          property: speed
          input:
           min: 150
           max: 4000
          output:
           - 0.12
           - 2.6
          smoothing: 2.5
       gear-alarm-cw:
        id: gear-alarm-cw
        name: gear alarm cw
        kind: keyframes
        duration: 60
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           rotate: 0
         -
          at: 100
          transform:
           rotate: 360
        origin: center
