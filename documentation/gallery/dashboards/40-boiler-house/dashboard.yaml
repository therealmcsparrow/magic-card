title: Boiler house
views:
 -
  type: sections
  max_columns: 5
  path: boiler-house
  title: Boiler house
  icon: mdi:pipe-valve
  theme: Boiler House
  sections:
   -
    type: grid
    column_span: 5
    cards:
     -
      type: custom:magic-card
      name: Boiler house
      border_radius: '0'
      padding: '0'
      overflow: hidden
      box_shadow: none
      border: none
      background: linear-gradient(rgba(8, 12, 18, .55), rgba(8, 12, 18, .55)), url("/local/steam/tex/iron-soot.webp") 0 0/820px
