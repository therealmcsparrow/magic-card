title: Reactor bay
views:
 -
  type: sections
  max_columns: 5
  path: reactor-bay
  title: Reactor bay
  icon: mdi:atom
  theme: Reactor Bay
  background: linear-gradient(rgba(6, 10, 14, .3), rgba(6, 10, 14, .3)), url("/local/future/parts/hullPanel.webp") 0 0/512px
  sections:
   -
    type: grid
    column_span: 5
    cards:
     -
      type: custom:magic-card
      name: Reactor bay
      border_radius: '0'
      padding: '0'
      overflow: hidden
      box_shadow: none
      border: none
      background: linear-gradient(rgba(6, 10, 14, .3), rgba(6, 10, 14, .3)), url("/local/future/parts/hullPanel.webp") calc(-32px + clamp(0px, calc((600px - 100vw) * 100), 24px)) calc(-32px + clamp(0px, calc((600px - 100vw) * 100), 24px))/512px
      css: 'font-synthesis: none; --primary-text-color: #d6f1f4; --secondary-text-color: #9cc3cb; --mc-slider-color: #9fdde8; --mc-slider-background: #05090c; --mc-slider-radius: 1px'
      custom_animations:
       core-pulse:
        id: core-pulse
        name: core pulse
        kind: keyframes
        duration: 5
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.35
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.35
        bindings:
         -
          target: element
          property: speed
          input:
           min: 100
           max: 5000
          output:
           - 0.25
           - 2.8
          smoothing: 3
       core-breath:
        id: core-breath
        name: core breath
        kind: keyframes
        duration: 5
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.55
          transform:
           scale: 0.97
         -
          at: 50
          opacity: 1
          transform:
           scale: 1.01
         -
          at: 100
          opacity: 0.55
          transform:
           scale: 0.97
        bindings:
         -
          target: element
          property: speed
          input:
           min: 100
           max: 5000
          output:
           - 0.25
           - 2.8
          smoothing: 3
        origin: center
       core-alarm:
        id: core-alarm
        name: core alarm
        kind: keyframes
        duration: 1.6
        easing: ease-in-out
        iterations: infinite
        keyframes:
         -
          at: 0
          opacity: 0.45
         -
          at: 50
          opacity: 1
         -
          at: 100
          opacity: 0.45
       flow-solar:
        id: flow-solar
        name: flow solar
        kind: keyframes
        duration: 3.4
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           'y': -72
         -
          at: 100
          transform:
           'y': 0
        bindings:
         -
          target: element
          property: speed
          input:
           min: 0
           max: 5000
          output:
           - 0.2
           - 2.6
          smoothing: 3
       flow-grid-in:
        id: flow-grid-in
        name: flow grid in
        kind: keyframes
        duration: 3.4
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           'y': -72
         -
          at: 100
          transform:
           'y': 0
        bindings:
         -
          target: element
          property: speed
          input:
           min: 0
           max: 3000
          output:
           - 0.2
           - 2.6
          smoothing: 3
       flow-grid-out:
        id: flow-grid-out
        name: flow grid out
        kind: keyframes
        duration: 3.4
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
           'y': 0
         -
          at: 100
          transform:
           'y': -72
        bindings:
         -
          target: element
          property: speed
          input:
           min: -3000
           max: 0
          output:
           - 2.6
           - 0.2
          smoothing: 3
       flow-house:
        id: flow-house
        name: flow house
        kind: keyframes
        duration: 3.4
        easing: linear
        iterations: infinite
        keyframes:
         -
          at: 0
          transform:
