                        design:
                          font_family: Orbitron, Oswald, sans-serif
                          font_size: 14px
                          font_weight: '700'
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#ff2bd6'
                          text_shadow: '0 0 2.8px #ff2bd6, 0 0 9.799999999999999px #ff2bd699'
