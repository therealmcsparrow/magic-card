# Neon noir: a rain-soaked city apartment dashboard made only of Magic Cards.
# Paste into a new dashboard: three-dot menu → Edit dashboard → three-dot menu → Raw configuration editor.
title: Neon noir
views:
  - title: Neon noir
    path: neon-noir
    icon: mdi:weather-pouring
    type: sections
    max_columns: 4
    theme: Neon Noir
    sections:
      - type: grid
        cards:
          - type: custom:magic-card
            name: Hero · Apartment
            background: 'radial-gradient(ellipse at 80% 0%, rgba(34,230,255,0.14), transparent 55%), radial-gradient(ellipse at 10% 100%, rgba(255,138,31,0.28), transparent 60%), linear-gradient(180deg, #0c0a26 0%, #1a0d2e 60%, #2a1420 100%)'
            border_radius: 14px
            padding: 16px
            box_shadow: '0 0 0 1px #ff2bd638, 0 0 22px #ff2bd61f, 0 18px 40px rgba(0,0,0,0.55)'
            css: 'font-family: Rajdhani, Oswald, sans-serif; color: #eaf2ff;'
            overflow: hidden
            custom_animations:
              - id: beacon
                name: Beacon
                kind: keyframes
                duration: 2.2
                iterations: infinite
                target: element
                easing: linear
                keyframes:
                  - at: 0
                    opacity: 1
                  - at: 12
                    opacity: 1
                  - at: 16
                    opacity: 0.1
                  - at: 100
                    opacity: 0.1
            animations:
              - preset: scanline
                color: '#22e6ff'
                intensity: 18
                duration: 7s
            rows:
              - id: top
                column_widths:
                  - 1fr
                  - auto
                gap: 10px
                columns:
                  - gap: 4px
                    modules:
                      - type: text
                        text: Night city · Sector 7 · 雨
                        design:
                          font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                          font_size: 11px
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#ff8a1f'
                          line_height: '1.2'
                          white_space: nowrap
                      - type: text
                        text: NEON NOIR
                        design:
                          font_family: Orbitron, Oswald, sans-serif
                          font_size: 21px
                          font_weight: '900'
                          letter_spacing: 2px
                          color: '#ff2bd6'
                          text_shadow: '0 0 4px #ff2bd6, 0 0 14px #ff2bd699'
                          line_height: '1.15'
                          white_space: nowrap
                          animations:
                            - preset: neon-flicker
                              color: '#ff2bd6'
                              intensity: 10
                              duration: 7s
                      - type: text
                        use_template: true
                        text: '{{ ''Good morning'' if now().hour < 12 else ''Good afternoon'' if now().hour < 18 else ''Good evening'' }}, Anna'
                        design:
                          font_size: 17px
                          font_weight: '500'
                          color: '#eaf2ff'
                          line_height: '1.2'
                          white_space: nowrap
                  - gap: 2px
                    vertical_align: start
                    modules:
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%H:%M'') }}'
                        design:
                          font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                          font_size: 40px
                          color: '#22e6ff'
                          text_shadow: '0 0 4px #22e6ff, 0 0 14px #22e6ff99'
                          line_height: '1'
                          text_align: right
                          font_variant: tabular-nums
                      - type: text
                        use_template: true
                        text: '{{ now().strftime(''%A %-d %B'') }}'
                        design:
                          font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                          font_size: 11px
                          color: '#8a96c0'
                          text_align: right
                          letter_spacing: 1px
                          white_space: nowrap
              - id: status
                padding: 4px 0 0
                columns:
                  - modules:
                      - type: horizontal
                        gap: 8px
                        align: center
                        design:
                          flex_wrap: wrap
                        modules:
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border: '1px solid #22e6ff66'
                              background_color: '#22e6ff14'
                              border_radius: 4px
                              box_shadow: '0 0 10px #22e6ff22'
                              min_width: 0px
                            modules:
                              - type: icon
                                icon: mdi:shield-home
                                size: 15px
                                design:
                                  color: '#22e6ff'
                              - type: text
                                use_entity: true
                                entity: alarm_control_panel.home
                                design:
                                  font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                                  font_size: 13px
                                  color: '#eaf2ff'
                                  white_space: nowrap
                                  line_height: '1.2'
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border: '1px solid #ff2bd666'
                              background_color: '#ff2bd614'
                              border_radius: 4px
                              box_shadow: '0 0 10px #ff2bd622'
                              min_width: 0px
                            modules:
                              - type: icon
                                icon: mdi:account-eye
                                size: 15px
                                design:
                                  color: '#ff2bd6'
                              - type: text
                                use_template: true
                                text: '{{ states.person | selectattr(''state'',''eq'',''home'') | list | count }} / 3 home'
                                design:
                                  font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                                  font_size: 13px
                                  color: '#eaf2ff'
                                  white_space: nowrap
                                  line_height: '1.2'
                          - type: horizontal
                            gap: 6px
                            align: center
                            design:
                              padding: 4px 10px
                              border: '1px solid #ff8a1f66'
                              background_color: '#ff8a1f14'
                              border_radius: 4px
                              box_shadow: '0 0 10px #ff8a1f22'
                              min_width: 0px
                            modules:
                              - type: icon
                                icon: mdi:car-electric
                                size: 15px
                                design:
                                  color: '#ff8a1f'
                              - type: text
                                use_entity: true
                                entity: sensor.car_battery
                                design:
                                  font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                                  font_size: 13px
                                  color: '#eaf2ff'
                                  white_space: nowrap
                                  line_height: '1.2'
              - id: skyline
                design:
                  margin: 2px -16px -16px
                  padding: 0px
                  overflow: hidden
                  border_radius: 0 0 14px 14px
                  background: 'linear-gradient(180deg, transparent 0%, #ff8a1f26 70%, #ff8a1f40 100%)'
                  animations:
                    - preset: rain-fall
                      color: '#9fd8ff'
                      strength: 35
                      intensity: 8
                      duration: 0.8s
                columns:
                  - modules:
                      - type: horizontal
                        gap: 3px
                        align: end
                        design:
                          height: 76px
                          overflow: visible
                        modules:
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1.1'
                              min_width: 0px
                              height: 38px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#ffb347aa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #ffb34755'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '0.7'
                              min_width: 0px
                              height: 54px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'linear-gradient(180deg, #121530, #08081a)'
                              border_top: '1px solid #4a548055'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1.3'
                              min_width: 0px
                              height: 30px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#9ff6ffaa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #9ff6ff55'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '0.8'
                              min_width: 0px
                              height: 66px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#ffb347aa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #ffb34755'
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  top: -4px
                                  left: calc(50% - 2px)
                                  width: 4px
                                  height: 4px
                                  border_radius: 50%
                                  background_color: '#ff3355'
                                  box_shadow: '0 0 8px #ff3355'
                                  animations:
                                    - preset: custom:beacon
                                      delay: 1.11s
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1'
                              min_width: 0px
                              height: 44px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'linear-gradient(180deg, #121530, #08081a)'
                              border_top: '1px solid #4a548055'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              flex: none
                              width: 84px
                              align_self: flex-end
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  width: 84px
                                  height: 86px
                                  margin: 0 auto
                                  background: 'radial-gradient(rgba(255,200,120,0.75) 0.8px, transparent 1.3px) 0 0 / 5px 5px, linear-gradient(180deg, #ff8a1f 0%, #8a3d0a 55%, #2a1206 100%)'
                                  css: 'clip-path: polygon(48% 0, 52% 0, 52% 10%, 64% 16%, 64% 36%, 80% 42%, 80% 100%, 20% 100%, 20% 42%, 36% 36%, 36% 16%, 48% 10%);'
                                  filter: 'drop-shadow(0 0 12px #ff8a1f)'
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '0.9'
                              min_width: 0px
                              height: 50px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#9ff6ffaa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #9ff6ff55'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1.2'
                              min_width: 0px
                              height: 34px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#ffb347aa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #ffb34755'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '0.6'
                              min_width: 0px
                              height: 72px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#ff2bd6aa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #ff2bd655'
                            modules:
                              - type: separator
                                separator_style: none
                                design:
                                  position: absolute
                                  top: -4px
                                  left: calc(50% - 2px)
                                  width: 4px
                                  height: 4px
                                  border_radius: 50%
                                  background_color: '#ff3355'
                                  box_shadow: '0 0 8px #ff3355'
                                  animations:
                                    - preset: custom:beacon
                                      delay: 2.96s
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1'
                              min_width: 0px
                              height: 42px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#ffb347aa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #ffb34755'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '0.8'
                              min_width: 0px
                              height: 58px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'linear-gradient(180deg, #121530, #08081a)'
                              border_top: '1px solid #4a548055'
                            modules: []
                          - type: vertical
                            gap: 0px
                            design:
                              position: relative
                              flex: '1.2'
                              min_width: 0px
                              height: 28px
                              align_self: flex-end
                              box_sizing: border-box
                              background: 'radial-gradient(#9ff6ffaa 0.7px, transparent 1.2px) 3px 4px / 6px 7px, linear-gradient(180deg, #14122e, #0a0a1c)'
                              border_top: '1px solid #9ff6ff55'
                            modules: []
            grid_options:
              columns: 12
              rows: auto
          - type: custom:magic-card
            name: Weather · Rain on glass
            background: 'radial-gradient(circle at 12% 92%, rgba(255,43,214,0.30), transparent 42%), radial-gradient(circle at 88% 80%, rgba(34,230,255,0.24), transparent 44%), radial-gradient(circle at 62% 6%, rgba(255,138,31,0.20), transparent 46%), linear-gradient(180deg, #0a0d24, #06071a)'
            border_radius: 14px
            padding: 16px
            box_shadow: '0 0 0 1px #22e6ff38, 0 0 22px #22e6ff1f, 0 18px 40px rgba(0,0,0,0.55)'
            css: 'font-family: Rajdhani, Oswald, sans-serif; color: #eaf2ff;'
            overflow: hidden
            custom_animations:
              - id: glass-drop
                name: Glass drop
                kind: keyframes
                duration: 4
                iterations: infinite
                target: element
                easing: ease-in
                keyframes:
                  - at: 0
                    transform:
                      'y': 0
                      scale_y: 1
                    opacity: 0
                  - at: 8
                    opacity: 0.9
                  - at: 55
                    transform:
                      'y': 14
                      scale_y: 1.1
                    opacity: 0.9
                  - at: 100
                    transform:
                      'y': 120
                      scale_y: 1.6
                    opacity: 0
              - id: puddle-ripple
                name: Puddle ripple
                kind: keyframes
                duration: 3.2
                iterations: infinite
                target: element
                easing: ease-in-out
                direction: alternate
                keyframes:
                  - at: 0
                    transform:
                      scale_x: 1
                      x: 0
                    opacity: 0.55
                  - at: 100
                    transform:
                      scale_x: 1.08
                      x: 6
                    opacity: 0.85
            rows:
              - id: glass
                column_widths:
                  - 1fr
                  - auto
                gap: 8px
                design:
                  position: relative
                  min_height: 120px
                  animations:
                    - preset: rain-fall
                      color: '#9fd8ff'
                      strength: 60
                      intensity: 12
                      duration: 0.75s
                columns:
                  - gap: 2px
                    modules:
                      - type: separator
                        separator_style: none
                        design:
