                        show_temperature: false
                        show_condition: false
                        animated_icons: true
                        design:
                          css: '--mc-icon-size-xl: 92px;'
                          filter: 'drop-shadow(0 0 10px #22e6ff66)'
              - id: stats
                layout: 1-1-1-1
                gap: 6px
                columns:
                  - modules:
                      - type: vertical
                        gap: 3px
                        align: center
                        design:
                          padding: 8px 2px
                          border_radius: 6px
                          background_color: rgba(5,7,20,0.55)
