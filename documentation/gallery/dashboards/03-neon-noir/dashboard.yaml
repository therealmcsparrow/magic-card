                      - type: text
                        text: Street level · 雨
                        design:
                          font_family: '''Share Tech Mono'', ''Source Code Pro'', monospace'
                          font_size: 11px
                          letter_spacing: 2px
                          text_transform: uppercase
                          color: '#22e6ff'
