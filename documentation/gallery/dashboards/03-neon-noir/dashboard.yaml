                          position: absolute
                          left: 71%
                          top: 40px
                          width: 4px
                          height: 7px
                          border_radius: 50% 50% 50% 50% / 60% 60% 40% 40%
                          background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(159,216,255,0.35) 45%, rgba(159,216,255,0.05) 70%)
                          box_shadow: 0 0 4px rgba(159,216,255,0.6)
                          pointer_events: none
                          z_index: '0'
                          animations:
                            - preset: custom:glass-drop
                              delay: 0.6s
                              duration: 3.6s
                      - type: separator
                        separator_style: none
