# Neon Noir: deep navy and black, magenta and cyan neon, a warm sodium-orange haze.
# Put this file in /config/themes/ (with `frontend: themes: !include_dir_merge_named themes` in configuration.yaml).
Neon Noir:
  modes:
    dark:
      primary-color: "#ff2bd6"
      accent-color: "#22e6ff"
      dark-primary-color: "#c41fa4"
      light-primary-color: "#ff7ae6"
      text-primary-color: "#05060f"
      primary-background-color: "#05060f"
      secondary-background-color: "#0e1128"
      card-background-color: "#0b0d1f"
      ha-card-background: "rgba(11, 13, 31, 0.92)"
      primary-text-color: "#eaf2ff"
      secondary-text-color: "#8a96c0"
      disabled-text-color: "#4a5480"
      divider-color: "rgba(34, 230, 255, 0.16)"
      lovelace-background: "radial-gradient(ellipse at 15% 0%, rgba(255, 138, 31, 0.16) 0%, transparent 45%), radial-gradient(ellipse at 95% 15%, rgba(255, 43, 214, 0.14) 0%, transparent 40%), radial-gradient(ellipse at 50% 110%, rgba(34, 230, 255, 0.10) 0%, transparent 50%), linear-gradient(180deg, #070a1c 0%, #04050c 100%)"
      ha-card-border-radius: "14px"
      ha-card-box-shadow: "0 0 0 1px rgba(34, 230, 255, 0.18), 0 18px 40px rgba(0, 0, 0, 0.55)"
      ha-card-border-width: "0px"
      state-icon-color: "#22e6ff"
      state-icon-active-color: "#ff2bd6"
      state-active-color: "#ff2bd6"
      paper-item-icon-color: "#22e6ff"
      sidebar-background-color: "#05060f"
      sidebar-text-color: "#8a96c0"
      sidebar-selected-text-color: "#ff2bd6"
      sidebar-selected-icon-color: "#ff2bd6"
      sidebar-icon-color: "#4a5480"
      app-header-background-color: "#05060f"
      app-header-text-color: "#eaf2ff"
      app-header-selection-bar-color: "#ff2bd6"
      switch-checked-color: "#ff2bd6"
      switch-checked-button-color: "#ff2bd6"
      switch-checked-track-color: "#ff2bd6"
      slider-color: "#22e6ff"
      slider-track-color: "#1a1e3c"
      input-fill-color: "#0e1128"
      code-editor-background-color: "#05060f"
      success-color: "#3dffb5"
      warning-color: "#ff8a1f"
      error-color: "#ff3355"
      info-color: "#22e6ff"
      state-on-color: "#ff2bd6"
      state-off-color: "#4a5480"
      state-home-color: "#22e6ff"
      state-not_home-color: "#8a96c0"
      state-alarm_control_panel-armed_home-color: "#22e6ff"
      state-alarm_control_panel-armed_away-color: "#22e6ff"
      state-alarm_control_panel-disarmed-color: "#ff8a1f"
      state-alarm_control_panel-triggered-color: "#ff3355"
      state-lock-locked-color: "#3dffb5"
      state-lock-unlocked-color: "#ff3355"
      state-light-on-color: "#ff8a1f"
      state-climate-heat-color: "#ff8a1f"
      state-climate-cool-color: "#22e6ff"
      energy-solar-color: "#ffb347"
      energy-grid-consumption-color: "#22e6ff"
      energy-grid-return-color: "#a46bff"
      energy-battery-in-color: "#3dffb5"
      energy-battery-out-color: "#ff2bd6"
