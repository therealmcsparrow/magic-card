# Scenes: four large gradient tiles, one tap each.
# Entities: scene.relax, scene.movie, scene.dinner, scene.focus
type: custom:magic-card
name: Scenes
background: "#14161c"
border_radius: 26px
padding: 16px
box_shadow: "0 18px 40px rgba(0,0,0,0.45)"
rows:
  - id: title
    columns:
      - modules:
          - type: text
            text: Scenes
            design: { font_size: 17px, font_weight: "700", color: "#f1f5f9", padding: 2px 4px }
  - id: r1
    layout: "1-1"
    gap: 12px
    columns:
      - modules:
          - type: vertical
            gap: 26px
            design:
              padding: 16px
              border_radius: 22px
              background: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
              box_shadow: "0 10px 24px rgba(245,87,108,0.35)"
              transition: transform 0.2s
              hover: { transform: translateY(-2px) }
            actions:
              tap_action: { action: perform-action, service: scene.turn_on, data: { entity_id: scene.relax } }
            modules:
              - type: icon
                icon: mdi:sofa-single
                size: 26px
                design: &badge
                  color: "#ffffff"
                  width: 42px
                  height: 42px
                  display: flex
                  align_items: center
                  justify_content: center
                  border_radius: 14px
                  background_color: "rgba(255,255,255,0.22)"
              - type: vertical
                gap: 0px
                modules:
                  - type: text
                    text: Relax
                    design: &label { font_size: 16px, font_weight: "800", color: "#ffffff" }
                  - type: text
                    text: Warm, 40%
                    design: &hint { font_size: 12px, color: "rgba(255,255,255,0.8)" }
      - modules:
          - type: vertical
            gap: 26px
            design:
              padding: 16px
              border_radius: 22px
              background: "linear-gradient(135deg, #4facfe 0%, #6a3ef7 100%)"
              box_shadow: "0 10px 24px rgba(106,62,247,0.35)"
              transition: transform 0.2s
              hover: { transform: translateY(-2px) }
            actions:
              tap_action: { action: perform-action, service: scene.turn_on, data: { entity_id: scene.movie } }
            modules:
              - type: icon
                icon: mdi:movie-open
                size: 26px
                design: *badge
              - type: vertical
                gap: 0px
                modules:
                  - type: text
                    text: Movie night
                    design: *label
                  - type: text
                    text: Dim, blinds down
                    design: *hint
  - id: r2
    layout: "1-1"
    gap: 12px
    columns:
      - modules:
          - type: vertical
            gap: 26px
            design:
              padding: 16px
              border_radius: 22px
              background: "linear-gradient(135deg, #f6d365 0%, #fda085 100%)"
              box_shadow: "0 10px 24px rgba(253,160,133,0.35)"
              transition: transform 0.2s
              hover: { transform: translateY(-2px) }
            actions:
              tap_action: { action: perform-action, service: scene.turn_on, data: { entity_id: scene.dinner } }
            modules:
              - type: icon
                icon: mdi:silverware-fork-knife
                size: 26px
                design: *badge
              - type: vertical
                gap: 0px
                modules:
                  - type: text
                    text: Dinner
                    design: *label
                  - type: text
                    text: Table spot, music
                    design: *hint
      - modules:
          - type: vertical
            gap: 26px
            design:
              padding: 16px
              border_radius: 22px
              background: "linear-gradient(135deg, #43e97b 0%, #38b2ac 100%)"
              box_shadow: "0 10px 24px rgba(56,178,172,0.35)"
              transition: transform 0.2s
              hover: { transform: translateY(-2px) }
            actions:
              tap_action: { action: perform-action, service: scene.turn_on, data: { entity_id: scene.focus } }
            modules:
              - type: icon
                icon: mdi:head-lightbulb
                size: 26px
                design: *badge
              - type: vertical
                gap: 0px
                modules:
                  - type: text
                    text: Focus
                    design: *label
                  - type: text
                    text: Cool white, 100%
                    design: *hint
