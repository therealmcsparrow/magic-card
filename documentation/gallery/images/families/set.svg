<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
<title id="t">Card families in the Magic Card gallery</title>
<desc id="d">Home: Home comfort. Rooms, lights and scenes. Climate: Weather and climate. Weather, heating and air. Power: Energy and power. Solar, batteries and chargers. Guard: Doors and security. Alarms, doors and cameras. Sound: Media and sound. Players, records, speakers. Machines: Appliances and machines. Kitchen, cleaning and servers. Garden: Garden and water. Plants, pool and irrigation. Worlds: Other worlds. Space, castles and seasons.</desc>
<style>
.bg{fill:#ffffff}.tile{fill:#f3f6fa;stroke:#8c959f;stroke-width:1}.glyph{fill:#0b5cad}.short{font:700 26px system-ui,sans-serif;fill:#1f2328}.name{font:600 16px system-ui,sans-serif;fill:#1f2328}.desc{font:14px system-ui,sans-serif;fill:#424a53}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.tile{fill:#161b22;stroke:#6e7681}.glyph{fill:#58a6ff}.short,.name{fill:#e6edf3}.desc{fill:#b1bac4}}
@media (forced-colors:active){.bg{fill:Canvas}.tile{fill:Canvas;stroke:CanvasText}.glyph{fill:CanvasText}.short,.name,.desc{fill:CanvasText}}
</style>
