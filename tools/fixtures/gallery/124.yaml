# Front door: the camera fills the card behind the other modules, with a doorbell badge and a lock badge on top, a fade for the text and a glass slider for the porch light.
# Entities: camera.front_door, binary_sensor.front_doorbell, lock.front_door, light.porch
# gallery: width=400
type: custom:magic-card
name: Front door
background: "#0e1116"
border_radius: 26px
padding: 20px
box_shadow: "0 18px 40px rgba(0,0,0,0.5)"
rows:
  - id: view
    columns:
      - gap: 2px
        vertical_align: end
        design: { min_height: 200px }
        modules:
          - type: camera
            entity: camera.front_door
            camera_view: snapshot
            placement: background
            layer:
              fill: card
              scrim:
                style: bottom
                strength: 70
          - type: info
            entity: binary_sensor.front_doorbell
            show_name: false
            show_state: true
            prefix: "Doorbell "
            placement: overlay
            layer:
              anchor: top-right
              offset_x: 12px
              offset_y: 12px
            design:
              padding: 6px 12px
              border_radius: 999px
              background_color: "rgba(0,0,0,0.55)"
              color: "#ffffff"
              font_size: 12px
          - type: info
            entity: lock.front_door
            show_name: false
            show_state: true
            prefix: "Door "
            placement: overlay
            layer:
              anchor: top-left
              offset_x: 12px
              offset_y: 12px
            design:
              padding: 6px 12px
              border_radius: 999px
              background_color: "rgba(0,0,0,0.55)"
              color: "#86efac"
              font_size: 12px
          - type: text
            text: Front door
            design: { font_size: 22px, font_weight: "800", color: "#ffffff", text_shadow: "0 2px 12px rgba(0,0,0,0.6)" }
          - type: text
            text: "Camera view with the badges on top."
            design: { font_size: 12px, color: "rgba(255,255,255,0.88)", text_shadow: "0 2px 10px rgba(0,0,0,0.6)" }
  - id: porch
    padding: 18px 0 0
    columns:
      - gap: 6px
        modules:
          - type: text
            text: Porch light
            design: { font_size: 11px, font_weight: "700", color: "rgba(255,255,255,0.85)", text_transform: uppercase, letter_spacing: 1px }
          - type: slider
            entity: light.porch
            track_style: glass
            track_thickness: 30
            glass_blur: true
            thumb: pill
            thumb_size: 28
            value_position: track
            use_entity_color: true
            live: true
