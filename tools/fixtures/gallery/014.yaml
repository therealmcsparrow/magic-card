# Sensor tiles: four readings, each with its last 24 hours drawn as a sparkline
# behind the value.
# Entities: sensor.indoor_temperature, sensor.indoor_humidity, sensor.house_power, sensor.co2
# gallery: width=400
type: custom:magic-card
name: Sensors
background: "#0e1117"
border_radius: 26px
padding: 14px
box_shadow: "0 18px 40px rgba(0,0,0,0.5)"
rows:
  - id: r1
    layout: "1-1"
    gap: 10px
    columns:
      - modules:
          - type: vertical
            gap: 2px
            design:
              height: 104px
              padding: 14px
              border_radius: 20px
              background_color: "#171b24"
              value_background: { type: sparkline, entity: sensor.indoor_temperature, min: 17, max: 29, color: "#fb923c", opacity: 20%, line_width: 2 }
            actions:
              tap_action: { action: more-info, entity: sensor.indoor_temperature }
            modules:
              - type: horizontal
                gap: 6px
                align: center
                modules:
                  - type: icon
                    icon: mdi:thermometer
                    size: 16px
                    design: { color: "#fb923c" }
                  - type: text
                    text: Temperature
                    design: &lab { font_size: 12px, color: "#94a3b8" }
              - type: text
                use_entity: true
                entity: sensor.indoor_temperature
                design: &num { font_size: 24px, font_weight: "800", color: "#f8fafc", letter_spacing: -0.5px }
      - modules:
          - type: vertical
            gap: 2px
            design:
              height: 104px
              padding: 14px
              border_radius: 20px
              background_color: "#171b24"
              value_background: { type: sparkline, entity: sensor.indoor_humidity, min: 30, max: 80, color: "#38bdf8", opacity: 20%, line_width: 2 }
            actions:
              tap_action: { action: more-info, entity: sensor.indoor_humidity }
            modules:
              - type: horizontal
                gap: 6px
                align: center
                modules:
                  - type: icon
                    icon: mdi:water-percent
                    size: 16px
                    design: { color: "#38bdf8" }
                  - type: text
                    text: Humidity
                    design: *lab
              - type: text
                use_entity: true
                entity: sensor.indoor_humidity
                design: *num
  - id: r2
    layout: "1-1"
    gap: 10px
    columns:
      - modules:
          - type: vertical
            gap: 2px
            design:
              height: 104px
              padding: 14px
              border_radius: 20px
              background_color: "#171b24"
              value_background: { type: sparkline, entity: sensor.house_power, min: 0, max: 2600, color: "#facc15", opacity: 20%, line_width: 2 }
            actions:
              tap_action: { action: more-info, entity: sensor.house_power }
            modules:
              - type: horizontal
                gap: 6px
                align: center
                modules:
                  - type: icon
                    icon: mdi:flash
                    size: 16px
                    design: { color: "#facc15" }
                  - type: text
                    text: Power
                    design: *lab
              - type: text
                use_entity: true
                entity: sensor.house_power
                design: *num
      - modules:
          - type: vertical
            gap: 2px
            design:
              height: 104px
              padding: 14px
              border_radius: 20px
              background_color: "#171b24"
              value_background: { type: sparkline, entity: sensor.co2, min: 300, max: 1300, color: "#4ade80", opacity: 20%, line_width: 2 }
            actions:
              tap_action: { action: more-info, entity: sensor.co2 }
            modules:
              - type: horizontal
                gap: 6px
                align: center
                modules:
                  - type: icon
                    icon: mdi:molecule-co2
                    size: 16px
                    design: { color: "#4ade80" }
                  - type: text
                    text: CO₂
                    design: *lab
              - type: text
                use_entity: true
                entity: sensor.co2
                design: *num
