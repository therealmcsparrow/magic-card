# Pattern panel: a grid pattern over a colour layer, with a centred stack and a reading.
# Entities: sensor.indoor_temperature
# gallery: width=380
type: custom:magic-card
name: Pattern panel
border_radius: 22px
padding: 20px
background_layers:
  - type: pattern
    pattern: grid
    color: "rgba(255,255,255,0.18)"
    size: 18
    thickness: 1
  - type: color
    color: "#0f766e"
rows:
  - id: main
    columns:
      - modules:
          - type: vertical
            gap: 6px
            align: center
            justify: center
            modules:
              - type: text
                text: Indoor
                design: { font_size: 13px, text_transform: uppercase, letter_spacing: 2px, color: "rgba(255,255,255,0.8)" }
              - type: info
                entity: sensor.indoor_temperature
                show_name: false
                show_unit: true
                design: { font_size: 44px, font_weight: "300", color: "#ffffff" }
