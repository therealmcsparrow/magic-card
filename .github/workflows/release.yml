name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Third-party notices up to date
        run: npm run notices -- --check

      - name: i18n drift check (en-GB, en-US, nl)
        # before the build: the build regenerates en-US.json, so a stale committed file is caught here. Strict through I18N_RELEASE_STRICT in the contract.
        run: node tools/check-i18n.mjs --ci

      - run: npm run build

      - name: Committed dist matches the build
        run: |
          # git diff does not see a new untracked file (a .br or .gz sibling nobody committed), so git status is checked too
          if ! git diff --quiet -- dist src/version.ts || [ -n "$(git status --porcelain -- dist src/version.ts)" ]; then
            git diff --stat -- dist src/version.ts
            git status --porcelain -- dist src/version.ts
            echo "::error::dist/ or src/version.ts in the tagged commit differs from a fresh build, or the build made a file that is not committed. Run npm run build, commit dist/ and tag again."
            exit 1
          fi

      - name: Dist size budget
        run: npm run size

      - name: Manifest matches dist (.js names only)
        run: |
          npm run manifest:selftest
          npm run manifest

      - name: Speed and size claims in the docs have their evidence
        run: |
          npm run claims:selftest
          npm run claims

      - name: Emitted syntax is ES2021 and needs no post-Chromium-85 built-in
        # parse and token rules only; the debt-growth check against main is the validate workflow's (the checkout here has no main to compare with)
        run: |
          npm run syntax:selftest
          node tools/check-es-syntax.mjs --no-base

      - name: i18n placement (runtime, tables and call sites per built file)
        # reads the module list of the build above (contract i18n, D7)
        run: node tools/check-i18n.mjs --ci --placement

      - name: Generate CycloneDX SBOM (production dependencies)
        # the tool is a pinned devDependency, installed from the lockfile by npm ci
        run: npm run sbom

      - name: Release title (the tag without the v)
        id: title
        env:
          TAG: ${{ github.ref_name }}
        run: echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance of the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.js
            dist/*.js.br
            dist/*.js.gz
            sbom.cdx.json
            THIRD-PARTY-NOTICES.md

      - name: Attest the SBOM for the card bundles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.js
          sbom-path: sbom.cdx.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.title.outputs.name }}
          # the card (HACS installs every .js asset), its lazy chunks (magic-card-anim-runtime.js) and
          # the animation studio the magic-card-utils panel loads; the .br and .gz copy of each (HA serves them); plus the SBOM and licence notices
          files: |
            dist/*.js
            dist/*.js.br
            dist/*.js.gz
            sbom.cdx.json
            THIRD-PARTY-NOTICES.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          # a tag with a hyphen (2026.10.11-beta.1, -rc.1) is a real pre-release and never takes the Latest badge
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
