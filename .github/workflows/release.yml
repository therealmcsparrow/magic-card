name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # the card (HACS installs every .js asset), its lazy chunks (magic-card-anim-runtime.js) and
          # the animation studio the magic-card-utils panel loads
          files: dist/*.js
          fail_on_unmatched_files: true
          generate_release_notes: true
