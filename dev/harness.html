<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Card editor harness</title>
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff;
    --secondary-background-color:#f2f3f5; --primary-text-color:#212121; --secondary-text-color:#5f6368;
    --divider-color:rgba(0,0,0,.12); --warning-color:#ff9800; --error-color:#db4437; --success-color:#43a047;
    --text-primary-color:#fff; color-scheme: light; }
  :root[data-theme="dark"] { --primary-background-color:#111111; --card-background-color:#1c1c1c;
    --secondary-background-color:#282a2d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12); color-scheme: dark; }
  body { margin:0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; background:#9aa0a6; }
  /* Mirrors HA's ha-dialog (wa-dialog): a shadow-root boundary and a dialog part with
     transform: translate(...) + overflow: hidden, which makes it the containing block of
     position: fixed descendants and clips them. Kept permanently so menus can't regress. */
  ha-mock-dialog { display:block; }
  .dialog { margin:24px auto; width:calc(var(--w) + 440px); background:var(--card-background-color); border-radius:16px; display:flex; flex-direction:column; height:860px; color:var(--primary-text-color); }
  .title { padding:16px 24px; font-size:1.25rem; border-bottom:1px solid var(--divider-color); }
  .body { flex:1; min-height:0; display:grid; grid-template-columns: var(--w) 1fr; }
  #pane { overflow:auto; border-right:1px solid var(--divider-color); }
  #preview { background:var(--primary-background-color); padding:24px; overflow:auto; }
  .foot { padding:12px 16px; border-top:1px solid var(--divider-color); text-align:right; }
</style>
</head>
<body>
  <ha-mock-dialog class="dialog">
    <div class="title">Magic Card Configuration</div>
    <div class="body"><div id="pane"></div><div id="preview"></div></div>
    <div class="foot">Cancel · Save</div>
  </ha-mock-dialog>
  <script src="./shims.js"></script>
  <script type="module" src="../.harness-build/magic-card.js"></script>
  <!-- the editor is a lazy chunk: load it before the harness scripts create magic-card-editor -->
  <script type="module">
    await window.MagicCard.loadEditor();
    for (const src of ['./harness.js', './harness-b6.js', './harness-popup.js']) {
      await new Promise((r) => { const s = document.createElement('script'); s.src = src; s.onload = r; document.body.append(s); });
    }
  </script>
</body>
</html>
