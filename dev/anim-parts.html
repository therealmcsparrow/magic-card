<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Card icon parts harness</title>
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff;
    --secondary-background-color:#f2f3f5; --primary-text-color:#212121; --secondary-text-color:#5f6368;
    --divider-color:rgba(0,0,0,.12); --warning-color:#ff9800; --error-color:#db4437; --success-color:#43a047;
    --state-icon-color:#44739e; --text-primary-color:#fff; color-scheme: light; }
  :root[data-theme="dark"] { --primary-background-color:#111111; --card-background-color:#1c1c1c;
    --secondary-background-color:#282a2d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12); --state-icon-color:#7ab1e0; color-scheme: dark; }
  html, body { height:100%; margin:0; }
  body { font-family: Roboto, "Segoe UI", system-ui, sans-serif; background:var(--primary-background-color); color:var(--primary-text-color); overflow:hidden; }
  /* like the studio v2 grid: layers | stage | inspector */
  .studio { display:grid; grid-template-columns:240px minmax(0,1fr) 320px; height:100vh; }
  .col { min-height:0; overflow:auto; box-sizing:border-box; padding:16px; background:var(--card-background-color); }
  .layers { border-right:1px solid var(--divider-color); }
  .inspector { border-left:1px solid var(--divider-color); }
  .col h2 { margin:0 0 12px; font-size:0.8125rem; font-weight:500; color:var(--secondary-text-color); }
  .center { min-width:0; min-height:0; display:grid; }
  mcas-stage { display:block; min-height:0; }
  /* the plain card page (view=card) */
  .cards { display:none; padding:24px; gap:24px; grid-template-columns:repeat(2, 360px); align-content:start; }
  body.view-card .studio { display:none; }
  body.view-card .cards { display:grid; }
  .cards h3 { margin:0 0 8px; font-size:0.875rem; font-weight:500; color:var(--secondary-text-color); }
</style>
<script>
  (() => {
    const q = new URLSearchParams(location.search);
    document.documentElement.dataset.theme = q.get('theme') || 'light';
    // the harness has no HA icon database: a fake mdi pack serves the real MDI path data
    const PATHS = {
      'mdi:bell-ring': 'M21,19V20H3V19L5,17V11C5,7.9 7.03,5.17 10,4.29C10,4.19 10,4.1 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.1 14,4.19 14,4.29C16.97,5.17 19,7.9 19,11V17L21,19M14,21A2,2 0 0,1 12,23A2,2 0 0,1 10,21M19.75,3.19L18.33,4.61C20.04,6.3 21,8.6 21,11H23C23,8.07 21.84,5.25 19.75,3.19M1,11H3C3,8.6 3.96,6.3 5.67,4.61L4.25,3.19C2.16,5.25 1,8.07 1,11Z',
      'mdi:bell': 'M21,19V20H3V19L5,17V11C5,7.9 7.03,5.17 10,4.29C10,4.19 10,4.1 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.1 14,4.19 14,4.29C16.97,5.17 19,7.9 19,11V17L21,19M14,21A2,2 0 0,1 12,23A2,2 0 0,1 10,21',
      'mdi:fan': 'M12,11A1,1 0 0,0 11,12A1,1 0 0,0 12,13A1,1 0 0,0 13,12A1,1 0 0,0 12,11M12.5,2C17,2 17.11,5.57 14.75,6.75C13.76,7.24 13.32,8.29 13.13,9.22C13.61,9.42 14.03,9.73 14.35,10.13C18.05,8.13 22.03,8.92 22.03,12.5C22.03,17 18.46,17.1 17.28,14.73C16.78,13.74 15.72,13.3 14.79,13.11C14.59,13.59 14.28,14 13.88,14.34C15.87,18.03 15.08,22 11.5,22C7,22 6.91,18.42 9.27,17.24C10.25,16.75 10.69,15.71 10.89,14.79C10.4,14.59 9.97,14.27 9.65,13.87C5.96,15.85 2,15.07 2,11.5C2,7 5.56,6.89 6.74,9.26C7.24,10.25 8.29,10.68 9.22,10.87C9.41,10.39 9.73,9.97 10.14,9.65C8.15,5.96 8.94,2 12.5,2Z',
      'mdi:lock': 'M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z',
      'mdi:ceiling-fan': 'M8 3V5H11V10.27C10.38 10.63 10 11.29 10 12V13H14V12C14 11.29 13.62 10.63 13 10.27V5H16V3H8M6 12C3.79 12 2 12.67 2 13.5S3.79 15 6 15 10 14.33 10 13.5 8.21 12 6 12M18 12C15.79 12 14 12.67 14 13.5S15.79 15 18 15 22 14.33 22 13.5 20.21 12 18 12M10 14V15C10 15.72 10.38 16.38 11 16.73C11.62 17.09 12.38 17.09 13 16.73C13.62 16.38 14 15.71 14 15V14H10Z',
    };
    window.__mdiPaths = PATHS;
    window.customIconsets = { mdi: async (name) => (PATHS[`mdi:${name}`] ? { path: PATHS[`mdi:${name}`], viewBox: '0 0 24 24' } : undefined) };
  })();
</script>
</head>
<body>
  <div class="studio" id="studio">
    <aside class="col layers"><h2>Icon parts</h2><mc-anim-parts-layers id="layers"></mc-anim-parts-layers></aside>
    <div class="center">
      <mcas-stage id="stage"><mc-anim-parts-overlay id="overlay" slot="overlay"></mc-anim-parts-overlay></mcas-stage>
    </div>
    <aside class="col inspector"><mc-anim-part-inspector id="insp"></mc-anim-part-inspector><p id="insp-empty" class="hint"></p></aside>
  </div>
  <div class="cards" id="cards"></div>
  <script src="./shims.js"></script>
  <script type="module" src="../.harness-build/magic-card.js"></script>
  <script defer src="../.harness-build/anim-parts/anim-parts.js"></script>
  <script type="module">
    (() => {
      const q = new URLSearchParams(location.search);
      const P = window.__parts;
      const dark = document.documentElement.dataset.theme === 'dark';
      const base = () => ({ ...P.newAnimationDoc('keyframes', 'bell', 'Doorbell ring'), duration: 1.6, target: 'icon', keyframes: [{ at: 0, opacity: 1 }, { at: 100, opacity: 1 }] });
      /** The harness bell: the clapper swings, the waves (a group) draw on. */
      const BELL = {
        ...base(),
        rig: {
          icon: 'mdi:bell-ring',
          parts: [
            { id: 'body', name: 'Bell', from: [0] },
            { id: 'clapper', name: 'Clapper', from: [1], origin: [12, 19.5] },
            { id: 'wave_r', name: 'Right wave', from: [2] },
            { id: 'wave_l', name: 'Left wave', from: [3] },
          ],
          groups: [{ id: 'waves', name: 'Sound waves', parts: ['wave_r', 'wave_l'] }],
        },
        tracks: [
          { target: 'part:body', keyframes: [{ at: 0, transform: { rotate: -6 } }, { at: 50, transform: { rotate: 6 } }, { at: 100, transform: { rotate: -6 } }] },
          { target: 'part:clapper', keyframes: [{ at: 0, transform: { rotate: 22 } }, { at: 50, transform: { rotate: -22 } }, { at: 100, transform: { rotate: 22 } }] },
          { target: 'group:waves', keyframes: [{ at: 0, draw: 0, opacity: 1 }, { at: 55, draw: 1 }, { at: 85, draw: 1, opacity: 1 }, { at: 100, draw: 1, opacity: 0 }] },
        ],
      };
      BELL.rig.parts[0].origin = [12, 3];

      if (q.get('view') === 'card') {
        document.body.classList.add('view-card');
        const FAN = { ...base(), id: 'fan', name: 'Fan', duration: 1.2, easing: 'linear', rig: { icon: 'mdi:fan', parts: [{ id: 'blades', name: 'Blades', from: [0], origin: [12, 12] }] }, tracks: [{ target: 'part:blades', keyframes: [{ at: 0, transform: { rotate: 0 } }, { at: 100, transform: { rotate: 360 } }] }] };
        const LOCK = { ...base(), id: 'lock', name: 'Lock', rig: { icon: 'mdi:lock', parts: [{ id: 'lock', name: 'Lock', from: [0] }] }, tracks: [{ target: 'part:lock', keyframes: [{ at: 0, transform: { scale: 1 } }, { at: 50, transform: { scale: 0.85 } }, { at: 100, transform: { scale: 1 } }] }] };
        const CFAN = { ...base(), id: 'cfan', name: 'Ceiling fan', rig: { icon: 'mdi:ceiling-fan', parts: [{ id: 'lamp', name: 'Lamp', from: [3] }, { id: 'left', name: 'Left blade', from: [1] }, { id: 'right', name: 'Right blade', from: [2] }, { id: 'motor', name: 'Motor', from: [0] }] }, tracks: [{ target: 'part:lamp', keyframes: [{ at: 0, opacity: 1 }, { at: 50, opacity: 0.2 }, { at: 100, opacity: 1 }] }, { target: 'part:left', keyframes: [{ at: 0, transform: { y: 0 } }, { at: 50, transform: { y: -2 } }, { at: 100, transform: { y: 0 } }] }, { target: 'part:right', keyframes: [{ at: 0, transform: { y: 0 } }, { at: 50, transform: { y: -2 } }, { at: 100, transform: { y: 0 } }] }] };
        const GONE = { ...base(), id: 'gone', name: 'Unresolvable', keyframes: [{ at: 0, transform: { scale: 1 } }, { at: 50, transform: { scale: 1.15 } }, { at: 100, transform: { scale: 1 } }], rig: { icon: 'nopack:bell-ring', parts: [{ id: 'clapper', name: 'Clapper', from: [1] }] }, tracks: [{ target: 'part:clapper', keyframes: [{ at: 0, transform: { rotate: 20 } }, { at: 100, transform: { rotate: -20 } }] }] };
        const mod = (id, icon, doc, extra = {}) => ({ id, type: 'icon', icon, size: '72px', design: { animations: [{ id: `a-${id}`, preset: `custom:${doc}` }] }, ...extra });
        const info = (id, icon, doc, name) => ({ id, type: 'info', icon, show_icon: true, name, state: 'Ringing', design: { animations: [{ id: `a-${id}`, preset: `custom:${doc}` }] } });
        const cards = [
          ['Rigged icons', [[mod('bell', 'mdi:bell-ring', 'bell'), mod('fan', 'mdi:fan', 'fan')], [mod('lock', 'mdi:lock', 'lock'), mod('cfan', 'mdi:ceiling-fan', 'cfan')]]],
          ['Info module and an unresolvable rig', [[info('ibell', 'mdi:bell-ring', 'bell', 'Front door')], [mod('gone', 'mdi:bell', 'gone')]]],
        ];
        const host = document.getElementById('cards');
        const hass = { states: {}, language: 'en', themes: { darkMode: dark, themes: {} }, connection: { subscribeEvents: async () => () => {}, subscribeMessage: () => Promise.reject({ code: 'unknown_command' }) }, callWS: () => Promise.reject({ code: 'unknown_command' }) };
        window.__cards = [];
        customElements.whenDefined('magic-card').then(() => {
          for (const [title, rows] of cards) {
            const wrap = document.createElement('div');
            wrap.innerHTML = `<h3>${title}</h3>`;
            const card = document.createElement('magic-card');
            card.setConfig({ type: 'custom:magic-card', custom_animations: [BELL, FAN, LOCK, CFAN, GONE], rows: rows.map((mods, r) => ({ id: `r${r}`, columns: mods.map((m, c) => ({ id: `r${r}c${c}`, modules: [m] })) })) });
            card.hass = hass;
            wrap.appendChild(card);
            host.appendChild(wrap);
            window.__cards.push(card);
          }
        });
        return;
      }

      const stage = document.getElementById('stage');
      const panels = [document.getElementById('layers'), document.getElementById('overlay'), document.getElementById('insp')];
      const empty = document.getElementById('insp-empty');
      P.changes = [];
      P.setDoc = (doc) => {
        P.doc = doc;
        stage.doc = doc;
        for (const p of panels) p.doc = doc;
        P.sync();
      };
      P.setSel = (sel) => {
        P.sel = sel;
        for (const p of panels) p.selection = sel;
        P.sync();
      };
      /** Like the shell: show the panels panelsFor() gives for the doc and selection. */
      P.sync = () => {
        const tags = (place) => P.panelsFor(place, P.doc, P.sel ?? { kind: 'none' }).map((x) => x.tag);
        document.getElementById('overlay').hidden = !tags('stage-tool').includes('mc-anim-parts-overlay');
        const insp = tags('inspector').includes('mc-anim-part-inspector');
        document.getElementById('insp').hidden = !insp;
        empty.textContent = insp ? '' : 'Select a part to see its settings.';
      };
      // the overlay sits inside the stage: its events bubble to the stage listener
      for (const p of [panels[0], panels[2], stage]) {
        p.addEventListener('doc-change', (e) => {
          P.changes.push({ label: e.detail.label, transient: !!e.detail.transient, src: e.composedPath()[0]?.localName, at: Math.round(performance.now()) });
          P.setDoc(e.detail.doc);
        });
        p.addEventListener('selection-change', (e) => P.setSel(e.detail.selection));
      }
      stage.theme = dark ? 'dark' : 'light';
      P.stage = stage;
      P.layers = panels[0];
      P.overlay = panels[1];
      P.insp = panels[2];
      P.BELL = BELL;
      P.setDoc(q.get('doc') === 'empty' ? base() : BELL);
      const sel = q.get('sel');
      P.setSel(sel ? { kind: 'target', target: sel, targets: sel.split(',') } : { kind: 'none' });
      if (q.get('time')) customElements.whenDefined('magic-card').then(() => setTimeout(() => stage.seek(Number(q.get('time')) * stage.cycle), 600));
    })();
  </script>
</body>
</html>
