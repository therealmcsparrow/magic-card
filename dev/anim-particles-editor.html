<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magic Card particle designer harness</title>
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff;
    --secondary-background-color:#f2f3f5; --primary-text-color:#212121; --secondary-text-color:#5f6368;
    --divider-color:rgba(0,0,0,.12); --warning-color:#ff9800; --error-color:#db4437; --success-color:#43a047;
    --text-primary-color:#fff; color-scheme: light; }
  :root[data-theme="dark"] { --primary-background-color:#111111; --card-background-color:#1c1c1c;
    --secondary-background-color:#282a2d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12); color-scheme: dark; }
  html, body { margin:0; }
  body { font-family: Roboto, "Segoe UI", system-ui, sans-serif; background:var(--primary-background-color); color:var(--primary-text-color); }
  /* like the studio's inspector column (or its wide bottom panel): a surface with 16px padding */
  #col { box-sizing:border-box; width:var(--w); margin:0; padding:16px; background:var(--card-background-color); border-right:1px solid var(--divider-color); min-height:100vh; }
  #col h2 { margin:0 0 16px; font-size:1rem; font-weight:500; }
</style>
</head>
<body>
  <div id="col"><h2>Particles</h2></div>
  <script src="./shims.js"></script>
  <script type="module" src="../.harness-build/magic-card.js"></script>
  <script defer src="../.harness-build/anim-particles-editor.js"></script>
  <script defer src="./anim-particles-editor.js"></script>
</body>
</html>
