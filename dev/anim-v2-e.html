<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animation studio v2: states and value bindings</title>
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff;
    --secondary-background-color:#f2f3f5; --primary-text-color:#212121; --secondary-text-color:#5f6368;
    --divider-color:rgba(0,0,0,.12); --warning-color:#ff9800; --error-color:#db4437; --success-color:#43a047;
    --state-icon-color:#44739e; --text-primary-color:#fff; color-scheme: light; }
  :root[data-theme="dark"] { --primary-background-color:#111111; --card-background-color:#1c1c1c;
    --secondary-background-color:#282a2d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
    --divider-color:rgba(225,225,225,.12); --state-icon-color:#9fbcd9; color-scheme: dark; }
  body { margin:0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; background:var(--primary-background-color); color:var(--primary-text-color); }
  main { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:16px; padding:16px; box-sizing:border-box; height:100vh; }
  .left { display:grid; grid-template-rows:auto minmax(0, 1fr); gap:16px; min-width:0; }
  .cards { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; }
  .cards > div { min-width:0; }
  .cards h2, .insp h3 { margin:0 0 8px; font-size:0.8125rem; font-weight:500; color:var(--secondary-text-color); }
  #stage { position:relative; border-radius:12px; border:1px solid var(--divider-color); overflow:hidden;
    background-color: color-mix(in srgb, var(--primary-text-color) 6%, var(--primary-background-color));
    background-image: radial-gradient(color-mix(in srgb, var(--primary-text-color) 16%, transparent) 1px, transparent 1px);
    background-size: 16px 16px; display:grid; place-items:center; }
  #stage .frame { width:min(360px, 90%); margin-bottom:64px; }
  .insp { background:var(--card-background-color); border:1px solid var(--divider-color); border-radius:12px; padding:16px; overflow:auto; display:grid; align-content:start; gap:12px; }
  .insp h3 { margin:0; color:var(--primary-text-color); font-size:0.875rem; }
  .insp h3 + * { margin-bottom:8px; }
</style>
</head>
<body>
  <main>
    <div class="left">
      <div class="cards">
        <div><h2>Fan: rotation speed from percentage</h2><div id="fan"></div></div>
        <div><h2>Lamp: states with crossfade, colour from brightness</h2><div id="lamp"></div></div>
      </div>
      <div id="stage"><div class="frame"></div></div>
    </div>
    <aside class="insp" id="insp" aria-label="Inspector"></aside>
  </main>
  <script src="./shims.js"></script>
  <script type="module" src="../.harness-build/magic-card.js"></script>
  <script defer src="../.harness-build/anim-v2-e/anim-v2-e.js"></script>
</body>
</html>
